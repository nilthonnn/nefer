<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#16191B">
<title>Análisis RCM · FixMate</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* rcm:piel:inicio */
/* rcm:piel:fin */

/* ------------------------------------------- lo propio de esta pantalla
 * Es trabajo de mesa: dos columnas, el arbol a la izquierda y el modo de
 * falla abierto a la derecha. Lo demas lo pone la piel.
 */
.hoja { max-width:1140px; margin:0 auto; padding:1.2rem 0 3rem; }
.rejilla { display:grid; grid-template-columns:330px 1fr; gap:1rem;
           align-items:start; }
@media (max-width:900px) { .rejilla { grid-template-columns:1fr; } }

/* El arbol del analisis: funcion, falla funcional, modo. */
.arbol { background:var(--card); border:1px solid var(--rule);
         border-radius:6px; padding:.6rem; }
.arbol .fn { font-weight:700; font-size:.9rem; margin:.8rem 0 .1rem; }
.arbol .est { color:var(--ink-3); font-size:.78rem; padding-left:.1rem; }
.arbol .ff { color:var(--ink-2); font-size:.82rem; margin:.4rem 0 .1rem;
             padding-left:.5rem; }
.arbol button { display:block; width:100%; margin:.3rem 0 0;
                background:var(--paper); font-size:.84rem; line-height:1.35;
                padding:.45rem .55rem; }
.arbol button.activo { border-color:var(--accent); background:var(--accent-soft); }

/* Una ficha de dato: etiqueta a la izquierda, valor a la derecha. */
.campo { display:grid; grid-template-columns:190px 1fr; gap:.15rem .9rem;
         font-size:.92rem; padding:.45rem 0; border-top:1px solid var(--rule-2); }
.campo > span:first-child { font-family:var(--mono); font-size:.68rem;
         letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); }
@media (max-width:620px) { .campo { grid-template-columns:1fr; } }

/* Las tres respuestas del arbol. Del mismo tamano, en la misma fila y en el
   mismo orden siempre: si «sin evaluar» fuera mas chico o estuviera mas
   abajo, dejaria de usarse y «no lo miramos» se registraria como
   «decidimos que no». Sin elegir, los tres son neutros: el color aparece
   cuando hay respuesta, no antes. */
.pregunta { border-top:1px solid var(--rule-2); padding:.75rem 0; }
.opciones { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
            gap:.5rem; max-width:26rem; margin-top:.5rem; }
.opciones button { text-align:center; padding:.5rem .4rem; }
.op-si[aria-pressed="true"] { background:var(--ok); border-color:var(--ok);
            color:var(--paper); font-weight:700; }
.op-no[aria-pressed="true"] { background:var(--mal); border-color:var(--mal);
            color:var(--paper); font-weight:700; }
.op-nd[aria-pressed="true"] { background:var(--ink-3); border-color:var(--ink-3);
            color:var(--paper); font-weight:700; }

/* El dictamen, con el camino que lo produjo. El borde del costado dice de
   que clase es sin leer: proactiva, por defecto, o bloqueada por la guarda. */
.dictamen { background:var(--card); border:1px solid var(--rule);
            border-left:4px solid var(--accent); border-radius:0 6px 6px 0;
            padding:1rem 1.1rem; margin-bottom:.8rem; }
.dictamen.proactiva { border-left-color:var(--ok); }
.dictamen.defecto { border-left-color:var(--obs); }
.dictamen.bloqueada { border-left-color:var(--mal); }
.estrategia { font-family:var(--cond); font-size:1.5rem; letter-spacing:.01em;
              line-height:1.1; }
.camino { counter-reset:paso; margin:.8rem 0 0; padding:0; list-style:none; }
.camino li { counter-increment:paso; position:relative; padding:.45rem 0 .45rem 1.9rem;
             border-top:1px solid var(--rule-2); font-size:.86rem; }
.camino li::before { content:counter(paso); position:absolute; left:0; top:.5rem;
             width:1.25rem; height:1.25rem; border-radius:50%;
             background:var(--card-2); color:var(--ink-3);
             font-family:var(--mono); font-size:.66rem; display:grid;
             place-items:center; }
.camino .resp { color:var(--accent); font-weight:700; }

/* El panel de las siete preguntas. */
.q { display:flex; gap:.6rem; align-items:flex-start; padding:.5rem 0;
     border-top:1px solid var(--rule-2); font-size:.92rem; }
.q .marca { flex:0 0 1.1rem; font-weight:900; text-align:center; }
.q.si .marca { color:var(--ok); }
.q.no .marca { color:var(--obs); }
.progreso { height:5px; background:var(--rule); border-radius:3px;
            overflow:hidden; margin:.5rem 0 .2rem; }
.progreso > i { display:block; height:100%; background:var(--accent); }

/* El tablero y el resumen por modo. */
.numeros { display:flex; flex-wrap:wrap; gap:.6rem; }
.numeros > div { background:var(--card-2); border:1px solid var(--rule-2);
                 border-radius:6px; padding:.5rem .8rem; min-width:7rem; }
.numeros b { display:block; font-family:var(--cond); font-size:1.5rem;
             letter-spacing:.01em; }
table { width:100%; border-collapse:collapse; font-size:.86rem; }
th, td { text-align:left; padding:.45rem .5rem; vertical-align:top;
         border-bottom:1px solid var(--rule-2); }
th { font-family:var(--mono); font-size:.66rem; letter-spacing:.06em;
     text-transform:uppercase; color:var(--ink-3); font-weight:400; }
tr.grave td { background:var(--mal-soft); }

/* Un hallazgo de la ronda, dentro de la ficha del modo. */
.hallazgo { border-left:3px solid var(--obs); background:var(--obs-soft);
            padding:.4rem .6rem; border-radius:0 4px 4px 0; margin-bottom:.4rem;
            font-size:.88rem; }
</style>
</head>
