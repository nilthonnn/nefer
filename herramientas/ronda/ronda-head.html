<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16191B">
<title>Ronda CIL · FixMate</title>
<link rel="icon" href="../app/icono-192.png">
<link rel="apple-touch-icon" href="../app/apple-touch-icon.png">
<style>
/* ronda:piel:inicio */
/* ronda:piel:fin */

/* --------------------------------------------- lo propio de esta pantalla
 * Un telefono, con guantes, al arranque del turno. Todo lo de aqui sale de
 * eso: botones que se tocan sin mirar, un punto a la vez, y nada que
 * obligue a desplazar la pantalla para contestar.
 */
.lam { max-width:560px; margin:0 auto; padding:14px 0 20px;
       min-height:calc(100dvh - 3rem); display:flex; flex-direction:column; }
.lam button { width:100%; margin-bottom:.6rem; }
/* La segunda linea de un boton explica el primero: va debajo, no al lado. */
.lam button .tenue { display:block; font-weight:400; margin-top:.15rem; }
.crece { flex:1; }
/* La lamina es una columna flexible: sin esto, un chip suelto se estira de
   borde a borde y deja de leerse como etiqueta. */
.lam > .chip { align-self:flex-start; }

/* Durante un punto la barra se va. No es un descuido de identidad: la regla
   de esta pantalla es un punto a la vez a pantalla completa, y en un
   telefono de 844 px los tres botones de respuesta tienen que entrar sin
   desplazar. La barra vuelve en todas las demas pantallas. */
body.en-punto .barra { display:none; }
body.en-punto .lam { min-height:100dvh; }

/* Los tres botones de respuesta. «No pude ver» mide exactamente lo mismo que
   «OK» y esta en la misma columna: si fuera mas chico o estuviera mas abajo,
   el operador marcaria OK, y un OK falso contamina la ronda entera. */
.grande { min-height:56px; font-size:1.15rem; font-weight:800;
          text-align:center; padding:.7rem .9rem; }
.b-ok { background:var(--ok); border-color:var(--ok); color:var(--paper); }
.b-mal { background:var(--obs); border-color:var(--obs); color:var(--paper); }
.b-sin { background:var(--ink-3); border-color:var(--ink-3); color:var(--paper); }
.grande .tenue { color:inherit; opacity:.85; font-size:.8rem; }

/* El punto y su criterio de aceptacion, que es lo unico que se lee de lejos. */
.punto { font-family:var(--cond); font-size:2rem; line-height:1.1;
         margin:.4rem 0 .6rem; }
.criterio { font-size:1.15rem; background:var(--card); border:1px solid var(--rule);
            border-left:4px solid var(--accent); border-radius:0 6px 6px 0;
            padding:.8rem .9rem; margin-bottom:.6rem; }
.pie { display:flex; justify-content:space-between; align-items:center;
       font-family:var(--mono); font-size:.72rem; color:var(--ink-3); }
.progreso { height:5px; background:var(--rule); border-radius:3px;
            overflow:hidden; margin:.5rem 0 1rem; }
.progreso > i { display:block; height:100%; background:var(--accent);
                transition:width .2s; }

/* El dialogo de la nota. */
.velo { position:fixed; inset:0; background:color-mix(in srgb, var(--paper) 92%, transparent);
        display:flex; align-items:flex-end; padding:14px; z-index:9; }
.velo > div { max-width:560px; margin:0 auto; width:100%; background:var(--card);
              border:1px solid var(--rule); border-radius:10px; padding:1rem;
              box-shadow:var(--lift); }
.fila { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.fila button { margin:0; }
textarea, input[type=text] { width:100%; font:inherit; color:var(--ink);
            background:var(--paper); border:1px solid var(--rule);
            border-radius:6px; padding:.6rem; min-height:52px; }

/* El resultado de la ronda. */
.res-ok { border-left:4px solid var(--ok); background:var(--ok-soft); }
.res-mal { border-left:4px solid var(--obs); background:var(--obs-soft); }
.titular { font-family:var(--cond); font-size:1.4rem; }
</style>
</head>
