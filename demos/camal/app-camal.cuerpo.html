<title>Control de Faenamiento</title>
<style>
  /* Un solo tema, oscuro y a propósito: la app se usa en galpón, de
     madrugada, y con la pantalla al máximo de brillo. Tipografía del
     sistema, sin fuentes remotas: en el camal no hay señal. */
  :root {
    --fondo: #1A1E25;
    --tarjeta: #252A33;
    --tarjeta-alta: #2E343F;
    --campo: #383F4C;
    --borde: #454D5C;
    --texto: #FFFFFF;
    --tenue: #A3ABB9;
    --verde: #00A86B;
    --verde-claro: #00FF95;
    --naranja: #FF9F00;
    --rojo: #D9534F;
    --azul: #2C7BE5;
    --turquesa: #20B2AA;
    --morado: #7C5CD6;
    --tinta: #12151B;
  }

  * { -webkit-tap-highlight-color: rgba(0, 168, 107, 0.25); }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: var(--fondo);
    color: var(--texto);
    margin: 0;
    padding-inline: 16px;
    padding-block: 10px 96px;
    font-size: 15px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }

  h1, h2, h3 { text-wrap: balance; margin: 0; }
  h1 { font-size: 20px; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }

  .cifra { font-variant-numeric: tabular-nums; }

  /* ---- Encabezado ---- */
  .barra-sup {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-block: 6px 12px;
  }
  .barra-sup .titulo { flex: 1; min-width: 0; }
  .barra-sup .titulo span { display: block; font-size: 12px; color: var(--tenue); }
  .insignia {
    background: var(--naranja);
    color: #000;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.05em;
    padding: 3px 7px;
    border-radius: 5px;
    white-space: nowrap;
  }
  .btn-atras {
    background: var(--campo);
    color: var(--texto);
    border: none;
    border-radius: 9px;
    font-size: 20px;
    line-height: 1;
    width: 42px;
    height: 42px;
    cursor: pointer;
    flex: none;
  }

  /* ---- Bloques ---- */
  .tarjeta {
    background: var(--tarjeta);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .rotulo {
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--tenue);

  .tiras { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tira {
    background: var(--tinta);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .tira .valor { font-size: 21px; font-weight: 700; color: var(--verde-claro); }
  .tira .pie { font-size: 12px; color: var(--tenue); }

  /* ---- Controles ---- */
  label { display: block; font-size: 13px; color: var(--tenue); margin-bottom: 4px; }
  .campo-grupo { margin-bottom: 12px; }

  input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid var(--borde);
    background: var(--campo);

  input:disabled, select:disabled { opacity: 0.45; }

  }

  .paso { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; }

    border: 1px solid var(--borde);
    border-radius: 9px;
    font-size: 24px;

  .btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--verde);
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn + .btn { margin-top: 10px; }
  .btn-sec { background: var(--campo); }
  .btn-gris { background: #49505F; }
  .btn-azul { background: var(--azul); }
  .btn-turquesa { background: var(--turquesa); color: #04312F; }
  .btn-morado { background: var(--morado); }
  .btn-rojo { background: var(--rojo); }
  .btn-chico { padding: 11px; font-size: 14px; }
  .btn:disabled { opacity: 0.4; cursor: default; }

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .duo .btn + .btn { margin-top: 0; }

  /* ---- Barra fija de acción (el pulgar vive aquí) ---- */
  .barra-accion {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(to top, var(--fondo) 72%, rgba(26, 30, 37, 0));
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 5;
  }

  /* ---- Lista de lotes ---- */
  .lote {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    background: var(--tarjeta);
    border: 1px solid transparent;
    border-left: 4px solid var(--verde);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    color: var(--texto);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .lote.en-curso { border-left-color: var(--naranja); }
  .lote .col { flex: 1; min-width: 0; }
  .lote .nombre { font-weight: 700; }
  .lote .detalle { font-size: 12.5px; color: var(--tenue); }
  .lote .monto { text-align: right; font-weight: 700; color: var(--verde-claro); white-space: nowrap; }
  .lote .monto small { display: block; font-weight: 400; color: var(--tenue); font-size: 12px; }

  .chip {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--verde);
    color: #04241A;
  }
  .chip.abierto { background: var(--naranja); color: #2B1A00; }

  /* ---- Progreso del lote ---- */
  .progreso {
    height: 8px;
    background: var(--tinta);
    border-radius: 99px;
    overflow: hidden;
    margin-top: 10px;
  }
  .progreso i { display: block; height: 100%; background: var(--verde); border-radius: 99px; }

  .correlativo { text-align: center; padding-block: 4px 12px; }
  .correlativo .num { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .correlativo .de { font-size: 14px; color: var(--tenue); }

  /* ---- Pesadas registradas ---- */
  .pesadas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .pesada {
    background: var(--tinta);
    border: 1px solid var(--borde);
    color: var(--texto);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .pesada b { color: var(--tenue); font-weight: 700; margin-right: 4px; }

  .vacio { color: var(--tenue); font-size: 14px; text-align: center; padding: 18px 8px; }

  /* ---- Cierre del lote: peso, precio y total, en ese orden ---- */
  .paso-cierre {
    display: grid;
    grid-template-columns: 30px 1fr;
    gap: 12px;
    align-items: start;
    padding-block: 12px;
  }
  .paso-cierre + .paso-cierre { border-top: 1px solid var(--borde); }
  .paso-cierre .orden {
    background: var(--tinta);
    border: 1px solid var(--borde);
    border-radius: 99px;
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--tenue);
  }
  .paso-cierre > div { min-width: 0; }
  .resultado { font-size: 30px; font-weight: 800; line-height: 1.15; }
  .resultado.en-soles { color: var(--verde-claro); }
  .pie-paso { font-size: 12.5px; color: var(--tenue); margin-top: 2px; }

  .aviso {
    background: rgba(217, 83, 79, 0.16);
    border: 1px solid var(--rojo);
    color: #FFC9C7;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 13.5px;
    margin-top: 10px;
  }
  .nota { font-size: 12.5px; color: var(--tenue); margin-top: 8px; }

  /* ---- Gaveta ---- */
  .velo {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 20;
  }
  .gaveta {
    background: var(--tarjeta-alta);
    width: 100%;
    max-width: 520px;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .gaveta h2 { text-align: center; margin-bottom: 12px; }

  /* ---- Exportación ---- */
  .pestanas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .pestanas button {
    background: var(--campo);
    color: var(--tenue);
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 10px;
    font-size: 13.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }
  .pestanas button[aria-pressed="true"] { background: var(--verde); color: #fff; border-color: var(--verde); }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 190px;
    background: var(--tinta);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 9px;
    padding: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    white-space: pre;
    overflow-x: auto;
  }

  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 3px solid var(--verde-claro);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<!-- CUERPO -->
<div id="app"></div>
<div id="gaveta"></div>

<script>
// ---------------------------------------------------------------------------
// Catálogo. Los precios son referenciales: se editan en cada lote y quedan
// guardados con el lote, no aquí.
// ---------------------------------------------------------------------------
// Lo que se pesa en el camal es el degollado —la carcasa— y de ahí salen los
// cueros. El nombre de la categoría es el que se canta en la playa de faenado.
const CATEGORIAS_PESO = [
  { id: "Alpaca degollada",           precio: 14.00 },
  { id: "Alpaca observada degollada", precio: 12.00 },
  { id: "Alpaca vieja degollada",     precio: 11.00 },
  { id: "Llama degollada",            precio: 13.00 },
  { id: "Cordero degollado",          precio: 16.00 },
  { id: "Cuero de alpaca",            precio: 18.00 },
  { id: "Cuero de cordero",           precio: 15.00 }
];

const CATEGORIAS_UNIDAD = [
  { id: "Menudencia de Alpaca",  precio: 25.00 },
  { id: "Menudencia de Cordero", precio: 18.00 }
];

const CLAVE = "camal.jornada.v2";

// ---------------------------------------------------------------------------
// Estado
// ---------------------------------------------------------------------------
let jornada = null;   // { fecha, demo, lotes: [] }
let vista = { pantalla: "jornada", loteId: null, error: "", hoja: "detalle" };

function hoy() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function hora() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}:${String(d.getSeconds()).padStart(2, "0")}`;
}

// La jornada de ejemplo: la app abre mostrando cómo se ve en uso, no vacía.
function jornadaDemo() {
  return {
    fecha: hoy(),
    demo: true,
    correlativoLote: 3,
    lotes: [
      {
        id: 1, tipo: "peso", categoria: "Alpaca degollada", cantidad: 8,
        pesos: [42.5, 39.8, 44.2, 41.0, 38.6, 45.3, 40.1, 43.7],
        precio: 14.00, estado: "culminado", inicio: "06:42:10", fin: "07:05:38"
      },
      {
        id: 2, tipo: "unidad", categoria: "Menudencia de Alpaca", cantidad: 8,
        pesos: [], precio: 25.00, estado: "culminado", inicio: "07:08:02", fin: "07:09:20"
      },
      {
        id: 3, tipo: "peso", categoria: "Cordero degollado", cantidad: 12,
        pesos: [18.4, 17.9, 19.2, 18.8, 16.5],
        precio: null, estado: "abierto", inicio: "07:22:45", fin: null
      }
    ]
  };
}

function cargar() {
  try {
    const crudo = localStorage.getItem(CLAVE);
    if (crudo) {
      const guardada = JSON.parse(crudo);
      if (guardada && Array.isArray(guardada.lotes)) return guardada;
    }
  } catch (e) { /* sin almacenamiento: se trabaja en memoria */ }
  return jornadaDemo();
}

function guardar() {
  try { localStorage.setItem(CLAVE, JSON.stringify(jornada)); } catch (e) { /* ídem */ }
}

// ---------------------------------------------------------------------------
// Números: aquí es donde el prototipo perdía kilos. "38,5" es como se escribe
// el peso en el Perú, y parseFloat lo cortaba en 38 sin decir nada.
// ---------------------------------------------------------------------------
function aNumero(texto) {
  if (texto === null || texto === undefined) return null;
  const limpio = String(texto).trim().replace(/\s/g, "").replace(",", ".");
  if (limpio === "") return null;
  if (!/^-?\d*\.?\d+$/.test(limpio)) return null;
  const n = parseFloat(limpio);
  return Number.isFinite(n) ? n : null;
}

const kg = (n) => n.toFixed(2);
const soles = (n) => n.toFixed(2);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---------------------------------------------------------------------------
// Cálculo
// ---------------------------------------------------------------------------
function pesoLote(lote) {
  return lote.pesos.reduce((a, p) => a + p, 0);
}

function cantidadLote(lote) {
  return lote.tipo === "peso" ? lote.pesos.length : lote.cantidad;
}

// El total existe solo cuando hay precio, y el precio solo se pide al cerrar.
function totalLote(lote) {
  if (lote.precio === null || lote.precio === undefined) return null;
  return lote.tipo === "peso" ? pesoLote(lote) * lote.precio : lote.cantidad * lote.precio;
}

function totalesJornada() {
  let animales = 0, kilos = 0, monto = 0, pendientes = 0;
  jornada.lotes.forEach((l) => {
    animales += cantidadLote(l);
    kilos += pesoLote(l);
    const t = totalLote(l);
    if (t === null) pendientes++; else monto += t;
  });
  return { lotes: jornada.lotes.length, animales, kilos, monto, pendientes };
}

const loteActual = () => jornada.lotes.find((l) => l.id === vista.loteId);

// ---------------------------------------------------------------------------
// Navegación
// ---------------------------------------------------------------------------
function ir(pantalla, loteId) {
  vista.pantalla = pantalla;
  vista.loteId = loteId === undefined ? vista.loteId : loteId;
  vista.error = "";
  pintar();
  window.scrollTo(0, 0);
}

// ---------------------------------------------------------------------------
// Acciones
// ---------------------------------------------------------------------------
function nuevoLote(tipo) {
  vista.nuevo = {
    tipo: tipo,
    categoria: (tipo === "peso" ? CATEGORIAS_PESO : CATEGORIAS_UNIDAD)[0].id,
    cantidad: tipo === "peso" ? 40 : 1
  };
  ir(tipo === "peso" ? "nuevo-peso" : "nuevo-unidad");
}

function crearLote() {
  const cantidad = aNumero(document.getElementById("cantidadLote").value);
  const categoria = document.getElementById("categoriaLote").value;
  const tipo = vista.nuevo.tipo;

  if (cantidad === null || cantidad < 1 || cantidad % 1 !== 0) {
    vista.error = "La cantidad del lote es un número entero de cabezas, desde 1.";
    return pintar();
  }

  jornada.correlativoLote = (jornada.correlativoLote || 0) + 1;
  const lote = {
    id: jornada.correlativoLote,
    tipo: tipo,
    categoria: categoria,
    cantidad: cantidad,
    pesos: [],
    precio: null,
    estado: "abierto",
    inicio: hora(),
    fin: null
  };
  jornada.lotes.push(lote);
  guardar();
  ir(tipo === "peso" ? "pesaje" : "unidad", lote.id);
}

// El corazón del pesaje: se anota el peso y salta solo al correlativo siguiente.
function registrarPeso() {
  const lote = loteActual();
  const campo = document.getElementById("pesoActual");
  const peso = aNumero(campo.value);

  if (peso === null) {
    vista.error = "Escribe el peso en kilos. Se acepta con coma o con punto: 38,5 o 38.5.";
    return pintar();
  }
  if (peso <= 0) {
    vista.error = "El peso tiene que ser mayor que cero.";
    return pintar();
  }
  if (peso > 400) {
    vista.error = `${kg(peso)} kg no es el peso de un animal de camal. Revisa la balanza.`;
    return pintar();
  }

  lote.pesos.push(peso);
  if (lote.pesos.length > lote.cantidad) lote.cantidad = lote.pesos.length;
  guardar();
  vista.error = "";
  pintar();
  const nuevo = document.getElementById("pesoActual");
  if (nuevo) { nuevo.value = ""; nuevo.focus(); }
}

function ampliarCantidad(delta) {
  const lote = loteActual();
  const minimo = Math.max(1, lote.pesos.length);
  lote.cantidad = Math.max(minimo, lote.cantidad + delta);
  guardar();
  pintar();
}

function fijarCantidad(valor) {
  const lote = loteActual();
  const n = aNumero(valor);
  if (n === null || n % 1 !== 0) return;
  lote.cantidad = Math.max(Math.max(1, lote.pesos.length), n);
  guardar();
  pintar();
}

function terminarLote() {
  const lote = loteActual();
  if (lote.tipo === "peso" && lote.pesos.length === 0) {
    vista.error = "El lote no tiene ninguna pesada todavía.";
    return pintar();
  }
  lote.estado = "culminado";
  lote.fin = hora();
  lote.cantidad = lote.tipo === "peso" ? lote.pesos.length : lote.cantidad;
  if (lote.precio === null) {
    const cat = [...CATEGORIAS_PESO, ...CATEGORIAS_UNIDAD].find((c) => c.id === lote.categoria);
    lote.precio = cat ? cat.precio : null;
  }
  guardar();
  ir("culminado", lote.id);
}

function reabrirLote() {
  const lote = loteActual();
  lote.estado = "abierto";
  lote.fin = null;
  guardar();
  ir(lote.tipo === "peso" ? "pesaje" : "unidad", lote.id);
}

function fijarPrecio(valor) {
  const lote = loteActual();
  const p = aNumero(valor);
  vista.error = (valor.trim() !== "" && p === null)
    ? "El precio va en soles, con coma o punto: 14,50 o 14.50."
    : "";
  lote.precio = p === null || p < 0 ? null : p;
  guardar();
  pintar();
}

function fijarUnidades(valor) {
  const lote = loteActual();
  const n = aNumero(valor);
  if (n === null || n < 0 || n % 1 !== 0) return;
  lote.cantidad = n;
  guardar();
  pintar();
}

function pasoUnidades(delta) {
  const lote = loteActual();
  lote.cantidad = Math.max(0, lote.cantidad + delta);
  guardar();
  pintar();
}

function abrirPesada(indice) {
  const lote = loteActual();
  vista.editando = indice;
  pintarGaveta(`
    <h2>N° ${indice + 1} del lote ${lote.id}</h2>
    <div class="campo-grupo">
      <label for="pesoEditado">Peso en kg</label>
      <input type="text" inputmode="decimal" id="pesoEditado" class="grande" value="${lote.pesos[indice]}">
    </div>
    <div class="duo">
      <button class="btn btn-rojo" onclick="borrarPesada()">Eliminar</button>
      <button class="btn" onclick="guardarPesada()">Guardar</button>
    </div>
    <button class="btn btn-sec btn-chico" onclick="cerrarGaveta()">Cancelar</button>
    <p class="nota">Al eliminar una pesada, las siguientes se vuelven a numerar: el correlativo cuenta animales pesados, no huecos.</p>
  `);
}

function guardarPesada() {
  const lote = loteActual();
  const p = aNumero(document.getElementById("pesoEditado").value);
  if (p === null || p <= 0 || p > 400) {
    vista.error = "Peso no válido: escribe kilos mayores que cero.";
    cerrarGaveta();
    return pintar();
  }
  lote.pesos[vista.editando] = p;
  guardar();
  cerrarGaveta();
  pintar();
}

function borrarPesada() {
  const lote = loteActual();
  lote.pesos.splice(vista.editando, 1);
  guardar();
  cerrarGaveta();
  pintar();
}

function vaciarJornada() {
  pintarGaveta(`
    <h2>Empezar jornada real</h2>
    <p class="nota" style="text-align:center">Se borran los ${jornada.lotes.length} lotes de demostración y la app queda en blanco, con la fecha de hoy. Esto no se puede deshacer.</p>
    <div class="duo" style="margin-top:14px">
      <button class="btn btn-sec" onclick="cerrarGaveta()">Cancelar</button>
      <button class="btn btn-rojo" onclick="confirmarVaciado()">Borrar y empezar</button>
    </div>
  `);
}

function confirmarVaciado() {
  jornada = { fecha: hoy(), demo: false, correlativoLote: 0, lotes: [] };
  guardar();
  cerrarGaveta();
  ir("jornada", null);
}

// ---------------------------------------------------------------------------
// Exportación. Dos hojas, porque son dos niveles de dato distintos y mezclarlos
// en un solo archivo es lo que vuelve inservible un Excel.
// ---------------------------------------------------------------------------
function csvDetalle() {
  let csv = "Fecha,Lote,Categoria,N,Peso (kg),Precio x Kg (S/),Subtotal (S/)\n";
  jornada.lotes.filter((l) => l.tipo === "peso").forEach((lote) => {
    lote.pesos.forEach((p, i) => {
      const precio = lote.precio === null ? "" : soles(lote.precio);
      const sub = lote.precio === null ? "" : soles(p * lote.precio);
      csv += `${jornada.fecha},${lote.id},"${lote.categoria}",${i + 1},${kg(p)},${precio},${sub}\n`;
    });
  });
  return csv;
}

function csvResumen() {
  let csv = "Fecha,Lote,Tipo,Categoria,Cantidad,Unidad,Peso total (kg),Precio (S/),Total (S/),Estado,Inicio,Fin\n";
  jornada.lotes.forEach((lote) => {
    const t = totalLote(lote);
    csv += [
      jornada.fecha,
      lote.id,
      lote.tipo === "peso" ? "Pesaje" : "Menudencia",
      `"${lote.categoria}"`,
      cantidadLote(lote),
      lote.tipo === "peso" ? "cabezas" : "unidades",
      lote.tipo === "peso" ? kg(pesoLote(lote)) : "",
      lote.precio === null ? "" : soles(lote.precio),
      t === null ? "" : soles(t),
      lote.estado === "abierto" ? "En curso" : "Culminado",
      lote.inicio,
      lote.fin || ""
    ].join(",") + "\n";
  });
  return csv;
}

function nombreArchivo(hoja) {
  return `Camal_${jornada.fecha}_${hoja}.csv`;
}

// Cómo sale el archivo depende de dónde esté abierta la app. Como archivo en
// el teléfono, el CSV baja solo. Abierta desde el enlace, la página vive en un
// marco que anula la descarga: ahí el archivo lo entrega el visor, si el que
// mira acepta, y si no queda el texto para copiar.
const enMarco = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

let entregador = null;   // lo pone el visor, si puede; puede quedarse en null

if (enMarco && window.claude && typeof window.claude.use === "function") {
  window.claude.use("downloads").then((d) => {
    entregador = d;
    if (vista.pantalla === "exportar") pintar();
  }).catch(() => { /* sin descarga: queda copiar */ });
}

function textoHoja() {
  return "﻿" + (vista.hoja === "detalle" ? csvDetalle() : csvResumen());
}

function descargarCSV() {
  const blob = new Blob([textoHoja()], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const enlace = document.createElement("a");
  enlace.href = url;
  enlace.download = nombreArchivo(vista.hoja);
  document.body.appendChild(enlace);
  enlace.click();
  enlace.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function entregarCSV() {
  const nota = document.getElementById("notaCopia");
  const nombre = nombreArchivo(vista.hoja);
  entregador.save({ filename: nombre, data: textoHoja() }).then(
    () => { nota.textContent = `${nombre} guardado. Ábrelo con Excel o Google Sheets.`; },
    (e) => {
      nota.textContent = (e && e.code === "declined")
        ? "No se guardó nada. Vuelve a tocar el botón cuando quieras el archivo."
        : "El teléfono no dejó guardar el archivo. Copia el texto y pégalo en la hoja de cálculo.";
    }
  );
}

function copiarCSV() {
  const campo = document.getElementById("textoCSV");
  campo.select();
  const nota = document.getElementById("notaCopia");
  const avisar = (t) => { nota.textContent = t; };
  try {
    navigator.clipboard.writeText(campo.value).then(
      () => avisar("Copiado. Pégalo en Excel o en Google Sheets y usa Datos › Dividir texto en columnas."),
      () => avisar("El texto quedó seleccionado: cópialo a mano.")
    );
  } catch (e) { avisar("El texto quedó seleccionado: cópialo a mano."); }
}

function pintarGaveta(html) {
  document.getElementById("gaveta").innerHTML =
    `<div class="velo" onclick="if (event.target === this) cerrarGaveta()">
       <div class="gaveta" role="dialog" aria-modal="true">${html}</div>
     </div>`;
  const primero = document.querySelector(".gaveta input");
  if (primero) { primero.focus(); primero.select(); }
}

function cerrarGaveta() {
  document.getElementById("gaveta").innerHTML = "";
}

// Pantallas
// ---------------------------------------------------------------------------
function encabezado(titulo, subtitulo, volverA) {
  return `<div class="barra-sup">
    ${volverA ? `<button class="btn-atras" onclick="ir('${volverA}')" aria-label="Volver">‹</button>` : ""}
    <div class="titulo">
      <h1>${esc(titulo)}</h1>
      <span>${esc(subtitulo)}</span>
    </div>
    ${jornada.demo ? '<span class="insignia">DEMO</span>' : ""}
  </div>`;
}

function avisoError() {
  return vista.error ? `<div class="aviso">${esc(vista.error)}</div>` : "";
}

function pantallaJornada() {
  const t = totalesJornada();
  const lotes = jornada.lotes.slice().reverse().map((lote) => {
    const total = totalLote(lote);
    const abierto = lote.estado === "abierto";
    const avance = lote.tipo === "peso"
      ? `${lote.pesos.length} de ${lote.cantidad} pesadas · ${kg(pesoLote(lote))} kg`
      : `${lote.cantidad} unidades`;
    const destino = abierto
      ? (lote.tipo === "peso" ? "pesaje" : "unidad")
      : "culminado";
    return `<button class="lote ${abierto ? "en-curso" : ""}" onclick="ir('${destino}', ${lote.id})">
      <div class="col">
        <div class="nombre">Lote ${lote.id} · ${esc(lote.categoria)}</div>
        <div class="detalle cifra">${avance}</div>
        <div style="margin-top:5px"><span class="chip ${abierto ? "abierto" : ""}">${abierto ? "EN CURSO" : "CULMINADO"}</span></div>
      </div>
      <div class="monto cifra">${total === null ? "—" : "S/ " + soles(total)}<small>${total === null ? "sin precio" : "total"}</small></div>
    </button>`;
  }).join("");

  return encabezado("Jornada del camal", jornada.fecha) + `
    <div class="tarjeta">
      <div class="rotulo">Consolidado del día</div>
      <div class="tiras">
        <div class="tira"><div class="valor cifra">${t.lotes}</div><div class="pie">lotes</div></div>
        <div class="tira"><div class="valor cifra">${t.animales}</div><div class="pie">cabezas y unidades</div></div>
        <div class="tira"><div class="valor cifra">${kg(t.kilos)}</div><div class="pie">kg pesados</div></div>
        <div class="tira"><div class="valor cifra">S/ ${soles(t.monto)}</div><div class="pie">${t.pendientes ? t.pendientes + " lote(s) sin precio" : "monto del día"}</div></div>
      </div>
    </div>

    <div class="duo">
      <button class="btn" onclick="nuevoLote('peso')">Nuevo lote de pesaje</button>
      <button class="btn btn-turquesa" onclick="nuevoLote('unidad')">Nuevo lote de menudencias</button>
    </div>

    <div class="tarjeta" style="margin-top:12px">
      <div class="rotulo">Lotes de la jornada</div>
      ${lotes || '<div class="vacio">Todavía no hay lotes. Empieza con «Nuevo lote de pesaje».</div>'}
    </div>

    <button class="btn btn-gris" onclick="ir('exportar')">Exportar a Excel</button>
    ${jornada.demo ? '<button class="btn btn-sec btn-chico" onclick="vaciarJornada()">Borrar los datos de demostración y empezar la jornada real</button>' : ""}
  `;
}

function pantallaNuevoPeso() {
  const opciones = CATEGORIAS_PESO.map((c) =>
    `<option value="${esc(c.id)}">${esc(c.id)} — referencia S/ ${soles(c.precio)} por kg</option>`).join("");
  return encabezado("Nuevo lote de pesaje", "Cuántas cabezas entran al lote", "jornada") + `
    <div class="tarjeta">
      <div class="campo-grupo">
        <label for="categoriaLote">Categoría del lote</label>
        <select id="categoriaLote">${opciones}</select>
      </div>
      <div class="campo-grupo">
        <label for="cantidadLote">Cantidad a pesar</label>
        <div class="paso">
          <button type="button" onclick="ajustarCampo('cantidadLote', -1)" aria-label="Quitar una">−</button>
          <input type="text" inputmode="numeric" id="cantidadLote" class="grande" value="${vista.nuevo.cantidad}">
          <button type="button" onclick="ajustarCampo('cantidadLote', 1)" aria-label="Sumar una">+</button>
        </div>
        <p class="nota">Es solo el punto de partida: mientras pesas puedes ampliarlo si llegan más animales.</p>
      </div>
      ${avisoError()}
    </div>
    <div class="barra-accion"><button class="btn" onclick="crearLote()">Empezar a pesar</button></div>
  `;
}

function pantallaNuevoUnidad() {
  const opciones = CATEGORIAS_UNIDAD.map((c) =>
    `<option value="${esc(c.id)}">${esc(c.id)} — referencia S/ ${soles(c.precio)} por unidad</option>`).join("");
  return encabezado("Nuevo lote de menudencias", "Se cuenta por unidad, no se pesa", "jornada") + `
    <div class="tarjeta">
      <div class="campo-grupo">
        <label for="categoriaLote">Menudencia de</label>
        <select id="categoriaLote">${opciones}</select>
      </div>
      <div class="campo-grupo">
        <label for="cantidadLote">Cantidad de unidades</label>
        <div class="paso">
          <button type="button" onclick="ajustarCampo('cantidadLote', -1)" aria-label="Quitar una">−</button>
          <input type="text" inputmode="numeric" id="cantidadLote" class="grande" value="${vista.nuevo.cantidad}">
          <button type="button" onclick="ajustarCampo('cantidadLote', 1)" aria-label="Sumar una">+</button>
        </div>
      </div>
      ${avisoError()}
    </div>
    <div class="barra-accion"><button class="btn btn-turquesa" onclick="crearLote()">Abrir el lote</button></div>
  `;
}

function ajustarCampo(id, delta) {
  const campo = document.getElementById(id);
  const n = aNumero(campo.value) || 0;
  campo.value = Math.max(1, Math.round(n) + delta);
}

function pantallaPesaje() {
  const lote = loteActual();
  const hechas = lote.pesos.length;
  const completo = hechas >= lote.cantidad;
  const suma = pesoLote(lote);
  const avance = Math.min(100, lote.cantidad ? (hechas / lote.cantidad) * 100 : 0);

  const pesadas = lote.pesos.map((p, i) =>
    `<button class="pesada" onclick="abrirPesada(${i})"><b>${i + 1}</b>${kg(p)}</button>`).join("");

  const entrada = completo
    ? `<div class="vacio">Las ${lote.cantidad} cabezas del lote están pesadas.<br>Ciérralo, o amplía la cantidad si llegaron más.</div>`
    : `<div class="correlativo">
         <div class="rotulo" style="margin-bottom:2px">${esc(lote.categoria)} número</div>
         <div class="num cifra">${hechas + 1}</div>
         <div class="de">de ${lote.cantidad}</div>
       </div>
       <input type="text" inputmode="decimal" id="pesoActual" class="grande" placeholder="0.0" autocomplete="off"
              onkeydown="if (event.key === 'Enter') registrarPeso()">
       <p class="nota" style="text-align:center">Kilos en la balanza. Con coma o con punto, da igual.</p>`;

  return encabezado(`Lote ${lote.id} · ${lote.categoria}`, `Abierto ${lote.inicio} · ${hechas} pesadas · ${kg(suma)} kg`, "jornada") + `
    <div class="tarjeta">
      ${entrada}
      ${avisoError()}
      <div class="progreso"><i style="width:${avance}%"></i></div>
    </div>

    <div class="tarjeta">
      <div class="rotulo">Cantidad del lote</div>
      <div class="paso">
        <button type="button" onclick="ampliarCantidad(-1)" aria-label="Quitar una cabeza">−</button>
        <input type="text" inputmode="numeric" id="cantidadEnCurso" value="${lote.cantidad}"
               onchange="fijarCantidad(this.value)">
        <button type="button" onclick="ampliarCantidad(1)" aria-label="Sumar una cabeza">+</button>
      </div>
      <p class="nota">Nunca baja de lo ya pesado (${hechas}).</p>
    </div>

    <div class="tarjeta">
      <div class="rotulo">Pesadas del lote · toca una para corregirla</div>
      ${pesadas ? `<div class="pesadas">${pesadas}</div>` : '<div class="vacio">Aún no hay pesadas.</div>'}
      <div class="tiras" style="margin-top:12px">
        <div class="tira"><div class="valor cifra">${hechas}</div><div class="pie">pesadas</div></div>
        <div class="tira"><div class="valor cifra">${kg(suma)}</div><div class="pie">kg acumulados</div></div>
      </div>
      <p class="nota">El precio se pide al cerrar el lote, con la suma ya cuadrada contra la balanza.</p>
    </div>

    <div class="barra-accion">
      ${completo
        ? `<button class="btn" onclick="terminarLote()">Terminar el lote</button>`
        : `<div class="duo">
             <button class="btn btn-sec" onclick="terminarLote()">Terminar lote</button>
             <button class="btn" onclick="registrarPeso()">Registrar N° ${hechas + 1}</button>
           </div>`}
    </div>
  `;
}

function pantallaUnidad() {
  const lote = loteActual();
  const total = lote.precio === null ? null : lote.cantidad * lote.precio;
  return encabezado(`Lote ${lote.id} · ${lote.categoria}`, `Abierto ${lote.inicio} · por unidad`, "jornada") + `
    <div class="tarjeta">
      <div class="paso-cierre">
        <span class="orden">1</span>
        <div>
          <label for="unidadesLote">Cantidad por unidad</label>
          <div class="paso">
            <button type="button" onclick="pasoUnidades(-1)" aria-label="Quitar una">−</button>
            <input type="text" inputmode="numeric" id="unidadesLote" class="grande" value="${lote.cantidad}"
                   onchange="fijarUnidades(this.value)">
            <button type="button" onclick="pasoUnidades(1)" aria-label="Sumar una">+</button>
          </div>
        </div>
      </div>

      <div class="paso-cierre">
        <span class="orden">2</span>
        <div>
          <label for="precioUnidad">Precio por unidad (S/)</label>
          <input type="text" inputmode="decimal" id="precioUnidad" class="grande"
                 value="${lote.precio === null ? "" : soles(lote.precio)}"
                 placeholder="0.00" onchange="fijarPrecio(this.value)">
        </div>
      </div>
      ${avisoError()}

      <div class="paso-cierre">
        <span class="orden">3</span>
        <div>
          <div class="rotulo" style="margin-bottom:2px">Precio total</div>
          <div class="resultado cifra ${total === null ? "" : "en-soles"}">${total === null ? "—" : "S/ " + soles(total)}</div>
          <div class="pie-paso">${lote.cantidad} und × S/ ${lote.precio === null ? "—" : soles(lote.precio)}</div>
        </div>
      </div>
    </div>

    <div class="barra-accion"><button class="btn btn-turquesa" onclick="terminarLote()">Cerrar el lote</button></div>
  `;
}

function pantallaCulminado() {
  const lote = loteActual();
  const esPeso = lote.tipo === "peso";
  const suma = pesoLote(lote);
  const total = totalLote(lote);
  const promedio = esPeso && lote.pesos.length ? suma / lote.pesos.length : 0;

  // Las tres filas van numeradas porque son una secuencia de verdad: primero
  // cuadra el peso contra la balanza, después se pone el precio, y el total
  // sale de los dos. Ese orden es el que evita cobrar sobre una suma a medias.
  const primerRotulo = esPeso ? "Peso total del lote" : "Cantidad del lote";
  const primerValor = esPeso ? `${kg(suma)} kg` : `${lote.cantidad} und`;
  const primerPie = esPeso
    ? `suma de las ${lote.pesos.length} pesadas`
    : "unidades contadas";

  return encabezado("Lote culminado", `Lote ${lote.id} · ${lote.categoria} · ${lote.inicio} a ${lote.fin}`, "jornada") + `
    <div class="tarjeta">
      <div class="rotulo">Lo que salió del lote</div>
      <div class="tiras">
        <div class="tira"><div class="valor cifra">${cantidadLote(lote)}</div><div class="pie">${esPeso ? "cabezas pesadas" : "unidades"}</div></div>
        ${esPeso
          ? `<div class="tira"><div class="valor cifra">${kg(promedio)}</div><div class="pie">kg promedio por cabeza</div></div>`
          : ""}
      </div>
    </div>

    <div class="tarjeta">
      <div class="paso-cierre">
        <span class="orden">1</span>
        <div>
          <div class="rotulo" style="margin-bottom:2px">${primerRotulo}</div>
          <div class="resultado cifra">${primerValor}</div>
          <div class="pie-paso">${primerPie}</div>
        </div>
      </div>

      <div class="paso-cierre">
        <span class="orden">2</span>
        <div>
          <label for="precioLote">Precio por ${esPeso ? "kg" : "unidad"} (S/)</label>
          <input type="text" inputmode="decimal" id="precioLote" class="grande"
                 value="${lote.precio === null ? "" : soles(lote.precio)}"
                 placeholder="0.00" onchange="fijarPrecio(this.value)">
        </div>
      </div>
      ${avisoError()}

      <div class="paso-cierre">
        <span class="orden">3</span>
        <div>
          <div class="rotulo" style="margin-bottom:2px">Precio total</div>
          <div class="resultado cifra ${total === null ? "" : "en-soles"}">${total === null ? "—" : "S/ " + soles(total)}</div>
          <div class="pie-paso">${esPeso ? kg(suma) + " kg" : lote.cantidad + " und"} × S/ ${lote.precio === null ? "—" : soles(lote.precio)}</div>
        </div>
      </div>
    </div>

    ${esPeso ? `<div class="tarjeta">
      <div class="rotulo">Pesadas · toca una para corregirla</div>
      <div class="pesadas">${lote.pesos.map((p, i) => `<button class="pesada" onclick="abrirPesada(${i})"><b>${i + 1}</b>${kg(p)}</button>`).join("")}</div>
    </div>` : ""}

    <button class="btn btn-sec" onclick="reabrirLote()">Reabrir el lote y seguir ${esPeso ? "pesando" : "contando"}</button>
    <div class="barra-accion"><button class="btn" onclick="ir('jornada')">Volver a la jornada</button></div>
  `;
}

function pantallaExportar() {
  const texto = vista.hoja === "detalle" ? csvDetalle() : csvResumen();
  const filas = texto.trim().split("\n").length - 1;
  return encabezado("Exportar a Excel", `${jornada.fecha} · ${nombreArchivo(vista.hoja)}`, "jornada") + `
    <div class="tarjeta">
      <div class="pestanas">
        <button aria-pressed="${vista.hoja === "detalle"}" onclick="vista.hoja='detalle'; pintar()">Detalle por animal</button>
        <button aria-pressed="${vista.hoja === "resumen"}" onclick="vista.hoja='resumen'; pintar()">Resumen por lote</button>
      </div>
      <p class="nota" style="margin-top:0">${vista.hoja === "detalle"
        ? "Una fila por cabeza pesada, con su correlativo dentro del lote. Es la hoja para auditar contra la balanza."
        : "Una fila por lote, pesaje y menudencias juntos. Es la hoja para cuadrar el dinero del día."} ${filas} fila(s).</p>
      <textarea id="textoCSV" readonly spellcheck="false">${esc(texto)}</textarea>
      <p class="nota" id="notaCopia">${!enMarco || entregador
        ? "El archivo sale con separador de coma y marca de tildes: Excel lo abre sin cuadros raros."
        : "Desde este enlace el teléfono no deja descargar: copia el texto y pégalo en Excel o Google Sheets."}</p>
      ${enMarco
        ? (entregador
            ? `<button class="btn btn-gris" onclick="entregarCSV()">Descargar ${esc(nombreArchivo(vista.hoja))}</button>
               <button class="btn btn-sec btn-chico" onclick="copiarCSV()">O copiar el texto de la hoja</button>`
            : `<button class="btn btn-gris" onclick="copiarCSV()">Copiar esta hoja</button>`)
        : `<button class="btn btn-gris" onclick="descargarCSV()">Descargar ${esc(nombreArchivo(vista.hoja))}</button>`}
    </div>
  `;
}

// ---------------------------------------------------------------------------
// Pintado
// ---------------------------------------------------------------------------
function pintar() {
  const lote = loteActual();
  // Si se llega a una pantalla de lote sin lote, se vuelve a la jornada.
  if (["pesaje", "unidad", "culminado"].includes(vista.pantalla) && !lote) vista.pantalla = "jornada";

  let html;
  switch (vista.pantalla) {
    case "nuevo-peso":   html = pantallaNuevoPeso(); break;
    case "nuevo-unidad": html = pantallaNuevoUnidad(); break;
    case "pesaje":       html = pantallaPesaje(); break;
    case "unidad":       html = pantallaUnidad(); break;
    case "culminado":    html = pantallaCulminado(); break;
    case "exportar":     html = pantallaExportar(); break;
    default:             html = pantallaJornada();
  }
  document.getElementById("app").innerHTML = html;

  const peso = document.getElementById("pesoActual");
  if (peso) peso.focus();
}

jornada = cargar();
pintar();
</script>
