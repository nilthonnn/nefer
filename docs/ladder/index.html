<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LadderLab TIA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Curso interactivo de Ladder (LAD) para PLC S7-1200/1500 con TIA Portal: de básico a avanzado, con simulador y retos autocorregidos. Funciona sin conexión.">
<meta name="theme-color" content="#0B3C49">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#13202A; --ink2:#465867; --ink3:#7B8A96; --line:#D8E0E6;
  --acc:#0A7F86; --acc-ink:#FFFFFF; --acc2:#DDF1F1; --on:#169C46; --off:#3A6CD0; --canvas:#FFFFFF;
  --box:#EEF3F7; --bad:#C62828; --bad2:#FDECEC; --good2:#E5F5EA; --warn:#9A5B00; --warn2:#FFF4DE;
  --lamp:#C9D2D9; --hover:rgba(10,127,134,.10); --shadow:0 1px 2px rgba(16,32,42,.06),0 4px 14px rgba(16,32,42,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --panel:#151F26; --ink:#E4ECF1; --ink2:#A7B6C1; --ink3:#7D8D99; --line:#2A3842;
    --acc:#3FC1C6; --acc-ink:#062226; --acc2:#123236; --on:#3DDC74; --off:#5E8DF0; --canvas:#10191F;
    --box:#1B2831; --bad:#FF6B6B; --bad2:#3A1C1F; --good2:#14301F; --warn:#F3B455; --warn2:#33270F;
    --lamp:#33424C; --hover:rgba(63,193,198,.12); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --panel:#151F26; --ink:#E4ECF1; --ink2:#A7B6C1; --ink3:#7D8D99; --line:#2A3842;
  --acc:#3FC1C6; --acc-ink:#062226; --acc2:#123236; --on:#3DDC74; --off:#5E8DF0; --canvas:#10191F;
  --box:#1B2831; --bad:#FF6B6B; --bad2:#3A1C1F; --good2:#14301F; --warn:#F3B455; --warn2:#33270F;
  --lamp:#33424C; --hover:rgba(63,193,198,.12); --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:var(--acc)}
code{font-family:var(--mono);font-size:.88em;background:var(--box);padding:.05em .35em;border-radius:4px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:.72rem;line-height:1}
.top .sp{flex:1}
.xp{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.xp b{color:var(--acc)}
.prog-mini{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.bar{height:6px;width:90px;background:var(--box);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.35rem .6rem;cursor:pointer;font-size:.85rem}
#menuBtn{display:none}

/* ---------- maquetación ---------- */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 52px)}
nav#nav{border-right:1px solid var(--line);background:var(--panel);padding:1rem .6rem 2rem;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav#nav h4{margin:1rem .6rem .35rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
nav#nav a{display:flex;gap:.5rem;align-items:flex-start;padding:.38rem .6rem;border-radius:7px;text-decoration:none;color:var(--ink2);font-size:.9rem;line-height:1.3}
nav#nav a:hover{background:var(--hover)}
nav#nav a.cur{background:var(--acc2);color:var(--ink);font-weight:600}
nav#nav .ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:10px}
nav#nav .ck.done{background:var(--on);border-color:var(--on);color:#fff}
nav#nav .ck.half{border-color:var(--acc)}
main#main{min-width:0;padding:1.4rem 1.5rem 4rem}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-block}
  nav#nav{position:fixed;left:0;top:52px;bottom:0;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .2s;height:auto;box-shadow:var(--shadow)}
  nav#nav.open{transform:none}
  main#main{padding:1rem 1rem 4rem}
  .prog-mini .bar{width:56px}
  .brand small{display:none}
}

/* ---------- inicio ---------- */
.hero{background:linear-gradient(135deg,#0B3C49,#0A7F86);color:#fff;border-radius:16px;padding:1.6rem 1.6rem 1.4rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center}
.hero h1{margin:0 0 .3rem;font-size:clamp(1.6rem,1.2rem+2vw,2.4rem);line-height:1.1}
.hero p{margin:.2rem 0 .9rem;opacity:.92;max-width:40rem}
.hero .btns{display:flex;gap:.6rem;flex-wrap:wrap}
.hero svg.art{width:210px;height:auto}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero svg.art{display:none}}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid transparent;border-radius:9px;padding:.5rem .95rem;cursor:pointer;text-decoration:none;font-weight:600;font-size:.92rem;background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.hero .btn{background:#fff;color:#0B3C49}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.sm{padding:.3rem .65rem;font-size:.82rem;font-weight:600}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem;margin-top:1.2rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:1.1rem}
.card .sub{color:var(--ink2);font-size:.88rem;margin:.15rem 0 .7rem}
.card ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.15rem}
.card ol a{display:flex;gap:.5rem;align-items:center;text-decoration:none;color:var(--ink);padding:.3rem .35rem;border-radius:7px;font-size:.92rem}
.card ol a:hover{background:var(--hover)}
.card ol a .tg{margin-left:auto;font-size:.72rem;color:var(--ink3);white-space:nowrap}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}
.feat .card p{margin:.3rem 0 .7rem;color:var(--ink2);font-size:.9rem}

/* ---------- lección ---------- */
.crumbs{font-size:.82rem;color:var(--ink3)}
.crumbs a{color:var(--ink3)}
.lesson h1{margin:.2rem 0 .1rem;font-size:clamp(1.4rem,1.1rem+1.4vw,2rem);line-height:1.15}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:.85rem;margin-bottom:1rem}
.pill{display:inline-block;border-radius:99px;padding:.08rem .55rem;font-size:.74rem;font-weight:600;background:var(--box);color:var(--ink2)}
.pill.ok{background:var(--good2);color:var(--on)}
.pill.acc{background:var(--acc2);color:var(--acc)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4rem;align-items:start}
.simcol{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;padding-bottom:.5rem}
.jump{display:none;font-weight:600;font-size:.85rem}
@media (max-width:1180px){.lgrid{grid-template-columns:minmax(0,1fr)}.simcol{position:static;max-height:none;overflow:visible;scroll-margin-top:64px}.jump{display:inline}}
.theory{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem}
.theory h3{margin:1.2rem 0 .4rem;font-size:1.02rem}
.theory p,.theory li{color:var(--ink)}
.theory ol,.theory ul{padding-left:1.3rem}
.tip{border-left:4px solid var(--acc);background:var(--acc2);padding:.6rem .85rem;border-radius:0 8px 8px 0;margin:.9rem 0;font-size:.93rem}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6rem 0;display:block;overflow-x:auto}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.t th{color:var(--ink2);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:.3rem;margin-bottom:.6rem;background:var(--box);padding:.25rem;border-radius:10px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:.35rem .9rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink2)}
.tabs button.cur{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.reto{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.7rem}
.reto h3{margin:0 0 .3rem;font-size:1rem}
.reto .en{margin:.2rem 0 .6rem}
.reto .acts{display:flex;gap:.45rem;flex-wrap:wrap}
.tagt{font-size:.8rem;margin:.4rem 0 .6rem;display:flex;flex-wrap:wrap;gap:.3rem}
.tagt span{background:var(--box);border-radius:6px;padding:.1rem .45rem;font-family:var(--mono)}
.tagt span b{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600}
.res{list-style:none;padding:0;margin:.7rem 0 0;display:flex;flex-direction:column;gap:.25rem;font-size:.88rem}
.res li{padding:.3rem .55rem;border-radius:7px;background:var(--box)}
.res li.ok{background:var(--good2)}
.res li.ko{background:var(--bad2)}
.res .why{display:block;font-family:var(--mono);font-size:.8rem;color:var(--bad);margin-top:.15rem}
.banner{padding:.6rem .8rem;border-radius:9px;font-weight:600;margin-top:.6rem}
.banner.ok{background:var(--good2);color:var(--on)}
.banner.ko{background:var(--bad2);color:var(--bad)}
.quiz{margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1rem}
.quiz h2{font-size:1.1rem;margin:0 0 .6rem}
.qq{margin:0 0 1rem}
.qq p{margin:0 0 .35rem;font-weight:600}
.qq label{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .55rem;border-radius:8px;border:1px solid var(--line);margin:.25rem 0;cursor:pointer;font-size:.93rem}
.qq label:hover{background:var(--hover)}
.qq label.ok{border-color:var(--on);background:var(--good2)}
.qq label.ko{border-color:var(--bad);background:var(--bad2)}
.qq .ex{font-size:.86rem;color:var(--ink2);margin:.2rem 0 0 .2rem}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.4rem;flex-wrap:wrap}

/* ---------- simulador ---------- */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.simbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.5rem .7rem;border-bottom:1px solid var(--line);background:var(--box)}
.cpu{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.82rem;font-family:var(--mono)}
.led{width:11px;height:11px;border-radius:50%;background:#E0A800;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.led.run{background:var(--on);box-shadow:0 0 8px var(--on)}
.simbar .sp{flex:1}
.scan{font-family:var(--mono);font-size:.74rem;color:var(--ink3)}
.tg-edit[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.io{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
.io>div{padding:.6rem .7rem;min-width:0}
.io>div+div{border-left:1px solid var(--line)}
.io h5{margin:0 0 .4rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
@media (max-width:560px){.io{grid-template-columns:1fr}.io>div+div{border-left:0;border-top:1px solid var(--line)}}
.ins,.outs{display:flex;flex-wrap:wrap;gap:.45rem}
.in{display:flex;flex-direction:column;gap:.2rem;min-width:112px;flex:1 1 112px;max-width:180px}
.pb{border:1px solid var(--line);background:var(--canvas);border-radius:10px;padding:.45rem .5rem;cursor:pointer;font-weight:600;font-size:.85rem;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:.45rem;line-height:1.2}
.pb .k{width:20px;height:20px;border-radius:50%;flex:none;background:var(--lamp);border:3px solid var(--canvas);box-shadow:0 0 0 1.5px var(--ink3);transition:transform .05s}
.pb.sw .k{border-radius:5px}
.pb.pressed .k{transform:scale(.85);background:var(--acc)}
.pb.nc .k{background:#D23B3B}
.pb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in .sig{font-family:var(--mono);font-size:.7rem;color:var(--ink3);display:flex;justify-content:space-between;gap:.3rem;align-items:center}
.in .sig b{padding:0 .3rem;border-radius:4px;background:var(--box);color:var(--ink2)}
.in .sig b.h{background:var(--on);color:#fff}
.in label{font-size:.7rem;color:var(--ink3);display:flex;gap:.25rem;align-items:center;cursor:pointer}
.ana{flex:1 1 100%;display:flex;flex-direction:column;gap:.1rem;font-size:.8rem}
.ana input{width:100%;accent-color:var(--acc)}
.ana .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;color:var(--ink2)}
.lamp{display:flex;align-items:center;gap:.4rem;font-size:.82rem;min-width:110px;flex:1 1 110px;max-width:170px}
.lamp i{width:22px;height:22px;border-radius:50%;background:var(--lamp);flex:none;border:2px solid var(--line)}
.lamp.on i{background:#FFC83D;border-color:#E6A200;box-shadow:0 0 12px #FFC83D}
.lamp span{line-height:1.15;overflow:hidden}
.lamp small{display:block;font-family:var(--mono);color:var(--ink3);font-size:.68rem}
.empty{font-size:.8rem;color:var(--ink3)}
.segs{background:var(--canvas);padding:.3rem 0}
.seg{border-bottom:1px solid var(--line)}
.seg:last-child{border-bottom:0}
.seghd{display:flex;align-items:center;gap:.4rem;padding:.35rem .7rem 0;font-size:.8rem;color:var(--ink2)}
.seghd b{color:var(--ink);white-space:nowrap}
.seghd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:.15rem .4rem;background:var(--panel);color:var(--ink);font:inherit}
.seghd .x{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:1rem;padding:0 .2rem}
.segbody{overflow-x:auto;padding:0 .3rem .2rem}
.segbody svg{display:block}
.addseg{margin:.5rem .7rem .7rem}
.watch{border-top:1px solid var(--line);font-size:.82rem}
.watch summary{cursor:pointer;padding:.5rem .7rem;font-weight:600;color:var(--ink2)}
.watch .wrap{overflow-x:auto;padding:0 .7rem .6rem}
.watch table{border-collapse:collapse;width:100%}
.watch td,.watch th{padding:.2rem .45rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.watch th{font-size:.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.watch td.v{font-family:var(--mono)}
.watch td.v.t{color:var(--on);font-weight:700}
.watch td.a{font-family:var(--mono);color:var(--ink3)}
.hmi{border-bottom:1px solid var(--line);background:var(--canvas);padding:.5rem .7rem}
.hmi h5{margin:0 0 .2rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.hmi svg{display:block;width:100%;height:auto;max-height:260px;font-family:ui-sans-serif,system-ui,sans-serif}
.pb.ro{cursor:default;background:var(--box)}
.pb.ro.lit .k{background:var(--on)}
.pb.pf .k{background:var(--on)}
.pb.pf.pressed .k{background:var(--bad)}
.meter .av{font-weight:700;color:var(--acc)}
.edithint{font-size:.78rem;color:var(--ink2);background:var(--warn2);padding:.35rem .7rem;border-bottom:1px solid var(--line)}

/* SVG LAD */
svg.lad{font-family:ui-sans-serif,system-ui,sans-serif}
svg.lad .w{stroke:var(--off);stroke-width:1.6;stroke-dasharray:5 3;fill:none}
svg.lad .w.on{stroke:var(--on);stroke-width:2.6;stroke-dasharray:none}
svg.lad .rail{stroke:var(--ink);stroke-width:4}
svg.lad .sym{stroke:var(--ink);stroke-width:2.2;fill:none}
svg.lad .sym.on{stroke:var(--on);stroke-width:2.8}
svg.lad .symt{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle}
svg.lad .symt.on{fill:var(--on)}
svg.lad .lb{fill:var(--ink);font-size:10.5px;font-weight:600;text-anchor:middle}
svg.lad .ad{fill:var(--ink3);font-size:9.5px;font-family:var(--mono);text-anchor:middle}
svg.lad .miss{fill:var(--bad);font-size:10px;font-family:var(--mono);text-anchor:middle}
svg.lad .box{fill:var(--box);stroke:var(--ink);stroke-width:1.4}
svg.lad .box.on{stroke:var(--on);stroke-width:2}
svg.lad .bt{fill:var(--ink);font-size:11px;font-weight:700;text-anchor:middle}
svg.lad .pn{fill:var(--ink2);font-size:9.5px;font-weight:600}
svg.lad .pv{fill:var(--ink);font-size:9.5px;font-family:var(--mono)}
svg.lad .pv.on{fill:var(--on);font-weight:700}
svg.lad .pv.live{fill:var(--acc);font-weight:700}
svg.lad .stub{stroke:var(--ink3);stroke-width:1.2}
svg.lad .hit{fill:transparent}
.editing svg.lad .el{cursor:pointer}
.editing svg.lad .el:hover .hit{fill:var(--hover)}
.editing svg.lad .el.sel .hit{fill:var(--hover);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 2}
svg.lad .ph rect.phr{fill:transparent;stroke:var(--acc);stroke-dasharray:4 3;stroke-width:1.5}
svg.lad .ph text{fill:var(--acc);font-size:18px;font-weight:700;text-anchor:middle}

/* ---------- hoja del editor ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100vw);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:.9rem 1rem 1.2rem;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:900px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:16px}}
.sh-hd{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.sh-hd b{font-size:1.02rem;flex:1}
.sh-prev{background:var(--canvas);border:1px solid var(--line);border-radius:10px;display:flex;justify-content:center;padding:.3rem;margin-bottom:.6rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.fields label{display:flex;flex-direction:column;font-size:.76rem;color:var(--ink2);gap:.15rem;font-weight:600}
.fields input,.fields select{font:inherit;font-size:.92rem;font-family:var(--mono);border:1px solid var(--line);border-radius:7px;padding:.35rem .45rem;background:var(--canvas);color:var(--ink);width:100%}
.help{font-size:.82rem;color:var(--ink2);margin:.6rem 0}
.acts2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.35rem;margin-top:.6rem}
.acts2 button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.4rem .5rem;cursor:pointer;font-size:.85rem;text-align:left}
.acts2 button:hover{background:var(--hover)}
.acts2 button.del{color:var(--bad)}
.pick h6{margin:.7rem 0 .3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.pick .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.35rem}
.pick button{border:1px solid var(--line);background:var(--canvas);border-radius:9px;padding:.25rem .2rem .35rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--ink2);gap:.1rem}
.pick button:hover{border-color:var(--acc)}
.pick svg{width:80px;height:46px}

/* ---------- referencia ---------- */
.refg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem;margin-top:1rem}
.refg .card{padding:.8rem .9rem}
.refg .card h3{margin:.3rem 0 .2rem;font-size:.98rem}
.refg .card p{margin:0;font-size:.86rem;color:var(--ink2)}

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ===================== almacenamiento ===================== */
const KEY = "ladderlab.v1";
let ST = { reto: {}, quiz: {}, work: {}, lab: null, last: null, days: [], badges: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") ST = Object.assign(ST, s); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(ST)); } catch (e) {} }

/* ===================== tiempo ===================== */
function parseTime(s) {
  s = String(s).trim().replace(/^T(IME)?#/i, "").replace(/_/g, "");
  let ms = 0, m, any = false; const re = /(\d+(?:\.\d+)?)(ms|d|h|m|s)/gi;

  return any ? Math.round(ms) : NaN;
}
function fmtTime(ms) {

  let s = Math.floor(ms / 1000); const r = ms % 1000, m = Math.floor(s / 60); s %= 60;
  const p = []; if (m) p.push(m + "m"); if (s) p.push(s + "s"); if (r) p.push(r + "ms");
  return "T#" + p.join("_");
}
const isBit = a => /^%[IQM]\d+\.[0-7]$/.test(a);
const isWord = a => /^%[IQM]W\d+$/.test(a);

/* ===================== catálogo de instrucciones ===================== */
const KINDS = {
  NO: { g: "Contactos", n: "Contacto NA", f: ["op"], d: "Conduce si el operando vale 1.", tia: "Operaciones lógicas con bits → --| |--" },
  NC: { g: "Contactos", n: "Contacto NC", f: ["op"], d: "Conduce si el operando vale 0.", tia: "Operaciones lógicas con bits → --|/|--" },
  P: { g: "Contactos", n: "Flanco positivo", f: ["op", "mem"], d: "Conduce un ciclo cuando el operando pasa de 0 a 1. Necesita un bit de marca propio.", tia: "Operaciones lógicas con bits → --|P|--" },
  N: { g: "Contactos", n: "Flanco negativo", f: ["op", "mem"], d: "Conduce un ciclo cuando el operando pasa de 1 a 0.", tia: "Operaciones lógicas con bits → --|N|--" },
  NOT: { g: "Contactos", n: "Invertir (NOT)", f: [], d: "Invierte el estado de la corriente (RLO).", tia: "Operaciones lógicas con bits → --|NOT|--" },
  COIL: { g: "Bobinas", n: "Bobina", f: ["op"], d: "Escribe en el operando el estado de la corriente.", tia: "Operaciones lógicas con bits → --( )--" },
  NCOIL: { g: "Bobinas", n: "Bobina negada", f: ["op"], d: "Escribe el estado inverso de la corriente.", tia: "Operaciones lógicas con bits → --(/)--" },
  SET: { g: "Bobinas", n: "Set", f: ["op"], d: "Con corriente pone el operando a 1 y lo mantiene.", tia: "Operaciones lógicas con bits → --(S)--" },
  RESET: { g: "Bobinas", n: "Reset", f: ["op"], d: "Con corriente pone el operando a 0.", tia: "Operaciones lógicas con bits → --(R)--" },
  TON: { g: "Temporizadores", n: "TON retardo a la conexión", f: ["name", "pt"], box: 1, d: "Q se activa cuando IN lleva PT en 1.", tia: "Temporizadores → TON" },
  TOF: { g: "Temporizadores", n: "TOF retardo a la desconexión", f: ["name", "pt"], box: 1, d: "Q sigue activa PT después de que IN cae.", tia: "Temporizadores → TOF" },
  TP: { g: "Temporizadores", n: "TP impulso", f: ["name", "pt"], box: 1, d: "Con el flanco de IN da un pulso de duración PT.", tia: "Temporizadores → TP" },
  CTU: { g: "Contadores", n: "CTU ascendente", f: ["name", "r", "pv"], box: 1, d: "Suma 1 por flanco en CU; R pone a 0; Q = CV ≥ PV.", tia: "Contadores → CTU" },
  CTD: { g: "Contadores", n: "CTD descendente", f: ["name", "ld", "pv"], box: 1, d: "Resta 1 por flanco en CD; LD carga PV; Q = CV ≤ 0.", tia: "Contadores → CTD" },
  CMP: { g: "Datos", n: "Comparador", f: ["cmp", "a", "b"], box: 1, d: "Conduce si la comparación IN1 op IN2 es cierta. Compara números y tiempos.", tia: "Comparación → CMP ==, <>, >, <, >=, <=" },
  MOVE: { g: "Datos", n: "MOVE", f: ["in", "out"], box: 1, d: "Con EN copia IN en OUT1.", tia: "Transferencia → MOVE" },
  ADD: { g: "Datos", n: "ADD suma", f: ["in1", "in2", "out"], box: 1, d: "OUT = IN1 + IN2.", tia: "Funciones matemáticas → ADD" },
  SUB: { g: "Datos", n: "SUB resta", f: ["in1", "in2", "out"], box: 1, d: "OUT = IN1 − IN2.", tia: "Funciones matemáticas → SUB" },
  MUL: { g: "Datos", n: "MUL multiplica", f: ["in1", "in2", "out"], box: 1, d: "OUT = IN1 × IN2.", tia: "Funciones matemáticas → MUL" },
  DIV: { g: "Datos", n: "DIV divide", f: ["in1", "in2", "out"], box: 1, d: "OUT = IN1 ÷ IN2 (entero). Dividir por 0 pone ENO a 0.", tia: "Funciones matemáticas → DIV" }
};
const FL = { op: "Operando", mem: "Bit de marca de flanco", name: "Instancia (nombre del DB)", pt: "PT (tiempo)", r: "R (reset)", ld: "LD (cargar)", pv: "PV (valor prefijado)", cmp: "Comparación", a: "IN1", b: "IN2", in: "IN", out: "OUT", in1: "IN1", in2: "IN2" };
const OPFIELDS = ["op", "mem", "r", "ld", "a", "b", "in", "in1", "in2", "out", "pv"];

/* ===================== motor del PLC ===================== */
class Engine {
  constructor(prog, tags) { this.prog = prog; this.tags = tags || []; this.reset(); }
  reset() {
    this.v = {}; this.inst = {}; this.pressed = {}; this.ana = {}; this.scans = 0; this.t = 0; this.pf = new Map(); this.dt = 10;
    this.forced = {}; this.ps = {}; this.fault = null;
    for (const t of this.tags) { const a = t.addr.toUpperCase(); if (t.def != null) { if (isWord(a)) this.ana[a] = t.def; else this.pressed[a] = t.def ? 1 : 0; } }
    this.refresh();
  }
  sym(x) {
    x = String(x == null ? "" : x).trim().replace(/^"(.*)"$/, "$1"); if (!x) return "";
    const lx = x.toLowerCase();
    const t = this.tags.find(t => t.name.toLowerCase() === lx); if (t) return t.addr.toUpperCase();
    if (/^%?[IQM]W?\d+(\.\d)?$/i.test(x)) return (x[0] === "%" ? x : "%" + x).toUpperCase();
    const d = x.lastIndexOf(".");
    if (d > 0) { const n = x.slice(0, d).replace(/^"(.*)"$/, "$1"); return n.toUpperCase() + "." + x.slice(d + 1).toUpperCase(); }
    return x.toUpperCase();
  }
  get(x) {
    if (x == null) return 0; const s = String(x).trim(); if (!s) return 0;
    if (/^[+-]?\d+$/.test(s)) return parseInt(s, 10);
    if (/^T(IME)?#/i.test(s)) { const t = parseTime(s); return isNaN(t) ? 0 : t; }
    if (/^true$/i.test(s)) return 1; if (/^false$/i.test(s)) return 0;
    const k = this.sym(s);
    if (k[0] === "%") return this.v[k] || 0;
    const d = k.lastIndexOf(".");
    if (d > 0) { const i = this.inst[k.slice(0, d)]; return i ? (i[k.slice(d + 1)] || 0) : 0; }
    return 0;
  }
  B(x) { return !!this.get(x); }
  set(x, val) {
    const k = this.sym(x); if (k[0] !== "%") return true;
    if (isBit(k)) { this.v[k] = val ? 1 : 0; return true; }
    let n = Math.trunc(Number(val) || 0), ok = true;
    if (n > 32767) { n = 32767; ok = false; } if (n < -32768) { n = -32768; ok = false; }
    this.v[k] = n; return ok;
  }
  refresh() {
    const seen = new Map();
    for (const t of this.tags) { const a = t.addr.toUpperCase(); if (/^%I/.test(a)) seen.set(a, { addr: a, type: t.type || (isWord(a) ? "analog" : "push"), name: t.name, note: t.note, tag: t }); }
    for (const op of collectOps(this.prog)) {
      const a = this.sym(op);
      if (/^%I/.test(a) && (isBit(a) || isWord(a)) && !seen.has(a)) seen.set(a, { addr: a, type: isWord(a) ? "analog" : "push", name: "" });
    }
    this.inputs = Array.from(seen.values()).sort((p, q) => addrCmp(p.addr, q.addr));
  }
  scan(dt) {
    this.dt = dt;
    if (this.plant) this.plant(this, dt);
    for (const i of this.inputs) {
      if (i.addr in this.forced) this.v[i.addr] = this.forced[i.addr];
      else if (isWord(i.addr)) this.v[i.addr] = this.ana[i.addr] | 0;
      else { const p = !!this.pressed[i.addr]; this.v[i.addr] = (i.type === "pushNC" ? !p : p) ? 1 : 0; }
    }
    this.pf = new Map();
    for (const r of this.prog) this.evS(r.net, true);
    this.scans++; this.t += dt;
  }
  evS(s, p) { const p0 = p; for (const it of s.items) p = this.evN(it, p); this.pf.set(s, { i: p0, o: p }); return p; }
  evN(n, p) {
    if (n.t === "S") return this.evS(n, p);
    if (n.t === "P") { let o = false; for (const b of n.br) o = this.evS(b, p) || o; this.pf.set(n, { i: p, o }); return o; }
    return this.evE(n, p);
  }
  evE(e, p) {
    let o = false, c;
    switch (e.k) {
      case "NO": c = this.B(e.op); o = p && c; break;
      case "NC": c = !this.B(e.op); o = p && c; break;
      case "P": { const cur = this.B(e.op), m = this.B(e.mem); c = cur && !m; o = p && c; this.set(e.mem, cur); break; }
      case "N": { const cur = this.B(e.op), m = this.B(e.mem); c = !cur && m; o = p && c; this.set(e.mem, cur); break; }
      case "NOT": o = !p; c = o; break;
      case "COIL": this.set(e.op, p); o = p; break;
      case "NCOIL": this.set(e.op, !p); o = p; break;
      case "SET": if (p) this.set(e.op, 1); o = p; break;
      case "RESET": if (p) this.set(e.op, 0); o = p; break;
      case "TON": case "TOF": case "TP": o = this.timer(e, p); break;
      case "CTU": case "CTD": o = this.counter(e, p); break;
      case "CMP": { const a = this.get(e.a), b = this.get(e.b);
        c = { "==": a === b, "<>": a !== b, ">": a > b, "<": a < b, ">=": a >= b, "<=": a <= b }[e.cmp] || false; o = p && c; break; }
      case "MOVE": if (p) this.set(e.out, this.get(e.in)); o = p; break;
      case "ADD": case "SUB": case "MUL": case "DIV": {
        if (p) { const a = this.get(e.in1), b = this.get(e.in2); let r, ok = true;
          if (e.k === "ADD") r = a + b; else if (e.k === "SUB") r = a - b; else if (e.k === "MUL") r = a * b;
          else if (b === 0) { ok = false; } else r = Math.trunc(a / b);
          if (ok) ok = this.set(e.out, r); o = ok; } break; }
    }
    this.pf.set(e, { i: p, o, c });
    return o;
  }
  instOf(e, init) { const k = this.sym(e.name || "SIN_NOMBRE"); return this.inst[k] || (this.inst[k] = Object.assign({ Q: 0, ET: 0, CV: 0, run: 0, pin: 0 }, init)); }
  timer(e, p) {
    const s = this.instOf(e), dt = this.dt;
    let pt = /^T(IME)?#/i.test(String(e.pt).trim()) ? parseTime(e.pt) : this.get(e.pt); if (!(pt >= 0)) pt = 0;
    if (e.k === "TON") { if (p) { s.ET = Math.min(pt, s.ET + dt); s.Q = s.ET >= pt ? 1 : 0; } else { s.ET = 0; s.Q = 0; } }
    else if (e.k === "TOF") { if (p) { s.Q = 1; s.ET = 0; } else if (s.Q) { s.ET = Math.min(pt, s.ET + dt); if (s.ET >= pt) s.Q = 0; } }
    else {
      if (p && !s.pin && !s.run) { s.run = 1; s.ET = 0; }
      if (s.run) { s.ET = Math.min(pt, s.ET + dt); if (s.ET >= pt) s.run = 0; } else if (!p) s.ET = 0;
      s.Q = s.run;
      if (s.run === 0 && s.ET >= pt && p) s.Q = 0;
    }
    s.pin = p ? 1 : 0; return !!s.Q;
  }
  counter(e, p) {
    const s = this.instOf(e), pv = this.get(e.pv), edge = p && !s.pin;
    if (e.k === "CTU") { if (this.B(e.r)) s.CV = 0; else if (edge) s.CV = Math.min(32767, s.CV + 1); s.Q = s.CV >= pv ? 1 : 0; }
    else { if (this.B(e.ld)) s.CV = pv; else if (edge) s.CV = Math.max(-32768, s.CV - 1); s.Q = s.CV <= 0 ? 1 : 0; }
    s.pin = p ? 1 : 0; return !!s.Q;
  }
}
function walkEls(prog, fn) {
  const w = n => { if (n.t === "E") fn(n); else if (n.t === "S") n.items.forEach(w); else n.br.forEach(w); };
  prog.forEach(r => w(r.net));
}
function collectOps(prog) {
  const out = [];
  walkEls(prog, e => { for (const f of OPFIELDS) if (e[f] != null && String(e[f]).trim() && !/^[+-]?\d+$/.test(String(e[f]).trim()) && !/^T#/i.test(String(e[f]).trim())) out.push(String(e[f])); });
  return out;
}
function addrCmp(a, b) {
  const ord = s => { const m = /^%([IQM])(W?)(\d+)(?:\.(\d))?$/.exec(s); if (!m) return [9, 0, 0, s];
    return ["IQM".indexOf(m[1]), m[2] ? 1 : 0, +m[3] * 8 + (+m[4] || 0), s]; };
  const x = ord(a), y = ord(b);
  for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] - y[i];
  return String(x[3]).localeCompare(String(y[3]));
}

/* ===================== corrector de retos ===================== */
function grade(reto, prog) {
  const en = new Engine(clone(prog), reto.tags), dt = 10, res = [];
  const pl = reto.planta && typeof PLANTAS !== "undefined" && PLANTAS[reto.planta];
  if (pl && pl.model) en.plant = pl.model;
  const nm = a => { const t = reto.tags.find(t => t.addr === a); return t ? `"${t.name}" ${a}` : a; };
  const viol = () => {
    if (en.fault) return "Modelo de planta: " + en.fault;
    for (const p of reto.nunca || []) if (en.B(p[0]) && en.B(p[1])) return `${nm(p[0])} y ${nm(p[1])} se activaron a la vez`;
    for (const r of reto.reglas || []) if (en.B(r.si) && !en.B(r.sin)) return r.d;
    return null;
  };
  const run = ms => { const n = Math.max(1, Math.round(ms / dt)); for (let i = 0; i < n; i++) { en.scan(dt); const b = viol(); if (b) return b; } return null; };
  let ok = true;
  for (const st of reto.pasos) {
    let bad = null;
    if (st.pulsos) {
      for (const a in st.pulsos) for (let n = 0; n < st.pulsos[a]; n++) { en.pressed[a] = 1; bad = bad || run(60); en.pressed[a] = 0; bad = bad || run(60); }
    } else {
      for (const a in st.in || {}) { if (isWord(a)) en.ana[a] = st.in[a]; else en.pressed[a] = st.in[a] ? 1 : 0; }
      bad = run(st.t || 60);
    }
    const wrong = [];
    for (const a in st.ex) { let g = en.get(a); if (isBit(a)) g = g ? 1 : 0; const x = st.ex[a];
      const ok = Array.isArray(x) ? g >= x[0] && g <= x[1] : g === x;
      if (!ok) wrong.push({ a, n: nm(a), exp: Array.isArray(x) ? `entre ${x[0]} y ${x[1]}` : x, got: g }); }
    const pass = !bad && !wrong.length;
    res.push({ d: st.d, pass, wrong, bad });
    if (!pass) { ok = false; break; }
  }
  return { ok, res, total: reto.pasos.length };
}

/* ===================== dibujo LAD (SVG) ===================== */
const RAIL = 8, PAD = 14, EW = 100, BW = 220;
function pinsOf(e, eng) {
  const s = eng && eng.inst[eng.sym(e.name || "SIN_NOMBRE")];
  switch (e.k) {
    case "TON": case "TOF": case "TP": return { t: e.k, L: [{ n: "IN" }, { n: "PT", v: e.pt }], R: [{ n: "Q" }, { n: "ET", v: fmtTime(s ? s.ET : 0), live: 1 }] };
    case "CTU": return { t: "CTU", sub: "Int", L: [{ n: "CU" }, { n: "R", v: e.r, b: 1 }, { n: "PV", v: e.pv }], R: [{ n: "Q" }, { n: "CV", v: String(s ? s.CV : 0), live: 1 }] };
    case "CTD": return { t: "CTD", sub: "Int", L: [{ n: "CD" }, { n: "LD", v: e.ld, b: 1 }, { n: "PV", v: e.pv }], R: [{ n: "Q" }, { n: "CV", v: String(s ? s.CV : 0), live: 1 }] };
    case "CMP": return { t: "CMP " + e.cmp, sub: /T#|\.ET/i.test(e.a + e.b) ? "Time" : "Int", L: [{ n: "" }, { n: "IN1", v: e.a }, { n: "IN2", v: e.b }], R: [{ n: "" }] };
    case "MOVE": return { t: "MOVE", L: [{ n: "EN" }, { n: "IN", v: e.in }], R: [{ n: "ENO" }, { n: "OUT1", v: e.out }] };
    default: return { t: e.k, sub: "Int", L: [{ n: "EN" }, { n: "IN1", v: e.in1 }, { n: "IN2", v: e.in2 }], R: [{ n: "ENO" }, { n: "OUT", v: e.out }] };
  }
}
function lay(n, ctx) {
  if (n.t === "E") {
    if (KINDS[n.k] && KINDS[n.k].box) { const p = pinsOf(n); const rows = Math.max(p.L.length, p.R.length); return { w: BW, h: 56 + (rows - 1) * 22 + 24, ly: 56 }; }
    return { w: EW, h: (n.k === "P" || n.k === "N") ? 84 : 66, ly: 40 };
  }
  if (n.t === "S") {
    if (!n.items.length) return { w: ctx.edit ? 90 : 40, h: 66, ly: 40, ls: [] };

    if (!me.run) { for (const k in eng.v) if (/^%Q/.test(k)) eng.v[k] = 0; eng.pf = new Map(); }
    $(".led", R).classList.toggle("run", me.run); $(".mode", R).textContent = me.run ? "RUN" : "STOP";
    $(".b-run", R).textContent = me.run ? "STOP" : "RUN"; paint(true);
  });
  $(".b-rst", R).addEventListener("click", () => { const pr = eng.pressed, an = eng.ana; eng.reset(); eng.pressed = pr; eng.ana = an; paint(true); toast("Memoria y planta reiniciadas"); });
  const te = $(".tg-edit", R);
  if (te) te.addEventListener("click", () => { me.edit = !me.edit; te.setAttribute("aria-pressed", me.edit); R.classList.toggle("editing", me.edit); $(".edithint", R).hidden = !me.edit; $(".addseg", R).hidden = !me.edit; buildStatic(); });
  $(".addseg", R).addEventListener("click", () => { me.prog.push(SEG("", S())); changed(); });

    if (ent.ph) pickType(k => { const ne = mk(k, me.prog); ent.ser.items.push(ne); changed(); editEl(me, ne); });
    else editEl(me, ent.el);
  });
  me.reg = () => reg;

  let last = performance.now(), lastPaint = 0;
  const iv = setInterval(() => {
    const now = performance.now(); let el = Math.min(250, now - last); last = now;
    if (me.run) while (el > 0.5) { const d = Math.min(10, el); eng.scan(d); el -= d; }
  }, 10);
  const frame = t => { if (me.dead) return; if (t - lastPaint > 70) { lastPaint = t; paint(false); } requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
  me.destroy = () => { me.dead = true; clearInterval(iv); closeSheet(); };
  me.load = (prog, tags) => { me.prog = prog; me.tags = tags || me.tags; eng.prog = prog; eng.tags = me.tags; eng.reset(); me.latched = {}; me.sel = null; buildStatic(); };
  buildStatic();
  SIM = me; return me;
}

function openSheet(html) { const sh = $("#sheet"); sh.innerHTML = html; sh.hidden = false; $("#backdrop").hidden = false; const f = sh.querySelector("input,select,button"); if (f) setTimeout(() => f.focus({ preventScroll: true }), 30); return sh; }
function closeSheet() { $("#sheet").hidden = true; $("#backdrop").hidden = true; if (SIM && SIM.sel) SIM.select(null); }
$("#backdrop").addEventListener("click", closeSheet);
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
function pickType(cb, title) {
  const groups = {};
  for (const k in KINDS) (groups[KINDS[k].g] = groups[KINDS[k].g] || []).push(k);
  const sh = openSheet(`<div class="sh-hd"><b>${esc(title || "Elegir instrucción")}</b><button class="iconbtn" data-x aria-label="Cerrar">✕</button></div>
    <div class="pick">${Object.keys(groups).map(g => `<h6>${g}</h6><div class="g">${groups[g].map(k => `<button data-k="${k}" title="${esc(KINDS[k].d)}">${miniSVG(mk(k, []), [])}<span>${esc(KINDS[k].n)}</span></button>`).join("")}</div>`).join("")}</div>`);
  $("[data-x]", sh).onclick = closeSheet;
  $$("[data-k]", sh).forEach(b => b.onclick = () => { closeSheet(); cb(b.dataset.k); });
}
function editEl(sim, el) {
  const ent = sim.reg().get(uidOf(el)); if (!ent) return;
  sim.select(el);
  const K = KINDS[el.k];
  const opts = new Set(); sim.tags.forEach(t => { opts.add('"' + t.name + '"'); opts.add(t.addr); }); collectOps(sim.prog).forEach(o => opts.add(o));
  walkEls(sim.prog, e => { if (e.name) { opts.add(e.name + ".Q"); opts.add(e.name + (e.k[0] === "C" ? ".CV" : ".ET")); } });
  const fields = K.f.map(f => f === "cmp"
    ? `<label>${FL[f]}<select data-f="cmp">${["==", "<>", ">", "<", ">=", "<="].map(o => `<option${o === el.cmp ? " selected" : ""}>${o}</option>`).join("")}</select></label>`
    : `<label>${FL[f]}<input data-f="${f}" value="${esc(el[f] || "")}" list="dl-ops" autocomplete="off" spellcheck="false"></label>`).join("");
  const inPar = !!ent.par;
  const canExt = inPar && ent.parIdx + 1 < ent.parSer.items.length;
  const canShr = inPar && ent.par.br[0].items.length > 1;
  const sh = openSheet(`<div class="sh-hd"><b>${esc(K.n)}</b><button class="iconbtn" data-x aria-label="Cerrar">✕</button></div>
    <div class="sh-prev"></div>
    ${fields ? `<div class="fields">${fields}</div>` : ""}
    <datalist id="dl-ops">${Array.from(opts).map(o => `<option value="${esc(o)}">`).join("")}</datalist>
    <p class="help">${esc(K.d)} <span style="color:var(--ink3)">En TIA Portal: ${esc(K.tia)}.</span></p>
    <div class="acts2">
      <button data-a="before">⟵ Insertar antes</button><button data-a="after">Insertar después ⟶</button>
      <button data-a="par">⑂ Rama paralela aquí</button>
      ${inPar ? `<button data-a="addbr">＋ Otra rama paralela</button>` : ""}
      ${canExt ? `<button data-a="ext">Extender rama → siguiente</button>` : ""}
      ${canShr ? `<button data-a="shr">← Acortar rama</button>` : ""}
      <button data-a="type">⇄ Cambiar tipo</button><button data-a="del" class="del">🗑 Eliminar</button>
    </div>`);
  const prev = () => { $(".sh-prev", sh).innerHTML = miniSVG(el, sim.tags, Math.min(KINDS[el.k].box ? 240 : 130, 300)); };
  prev();
  $("[data-x]", sh).onclick = closeSheet;
  $$("[data-f]", sh).forEach(i => i.addEventListener("input", () => { el[i.dataset.f] = i.value; prev(); sim.changed(); sim.select(el); }));
  const ins = (off) => pickType(k => { const ne = mk(k, sim.prog); const e2 = sim.reg().get(uidOf(el)); e2.ser.items.splice(e2.idx + off, 0, ne); sim.changed(); editEl(sim, ne); });
  $$("[data-a]", sh).forEach(b => b.onclick = () => {
    const a = b.dataset.a;
    if (a === "before") ins(0);
    else if (a === "after") ins(1);
    else if (a === "par") pickType(k => { const ne = mk(k, sim.prog); const e2 = sim.reg().get(uidOf(el)); e2.ser.items[e2.idx] = { t: "P", br: [S(el), S(ne)] }; sim.changed(); editEl(sim, ne); }, "Instrucción de la rama nueva");
    else if (a === "addbr") pickType(k => { const ne = mk(k, sim.prog); ent.par.br.push(S(ne)); sim.changed(); editEl(sim, ne); }, "Instrucción de la rama nueva");
    else if (a === "ext") { const nx = ent.parSer.items.splice(ent.parIdx + 1, 1)[0]; ent.par.br[0].items.push(nx); sim.changed(); editEl(sim, el); }
    else if (a === "shr") { const lst = ent.par.br[0].items.pop(); ent.parSer.items.splice(ent.parIdx + 1, 0, lst); normalize(ent.rung.net); sim.changed(); editEl(sim, el); }
    else if (a === "type") pickType(k => { const ne = mk(k, sim.prog); if (el.op && "op" in ne) ne.op = el.op; const e2 = sim.reg().get(uidOf(el)); e2.ser.items[e2.idx] = ne; sim.changed(); editEl(sim, ne); }, "Cambiar por…");
    else if (a === "del") { ent.ser.items.splice(ent.idx, 1); normalize(ent.rung.net); closeSheet(); sim.sel = null; sim.changed(); }
  });
}

      let g; try { g = grade(R, sim.prog); } catch (e) { $(".out", rb).innerHTML = `<div class="banner ko">Error al simular: ${esc(e.message)}</div>`; return; }
      $(".out", rb).innerHTML = `<ul class="res">${g.res.map((r, k) => `<li class="${r.pass ? "ok" : "ko"}">${r.pass ? "✓" : "✗"} Paso ${k + 1}: ${esc(r.d)}${r.bad ? `<span class="why">${esc(r.bad)}</span>` : ""}${r.wrong.map(w => `<span class="why">${esc(w.n)}: esperaba ${esc(w.exp)}, el programa da ${w.got}</span>`).join("")}</li>`).join("")}</ul>
        <div class="banner ${g.ok ? "ok" : "ko"}">${g.ok ? "¡Reto superado! Todos los pasos se cumplen." : `Falla en el paso ${g.res.length} de ${g.total}. Revisa tu lógica y vuelve a probar.`}</div>`;
      if (g.ok) { const first = !ST.reto[id]; ST.reto[id] = true; save(); setSt(); actividad(); tabs.forEach(b => { if (b.dataset.t === "reto") b.textContent = "Reto ✓"; }); if (first) toast("Reto superado ✓"); }
    };
    $(".b-ini", rb).onclick = () => { if (!confirm("¿Volver al programa inicial del reto? Se pierde lo que hiciste.")) return; delete ST.work[id]; save(); sim.load(clone(R.inicio), R.tags); $(".out", rb).innerHTML = ""; };
    $(".b-sol", rb).onclick = () => { if (!confirm("¿Cargar la solución? Reemplaza tu programa del reto.")) return; const p = clone(R.solucion); ST.work[id] = p; save(); sim.load(p, R.tags); $(".out", rb).innerHTML = `<div class="banner ok" style="background:var(--warn2);color:var(--warn)">Solución cargada. Pruébala con las entradas y pulsa Comprobar.</div>`; };
  };
  tabs.forEach(b => b.onclick = () => show(b.dataset.t));
  show("ej");
  renderQuiz(L, $(".quiz"), setSt);
}
function renderQuiz(L, box, done) {
  box.innerHTML = `<h2>Cuestionario</h2>${L.quiz.map((q, k) => `<div class="qq" data-k="${k}"><p>${k + 1}. ${esc(q.q)}</p>${q.o.map((o, j) => `<label><input type="radio" name="q${k}" value="${j}"> <span>${esc(o)}</span></label>`).join("")}<div class="ex" hidden></div></div>`).join("")}
    <button class="btn b-q">Corregir</button> <span class="qr" style="margin-left:.5rem;font-weight:600"></span>`;
  $(".b-q", box).onclick = () => {
    let ok = 0;
    L.quiz.forEach((q, k) => { const d = $(`.qq[data-k="${k}"]`, box), sel = $("input:checked", d), v = sel ? +sel.value : -1;
      $$("label", d).forEach((lb, j) => { lb.classList.toggle("ok", j === q.a); lb.classList.toggle("ko", j === v && v !== q.a); });
      if (v === q.a) ok++; const ex = $(".ex", d); ex.hidden = false; ex.textContent = (v === q.a ? "✓ " : "✗ ") + q.e; });
    ST.quiz[L.id] = Math.max(ST.quiz[L.id] || 0, ok); save(); actividad();
    $(".qr", box).textContent = `${ok}/${L.quiz.length} correctas` + (ok >= Math.ceil(L.quiz.length * 0.66) ? " · aprobado ✓" : " · necesitas " + Math.ceil(L.quiz.length * 0.66));
    done();
  };
}
function viewLab() {
  const def = [SEG("Escribe aquí tu programa", S(P([NO("%I0.0")], [NO("%Q0.0")]), NC("%I0.1"), COIL("%Q0.0")))];
  $("#main").innerHTML = `<div class="crumbs"><a href="#/">Inicio</a> › Laboratorio</div><h1 style="margin:.2rem 0">Laboratorio libre</h1>
    <p class="lead">Un OB1 en blanco para practicar. Las entradas y salidas aparecen solas al usarlas (los pulsadores nuevos se tratan como NA). Se guarda en este equipo.</p>
    <div style="display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0"><button class="btn ghost sm b-new">Programa nuevo</button><button class="btn ghost sm b-exp">Exportar .json</button><label class="btn ghost sm" style="cursor:pointer">Importar .json<input type="file" accept=".json,application/json" hidden class="b-imp"></label></div>
    <div class="simbox"></div>`;
  const sim = Sim($(".simbox"), { prog: ST.lab ? clone(ST.lab) : def, tags: [], editable: true, edit: true, onChange: p => { ST.lab = p; save(); } });
  $(".b-new").onclick = () => { if (!confirm("¿Empezar un programa vacío?")) return; const p = [SEG("", S())]; ST.lab = p; save(); sim.load(p, []); };
  $(".b-exp").onclick = () => { const b = new Blob([JSON.stringify({ ladderlab: 1, prog: sim.prog }, null, 1)], { type: "application/json" }); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "programa-ladder.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
  $(".b-imp").onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => { const j = JSON.parse(t); if (!j || !Array.isArray(j.prog)) throw new Error("formato"); ST.lab = j.prog; save(); sim.load(j.prog, []); toast("Programa importado"); }).catch(() => toast("Ese archivo no es un programa de LadderLab")); };
  renderNav("lab");
}
function viewRef() {
  if (SIM) { SIM.destroy(); SIM = null; }
  const groups = {}; for (const k in KINDS) (groups[KINDS[k].g] = groups[KINDS[k].g] || []).push(k);
  const sample = { NO: "Marcha", NC: "Paro", COIL: "Motor" };
  const tags = [TAG("%I0.0", "Marcha"), TAG("%I0.1", "Paro"), TAG("%Q0.0", "Motor")];
  $("#main").innerHTML = `<div class="crumbs"><a href="#/">Inicio</a> › Referencia</div><h1 style="margin:.2rem 0">Referencia de instrucciones</h1>
    <p class="lead">Las instrucciones LAD que simula esta app, cómo se comportan y dónde están en la pestaña <i>Instrucciones</i> de TIA Portal.</p>
    ${Object.keys(groups).map(g => `<h2 class="sec">${g}</h2><div class="refg">${groups[g].map(k => { const e = mk(k, []); if (sample[k]) e.op = sample[k];
      return `<div class="card"><div class="pv">${miniSVG(e, tags)}</div><h3>${esc(KINDS[k].n)}</h3><p>${esc(KINDS[k].d)}</p><p style="margin-top:.3rem;font-size:.78rem;color:var(--ink3)">${esc(KINDS[k].tia)}</p></div>`; }).join("")}</div>`).join("")}
    <h2 class="sec">Atajos de lectura en la observación online</h2>
    <div class="theory" style="margin-top:.6rem"><ul><li><b>Línea verde continua:</b> llega corriente (RLO = 1).</li><li><b>Línea azul punteada:</b> no llega corriente.</li><li>Los valores de ET y CV junto a las cajas son el estado actual de la instancia.</li></ul></div>`;
  renderNav("ref");
}
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  window.scrollTo(0, 0);
  if (h.startsWith("l/")) viewLesson(h.slice(2));
  else if (h === "lab") viewLab();
  else if (h === "ref") viewRef();
  else viewHome();
}
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
