  ${(() => { const R = rango(), pct = Math.round(100 * (R.x - R.desde) / (R.hasta - R.desde)), rc = racha(), nb = BADGES.filter(b => (ST.badges || []).includes(b.id)).length;
    return `<div class="stats"><div class="card"><p class="sub" style="margin:0">Tu rango</p><div class="rk">${esc(R.nombre)}</div>
      <div class="xpbar"><i style="width:${R.n === RANGOS.length - 1 ? 100 : pct}%"></i></div><p class="sub" style="margin:0">${R.x} XP${R.n < RANGOS.length - 1 ? ` · faltan ${R.hasta - R.x} para «${esc(RANGOS[R.n + 1])}»` : " · rango máximo"}</p>
      <div class="kpis"><div><b>🔥 ${rc}</b>día${rc === 1 ? "" : "s"} seguidos</div><div><b>${Object.keys(ST.reto).length}/${LECCIONES.filter(L => L.reto).length}</b>retos</div><div><b>${nb}/${BADGES.length}</b>insignias</div></div>
      <p class="sub" style="margin:.3rem 0 0;font-size:.78rem">Cuestionario: 10 XP por respuesta correcta. Reto: 50 XP; 80 XP en la ruta de grupos y minería.</p></div>
      <div class="card"><p class="sub" style="margin:0">Insignias</p><div class="bdg">${BADGES.map(b => `<div class="${(ST.badges || []).includes(b.id) ? "" : "off"}" title="${esc(b.d)}"><span>${b.ic}</span><b>${esc(b.n)}</b>${esc(b.d)}</div>`).join("")}</div></div></div>`; })()}
  <div class="card ruta"><div class="big">⚡⛏</div><div><h2>Ruta aplicada: grupos electrógenos y minería</h2>
    <p>Protecciones del grupo, <b>TTA red‑grupo</b>, <b>sincronismo de grupos en paralelo</b> con sincronoscopio, arranque por demanda con deslastre, fajas de mineral en cascada con pull‑cord y bombas de relaves con alternancia: casos de planta concentradora como los de las operaciones del sur del Perú. Cada reto corre contra un modelo de planta que responde y detecta cierres fuera de fase o chutes atollados.</p>
    <a class="btn" href="#/l/${(LECCIONES.find(L => L.nivel === "energia" && estado(L) !== "done") || LECCIONES.find(L => L.nivel === "energia")).id}">Ir a la ruta</a> <span class="sub" style="font-size:.82rem">Recomendado tras el nivel intermedio</span></div></div>
  <div class="levels">${NIVELES.map(N => { const ls = LECCIONES.filter(L => L.nivel === N.id), d = ls.filter(L => estado(L) === "done").length;
    return `<div class="card"><h2>${N.nombre}</h2><p class="sub">${esc(N.desc)} · ${d}/${ls.length}</p><ol>${ls.map(L => { const e = estado(L);
      return `<li><a href="#/l/${L.id}"><span class="pill ${e === "done" ? "ok" : ""}">${e === "done" ? "✓" : LECCIONES.indexOf(L) + 1}</span>${esc(L.titulo)}<span class="tg">${L.reto ? "reto · " : ""}${L.min} min</span></a></li>`; }).join("")}</ol></div>`; }).join("")}</div>
  <div class="feat">
    <div class="card"><h2>Simulador con ciclo de scan</h2><p>Lee entradas, ejecuta segmento por segmento y escribe salidas cada 10 ms. Verde = conduce, azul punteado = no, como la observación online de TIA.</p></div>
    <div class="card"><h2>Editor LAD</h2><p>Contactos, flancos, bobinas S/R, TON/TOF/TP, CTU/CTD, comparadores, MOVE y aritmética, con ramas paralelas.</p><a class="btn sm ghost" href="#/ref">Ver instrucciones</a></div>
    <div class="card"><h2>Retos autocorregidos</h2><p>Cada reto se prueba con una secuencia de entradas y tiempos. Si falla, te dice en qué paso y qué salida esperaba.</p></div>
    <div class="card"><h2>HMI y modelo de planta</h2><p>Unifilar de la TTA, sincronoscopio, tacómetro del grupo, fajas animadas y pozo de bombeo: el proceso responde a tu programa como en campo.</p></div>
  </div>
  <p class="lead" style="margin-top:1.2rem;font-size:.85rem">Tu progreso se guarda en este equipo. La app funciona sin conexión una vez abierta. TIA Portal, SIMATIC y S7 son marcas de Siemens AG; esta es una herramienta de estudio independiente.</p>`;
  renderNav("home");
}
function viewLesson(id) {
  const L = LECCIONES.find(x => x.id === id); if (!L) return viewHome();
  ST.last = id; save(); marcarDia();
  const i = LECCIONES.indexOf(L), N = nivelDe(L.nivel), prev = LECCIONES[i - 1], next = LECCIONES[i + 1];
  $("#main").innerHTML = `<article class="lesson">
    <div class="crumbs"><a href="#/">Inicio</a> › ${N.nombre} › Lección ${i + 1}</div>
    <h1>${esc(L.titulo)}</h1>
    <div class="meta"><span class="pill acc">${N.nombre}</span><span>${L.min} min</span><span class="st"></span><a class="jump" href="#" data-jump>▶ Ir al simulador</a></div>
    <div class="lgrid">
      <div class="theory">${L.teoria}<section class="quiz"></section></div>
      <div class="simcol">
        <div class="tabs" role="tablist"><button data-t="ej" class="cur" role="tab">Ejemplo</button>${L.reto ? `<button data-t="reto" role="tab">Reto${ST.reto[id] ? " ✓" : ""}</button>` : ""}</div>
        <div class="retobox"></div><div class="simbox"></div>
      </div>
    </div>
    <nav class="pn">${prev ? `<a class="btn ghost" href="#/l/${prev.id}">← ${esc(prev.titulo)}</a>` : "<span></span>"}${next ? `<a class="btn" href="#/l/${next.id}">${esc(next.titulo)} →</a>` : `<a class="btn" href="#/lab">Ir al laboratorio →</a>`}</nav>
  </article>`;
  const setSt = () => { const e = estado(L); $(".meta .st").innerHTML = e === "done" ? `<span class="pill ok">✓ Completada</span>` : `<span class="pill">${L.reto ? (ST.reto[id] ? "Reto ✓" : "Reto pendiente") + " · " : ""}${quizOk(L) ? "Cuestionario ✓" : "Cuestionario pendiente"}</span>`; renderNav(id); };
  setSt();
  $("[data-jump]").onclick = ev => { ev.preventDefault(); $(".simcol").scrollIntoView({ behavior: "smooth" }); };
  const tabs = $$(".tabs button");
  const show = t => {
    tabs.forEach(b => b.classList.toggle("cur", b.dataset.t === t));
    const rb = $(".retobox");
    if (t === "ej") { rb.innerHTML = ""; Sim($(".simbox"), { prog: clone(L.ejemplo.prog), tags: L.ejemplo.tags, planta: L.ejemplo.planta, editable: true }); return; }
    const R = L.reto;
    rb.innerHTML = `<div class="reto"><h3>Reto</h3><p class="en">${R.enunciado}</p>
      <div class="tagt">${R.tags.map(t => `<span><b>${esc(t.name)}</b> ${t.addr}${t.type === "pushNC" ? " (NC)" : t.type === "pullcord" ? " (pull‑cord NC, enclava)" : t.type === "switch" ? " (selector)" : ""}</span>`).join("")}</div>
      <div class="acts"><button class="btn b-chk">▶ Comprobar</button><button class="btn ghost b-ini">Reiniciar reto</button><button class="btn ghost b-sol">Ver solución</button></div>
      <div class="out"></div></div>`;
    const sim = Sim($(".simbox"), { prog: ST.work[id] ? clone(ST.work[id]) : clone(R.inicio), tags: R.tags, planta: R.planta, editable: true, edit: true, onChange: p => { ST.work[id] = p; save(); } });
    $(".b-chk", rb).onclick = () => {
      let g; try { g = grade(R, sim.prog); } catch (e) { $(".out", rb).innerHTML = `<div class="banner ko">Error al simular: ${esc(e.message)}</div>`; return; }
      $(".out", rb).innerHTML = `<ul class="res">${g.res.map((r, k) => `<li class="${r.pass ? "ok" : "ko"}">${r.pass ? "✓" : "✗"} Paso ${k + 1}: ${esc(r.d)}${r.bad ? `<span class="why">${esc(r.bad)}</span>` : ""}${r.wrong.map(w => `<span class="why">${esc(w.n)}: esperaba ${esc(w.exp)}, el programa da ${w.got}</span>`).join("")}</li>`).join("")}</ul>
        <div class="banner ${g.ok ? "ok" : "ko"}">${g.ok ? "¡Reto superado! Todos los pasos se cumplen." : `Falla en el paso ${g.res.length} de ${g.total}. Revisa tu lógica y vuelve a probar.`}</div>`;
      if (g.ok) { const first = !ST.reto[id]; ST.reto[id] = true; save(); setSt(); actividad(); tabs.forEach(b => { if (b.dataset.t === "reto") b.textContent = "Reto ✓"; }); if (first) toast("Reto superado ✓"); }
    };
    $(".b-ini", rb).onclick = () => { if (!confirm("¿Volver al programa inicial del reto? Se pierde lo que hiciste.")) return; delete ST.work[id]; save(); sim.load(clone(R.inicio), R.tags); $(".out", rb).innerHTML = ""; };
    $(".b-sol", rb).onclick = () => { if (!confirm("¿Cargar la solución? Reemplaza tu programa del reto.")) return; const p = clone(R.solucion); ST.work[id] = p; ST.sol = ST.sol || {}; ST.sol[id] = true; save(); sim.load(p, R.tags); $(".out", rb).innerHTML = `<div class="banner ok" style="background:var(--warn2);color:var(--warn)">Solución cargada. Pruébala y pulsa Comprobar. Un reto resuelto con la solución a la vista cuenta como completado, pero no suma XP ni insignia.</div>`; };
  };
  tabs.forEach(b => b.onclick = () => show(b.dataset.t));
  show("ej");
  renderQuiz(L, $(".quiz"), setSt);
}
function renderQuiz(L, box, done) {
  box.innerHTML = `<h2>Cuestionario</h2>${L.quiz.map((q, k) => `<div class="qq" data-k="${k}"><p>${k + 1}. ${esc(q.q)}</p>${q.o.map((o, j) => `<label><input type="radio" name="q${k}" value="${j}"> <span>${esc(o)}</span></label>`).join("")}<div class="ex" hidden></div></div>`).join("")}
    <button class="btn b-q">Corregir</button> <span class="qr" style="margin-left:.5rem;font-weight:600"></span>`;
  $(".b-q", box).onclick = () => {
    let ok = 0;
    L.quiz.forEach((q, k) => { const d = $(`.qq[data-k="${k}"]`, box), sel = $("input:checked", d), v = sel ? +sel.value : -1;
      $$("label", d).forEach((lb, j) => { lb.classList.toggle("ok", j === q.a); lb.classList.toggle("ko", j === v && v !== q.a); });
      if (v === q.a) ok++; const ex = $(".ex", d); ex.hidden = false; ex.textContent = (v === q.a ? "✓ " : "✗ ") + q.e; });
    ST.quiz[L.id] = Math.max(ST.quiz[L.id] || 0, ok); save(); actividad();
    $(".qr", box).textContent = `${ok}/${L.quiz.length} correctas` + (ok >= Math.ceil(L.quiz.length * 0.66) ? " · aprobado ✓" : " · necesitas " + Math.ceil(L.quiz.length * 0.66));
    done();
  };
}
function viewLab() {
  const def = [SEG("Escribe aquí tu programa", S(P([NO("%I0.0")], [NO("%Q0.0")]), NC("%I0.1"), COIL("%Q0.0")))];
  $("#main").innerHTML = `<div class="crumbs"><a href="#/">Inicio</a> › Laboratorio</div><h1 style="margin:.2rem 0">Laboratorio libre</h1>
    <p class="lead">Un OB1 en blanco para practicar. Las entradas y salidas aparecen solas al usarlas (los pulsadores nuevos se tratan como NA). Se guarda en este equipo.</p>
    <div style="display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0"><button class="btn ghost sm b-new">Programa nuevo</button><button class="btn ghost sm b-exp">Exportar .json</button><label class="btn ghost sm" style="cursor:pointer">Importar .json<input type="file" accept=".json,application/json" hidden class="b-imp"></label></div>
    <div class="simbox"></div>`;
  const sim = Sim($(".simbox"), { prog: ST.lab ? clone(ST.lab) : def, tags: [], editable: true, edit: true, onChange: p => { ST.lab = p; save(); } });
  $(".b-new").onclick = () => { if (!confirm("¿Empezar un programa vacío?")) return; const p = [SEG("", S())]; ST.lab = p; save(); sim.load(p, []); };
  $(".b-exp").onclick = () => {
    const txt = JSON.stringify({ ladderlab: 1, prog: sim.prog }, null, 1), nombre = "programa-ladder-" + hoy() + ".json";
    if (EN_APK) {
      /* En un WebView una descarga blob: no llega a ningún lado: los bytes van por el puente a Descargas. */
      let r; try { r = window.PuenteLadder.guardar(nombre, btoa(unescape(encodeURIComponent(txt))), "application/json"); } catch (e) { r = String(e.message || e); }
      toast(r ? "No se guardó: " + r : "Guardado en Descargas: " + nombre); return;
    }
    const b = new Blob([txt], { type: "application/json" }), a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = nombre; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
  $(".b-imp").onchange = ev => { const f = ev.target.files[0]; if (!f) return; f.text().then(t => { const j = JSON.parse(t); if (!j || !Array.isArray(j.prog)) throw new Error("formato"); ST.lab = j.prog; save(); sim.load(j.prog, []); toast("Programa importado"); }).catch(() => toast("Ese archivo no es un programa de LadderLab")); };
  renderNav("lab");
}
function viewRef() {
  if (SIM) { SIM.destroy(); SIM = null; }
  const groups = {}; for (const k in KINDS) (groups[KINDS[k].g] = groups[KINDS[k].g] || []).push(k);
  const sample = { NO: "Marcha", NC: "Paro", COIL: "Motor" };
  const tags = [TAG("%I0.0", "Marcha"), TAG("%I0.1", "Paro"), TAG("%Q0.0", "Motor")];
  $("#main").innerHTML = `<div class="crumbs"><a href="#/">Inicio</a> › Referencia</div><h1 style="margin:.2rem 0">Referencia de instrucciones</h1>
    <p class="lead">Las instrucciones LAD que simula esta app, cómo se comportan y dónde están en la pestaña <i>Instrucciones</i> de TIA Portal.</p>
    ${Object.keys(groups).map(g => `<h2 class="sec">${g}</h2><div class="refg">${groups[g].map(k => { const e = mk(k, []); if (sample[k]) e.op = sample[k];
      return `<div class="card"><div class="pv">${miniSVG(e, tags)}</div><h3>${esc(KINDS[k].n)}</h3><p>${esc(KINDS[k].d)}</p><p style="margin-top:.3rem;font-size:.78rem;color:var(--ink3)">${esc(KINDS[k].tia)}</p></div>`; }).join("")}</div>`).join("")}
    <h2 class="sec">Atajos de lectura en la observación online</h2>
    <div class="theory" style="margin-top:.6rem"><ul><li><b>Línea verde continua:</b> llega corriente (RLO = 1).</li><li><b>Línea azul punteada:</b> no llega corriente.</li><li>Los valores de ET y CV junto a las cajas son el estado actual de la instancia.</li></ul></div>`;
  renderNav("ref");
}
function route() {
  const h = location.hash.replace(/^#\/?/, "");
  window.scrollTo(0, 0);
  if (h.startsWith("l/")) viewLesson(h.slice(2));
  else if (h === "lab") viewLab();
  else if (h === "ref") viewRef();
  else viewHome();
}
/* Botón «atrás» del teléfono (lo llama el APK). Cierto si había algo que cerrar o a dónde volver. */
function atras() {
  if (!$("#sheet").hidden) { closeSheet(); return true; }
  if ($("#nav").classList.contains("open")) { $("#nav").classList.remove("open"); return true; }
  if (location.hash && location.hash !== "#/" && location.hash !== "#") { location.hash = "#/"; return true; }
  return false;
}
window.atras = atras;
/* Instalar desde Chrome (Android y escritorio) cuando el navegador lo ofrece. */
let PEDIR_INSTALAR = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); PEDIR_INSTALAR = ev; $$(".b-inst").forEach(b => { b.hidden = false; }); });
window.addEventListener("appinstalled", () => { PEDIR_INSTALAR = null; $$(".b-inst").forEach(b => { b.hidden = true; }); toast("LadderLab quedó instalada"); });
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".b-inst"); if (!b || !PEDIR_INSTALAR) return;
  PEDIR_INSTALAR.prompt(); PEDIR_INSTALAR.userChoice.finally(() => { PEDIR_INSTALAR = null; $$(".b-inst").forEach(x => { x.hidden = true; }); });
});
window.addEventListener("hashchange", route);
route();
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:" && !EN_APK) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
