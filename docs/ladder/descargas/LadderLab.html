<html lang="es">
<head>
<meta charset="utf-8">

<meta name="description" content="Curso interactivo de Ladder (LAD) para PLC S7-1200/1500 con TIA Portal: de básico a avanzado, con simulador y retos autocorregidos. Funciona sin conexión.">
<meta name="theme-color" content="#0B3C49">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj48cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgcng9Ijk2IiBmaWxsPSIjMEIzQzQ5Ii8+PHBhdGggZD0iTTk2IDk2djMyMCIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjMwIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNOTYgMTk2aDc2bTY0IDBoMTc2TTk2IDM0MGg3Nm02NCAwaDY0IiBzdHJva2U9IiMzRkMxQzYiIHN0cm9rZS13aWR0aD0iMjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0xNzIgMTUwdjkyTTIzNiAxNTB2OTJNMTcyIDI5NHY5Mk0yMzYgMjk0djkyIiBzdHJva2U9IiNmZmYiIHN0cm9rZS13aWR0aD0iMjQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjxwYXRoIGQ9Ik0zNTAgMjkwYy0yNiAyNi0yNiA3NCAwIDEwMG02Ni0xMDBjMjYgMjYgMjYgNzQgMCAxMDAiIHN0cm9rZT0iIzdDRjBBNiIgc3Ryb2tlLXdpZHRoPSIyMiIgZmlsbD0ibm9uZSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+PC9zdmc+Cg==" type="image/svg+xml">
<style>
:root{
  --bg:#F2F5F7; --panel:#FFFFFF; --ink:#13202A; --ink2:#465867; --ink3:#5E6D79; --line:#D8E0E6;
  --acc:#0A7F86; --acc-ink:#FFFFFF; --acc2:#DDF1F1; --on:#11803A; --off:#3A6CD0; --canvas:#FFFFFF;
  --box:#EEF3F7; --bad:#C62828; --bad2:#FDECEC; --good2:#E5F5EA; --warn:#9A5B00; --warn2:#FFF4DE;
  --lamp:#C9D2D9; --hover:rgba(10,127,134,.10); --shadow:0 1px 2px rgba(16,32,42,.06),0 4px 14px rgba(16,32,42,.06);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151A; --panel:#151F26; --ink:#E4ECF1; --ink2:#A7B6C1; --ink3:#8B9BA7; --line:#2A3842;
    --acc:#3FC1C6; --acc-ink:#062226; --acc2:#123236; --on:#3DDC74; --off:#5E8DF0; --canvas:#10191F;
    --box:#1B2831; --bad:#FF6B6B; --bad2:#3A1C1F; --good2:#14301F; --warn:#F3B455; --warn2:#33270F;
    --lamp:#33424C; --hover:rgba(63,193,198,.12); --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151A; --panel:#151F26; --ink:#E4ECF1; --ink2:#A7B6C1; --ink3:#8B9BA7; --line:#2A3842;
  --acc:#3FC1C6; --acc-ink:#062226; --acc2:#123236; --on:#3DDC74; --off:#5E8DF0; --canvas:#10191F;
  --box:#1B2831; --bad:#FF6B6B; --bad2:#3A1C1F; --good2:#14301F; --warn:#F3B455; --warn2:#33270F;
  --lamp:#33424C; --hover:rgba(63,193,198,.12); --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:var(--acc)}
code{font-family:var(--mono);font-size:.88em;background:var(--box);padding:.05em .35em;border-radius:4px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);font-weight:700;letter-spacing:.01em;white-space:nowrap}
.brand svg{width:28px;height:28px;flex:none}
.brand small{display:block;font-weight:500;color:var(--ink3);font-size:.72rem;line-height:1}
.top .sp{flex:1}
.xp{font-size:.8rem;color:var(--ink2);white-space:nowrap}
.xp b{color:var(--acc)}
.prog-mini{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--ink2);white-space:nowrap}
.bar{height:6px;width:90px;background:var(--box);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.35rem .6rem;cursor:pointer;font-size:.85rem}
#menuBtn{display:none}

/* ---------- maquetación ---------- */
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 52px)}
nav#nav{border-right:1px solid var(--line);background:var(--panel);padding:1rem .6rem 2rem;position:sticky;top:52px;height:calc(100vh - 52px);overflow:auto}
nav#nav h4{margin:1rem .6rem .35rem;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
nav#nav a{display:flex;gap:.5rem;align-items:flex-start;padding:.38rem .6rem;border-radius:7px;text-decoration:none;color:var(--ink2);font-size:.9rem;line-height:1.3}
nav#nav a:hover{background:var(--hover)}
nav#nav a.cur{background:var(--acc2);color:var(--ink);font-weight:600}
nav#nav .ck{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:10px}
nav#nav .ck.done{background:var(--on);border-color:var(--on);color:#fff}
nav#nav .ck.half{border-color:var(--acc)}
main#main{min-width:0;padding:1.4rem 1.5rem 4rem}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #menuBtn{display:inline-block}
  nav#nav{position:fixed;left:0;top:52px;bottom:0;width:min(300px,86vw);z-index:30;transform:translateX(-105%);transition:transform .2s;height:auto;box-shadow:var(--shadow)}
  nav#nav.open{transform:none}
  main#main{padding:1rem 1rem 4rem}
  .prog-mini .bar{width:56px}
  .brand small{display:none}
}

/* ---------- inicio ---------- */
.hero{background:linear-gradient(135deg,#0B3C49,#0A7F86);color:#fff;border-radius:16px;padding:1.6rem 1.6rem 1.4rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1rem;align-items:center}
.hero h1{margin:0 0 .3rem;font-size:clamp(1.6rem,1.2rem+2vw,2.4rem);line-height:1.1}
.hero p{margin:.2rem 0 .9rem;opacity:.92;max-width:40rem}
.hero .btns{display:flex;gap:.6rem;flex-wrap:wrap}
.hero svg.art{width:210px;height:auto}
@media (max-width:700px){.hero{grid-template-columns:1fr}.hero svg.art{display:none}}
.btn{display:inline-flex;align-items:center;gap:.4rem;border:1px solid transparent;border-radius:9px;padding:.5rem .95rem;cursor:pointer;text-decoration:none;font-weight:600;font-size:.92rem;background:var(--acc);color:var(--acc-ink)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.hero .btn{background:#fff;color:#0B3C49}
.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.btn.sm{padding:.3rem .65rem;font-size:.82rem;font-weight:600}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:1rem;margin-top:1.2rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem 1.1rem;box-shadow:var(--shadow)}
.card h2{margin:0;font-size:1.1rem}
.card .sub{color:var(--ink2);font-size:.88rem;margin:.15rem 0 .7rem}
.card ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.15rem}
.card ol a{display:flex;gap:.5rem;align-items:center;text-decoration:none;color:var(--ink);padding:.3rem .35rem;border-radius:7px;font-size:.92rem}
.card ol a:hover{background:var(--hover)}
.card ol a .tg{margin-left:auto;font-size:.72rem;color:var(--ink3);white-space:nowrap}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}
.feat .card p{margin:.3rem 0 .7rem;color:var(--ink2);font-size:.9rem}

/* ---------- lección ---------- */
.crumbs{font-size:.82rem;color:var(--ink3)}
.crumbs a{color:var(--ink3)}
.lesson h1{margin:.2rem 0 .1rem;font-size:clamp(1.4rem,1.1rem+1.4vw,2rem);line-height:1.15}
.meta{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;color:var(--ink2);font-size:.85rem;margin-bottom:1rem}
.pill{display:inline-block;border-radius:99px;padding:.08rem .55rem;font-size:.74rem;font-weight:600;background:var(--box);color:var(--ink2)}
.pill.ok{background:var(--good2);color:var(--on)}
.pill.acc{background:var(--acc2);color:var(--acc)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.4rem;align-items:start}
.simcol{position:sticky;top:64px;max-height:calc(100vh - 76px);overflow:auto;padding-bottom:.5rem}
.jump{display:none;font-weight:600;font-size:.85rem}
@media (max-width:1180px){.lgrid{grid-template-columns:minmax(0,1fr)}.simcol{position:static;max-height:none;overflow:visible;scroll-margin-top:64px}.jump{display:inline}}
.theory{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.3rem}
.theory h3{margin:1.2rem 0 .4rem;font-size:1.02rem}
.theory p,.theory li{color:var(--ink)}
.theory ol,.theory ul{padding-left:1.3rem}
.tip{border-left:4px solid var(--acc);background:var(--acc2);padding:.6rem .85rem;border-radius:0 8px 8px 0;margin:.9rem 0;font-size:.93rem}
table.t{border-collapse:collapse;width:100%;font-size:.88rem;margin:.6rem 0;display:block;overflow-x:auto}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.t th{color:var(--ink2);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:.3rem;margin-bottom:.6rem;background:var(--box);padding:.25rem;border-radius:10px;width:max-content;max-width:100%}
.tabs button{border:0;background:transparent;padding:.35rem .9rem;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--ink2)}
.tabs button.cur{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.reto{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-bottom:.7rem}
.reto h3{margin:0 0 .3rem;font-size:1rem}
.reto .en{margin:.2rem 0 .6rem}
.reto .acts{display:flex;gap:.45rem;flex-wrap:wrap}
.tagt{font-size:.8rem;margin:.4rem 0 .6rem;display:flex;flex-wrap:wrap;gap:.3rem}
.tagt span{background:var(--box);border-radius:6px;padding:.1rem .45rem;font-family:var(--mono)}
.tagt span b{font-family:ui-sans-serif,system-ui,sans-serif;font-weight:600}
.res{list-style:none;padding:0;margin:.7rem 0 0;display:flex;flex-direction:column;gap:.25rem;font-size:.88rem}
.res li{padding:.3rem .55rem;border-radius:7px;background:var(--box)}
.res li.ok{background:var(--good2)}
.res li.ko{background:var(--bad2)}
.res .why{display:block;font-family:var(--mono);font-size:.8rem;color:var(--bad);margin-top:.15rem}
.banner{padding:.6rem .8rem;border-radius:9px;font-weight:600;margin-top:.6rem}
.banner.ok{background:var(--good2);color:var(--on)}
.banner.ko{background:var(--bad2);color:var(--bad)}
.quiz{margin-top:1.6rem;border-top:1px solid var(--line);padding-top:1rem}
.quiz h2{font-size:1.1rem;margin:0 0 .6rem}
.qq{margin:0 0 1rem}
.qq p{margin:0 0 .35rem;font-weight:600}
.qq label{display:flex;gap:.5rem;align-items:flex-start;padding:.35rem .55rem;border-radius:8px;border:1px solid var(--line);margin:.25rem 0;cursor:pointer;font-size:.93rem}
.qq label:hover{background:var(--hover)}
.qq label.ok{border-color:var(--on);background:var(--good2)}
.qq label.ko{border-color:var(--bad);background:var(--bad2)}
.qq .ex{font-size:.86rem;color:var(--ink2);margin:.2rem 0 0 .2rem}
.pn{display:flex;justify-content:space-between;gap:1rem;margin-top:1.4rem;flex-wrap:wrap}

/* ---------- simulador ---------- */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.simbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;padding:.5rem .7rem;border-bottom:1px solid var(--line);background:var(--box)}
.cpu{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:.82rem;font-family:var(--mono)}
.led{width:11px;height:11px;border-radius:50%;background:#E0A800;box-shadow:0 0 0 2px rgba(0,0,0,.08)}
.led.run{background:var(--on);box-shadow:0 0 8px var(--on)}
.simbar .sp{flex:1}
.scan{font-family:var(--mono);font-size:.74rem;color:var(--ink3)}
.tg-edit[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.io{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0;border-bottom:1px solid var(--line)}
.io>div{padding:.6rem .7rem;min-width:0}
.io>div+div{border-left:1px solid var(--line)}
.io h5{margin:0 0 .4rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
@media (max-width:560px){.io{grid-template-columns:1fr}.io>div+div{border-left:0;border-top:1px solid var(--line)}}
.ins,.outs{display:flex;flex-wrap:wrap;gap:.45rem}
.in{display:flex;flex-direction:column;gap:.2rem;min-width:112px;flex:1 1 112px;max-width:180px}
.pb{-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;border:1px solid var(--line);background:var(--canvas);border-radius:10px;padding:.45rem .5rem;cursor:pointer;font-weight:600;font-size:.85rem;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;display:flex;align-items:center;gap:.45rem;line-height:1.2}
.pb .k{width:20px;height:20px;border-radius:50%;flex:none;background:var(--lamp);border:3px solid var(--canvas);box-shadow:0 0 0 1.5px var(--ink3);transition:transform .05s}
.pb.sw .k{border-radius:5px}
.pb.pressed .k{transform:scale(.85);background:var(--acc)}
.pb.nc .k{background:#D23B3B}
.pb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in .sig{font-family:var(--mono);font-size:.7rem;color:var(--ink3);display:flex;justify-content:space-between;gap:.3rem;align-items:center}
.in .sig b{padding:0 .3rem;border-radius:4px;background:var(--box);color:var(--ink2)}
.in .sig b.h{background:var(--on);color:#fff}
.in label{font-size:.7rem;color:var(--ink3);display:flex;gap:.25rem;align-items:center;cursor:pointer}
.ana{flex:1 1 100%;display:flex;flex-direction:column;gap:.1rem;font-size:.8rem}
.ana input{width:100%;accent-color:var(--acc)}
.ana .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;color:var(--ink2)}
.lamp{display:flex;align-items:center;gap:.4rem;font-size:.82rem;min-width:110px;flex:1 1 110px;max-width:170px}
.lamp i{width:22px;height:22px;border-radius:50%;background:var(--lamp);flex:none;border:2px solid var(--line)}
.lamp.on i{background:#FFC83D;border-color:#E6A200;box-shadow:0 0 12px #FFC83D}
.lamp span{line-height:1.15;overflow:hidden}
.lamp small{display:block;font-family:var(--mono);color:var(--ink3);font-size:.68rem}
.empty{font-size:.8rem;color:var(--ink3)}
.segs{background:var(--canvas);padding:.3rem 0}
.seg{border-bottom:1px solid var(--line)}
.seg:last-child{border-bottom:0}
.seghd{display:flex;align-items:center;gap:.4rem;padding:.35rem .7rem 0;font-size:.8rem;color:var(--ink2)}
.seghd b{color:var(--ink);white-space:nowrap}
.seghd input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:.15rem .4rem;background:var(--panel);color:var(--ink);font:inherit}
.seghd .x{border:0;background:transparent;cursor:pointer;color:var(--ink3);font-size:1rem;padding:0 .2rem}
.segbody{overflow-x:auto;padding:0 .3rem .2rem}
.segbody svg{display:block}
.addseg{margin:.5rem .7rem .7rem}
.watch{border-top:1px solid var(--line);font-size:.82rem}
.watch summary{cursor:pointer;padding:.5rem .7rem;font-weight:600;color:var(--ink2)}
.watch .wrap{overflow-x:auto;padding:0 .7rem .6rem}
.watch table{border-collapse:collapse;width:100%}
.watch td,.watch th{padding:.2rem .45rem;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.watch th{font-size:.7rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.watch td.v{font-family:var(--mono)}
.watch td.v.t{color:var(--on);font-weight:700}
.watch td.a{font-family:var(--mono);color:var(--ink3)}
.hmi{border-bottom:1px solid var(--line);background:var(--canvas);padding:.5rem .7rem}
.hmi h5{margin:0 0 .2rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.hmi svg{display:block;width:100%;height:auto;max-height:260px;font-family:ui-sans-serif,system-ui,sans-serif}
.pb.ro{cursor:default;background:var(--box)}
.pb.ro.lit .k{background:var(--on)}
.pb.pf .k{background:var(--on)}
.pb.pf.pressed .k{background:var(--bad)}
.meter .av{font-weight:700;color:var(--acc)}
.edithint{font-size:.78rem;color:var(--ink2);background:var(--warn2);padding:.35rem .7rem;border-bottom:1px solid var(--line)}

/* SVG LAD */
svg.lad{font-family:ui-sans-serif,system-ui,sans-serif}
svg.lad .w{stroke:var(--off);stroke-width:1.6;stroke-dasharray:5 3;fill:none}
svg.lad .w.on{stroke:var(--on);stroke-width:2.6;stroke-dasharray:none}
svg.lad .rail{stroke:var(--ink);stroke-width:4}
svg.lad .sym{stroke:var(--ink);stroke-width:2.2;fill:none}
svg.lad .sym.on{stroke:var(--on);stroke-width:2.8}
svg.lad .symt{fill:var(--ink);font-size:12px;font-weight:700;text-anchor:middle}
svg.lad .symt.on{fill:var(--on)}
svg.lad .lb{fill:var(--ink);font-size:10.5px;font-weight:600;text-anchor:middle}
svg.lad .ad{fill:var(--ink3);font-size:9.5px;font-family:var(--mono);text-anchor:middle}
svg.lad .miss{fill:var(--bad);font-size:10px;font-family:var(--mono);text-anchor:middle}
svg.lad .box{fill:var(--box);stroke:var(--ink);stroke-width:1.4}
svg.lad .box.on{stroke:var(--on);stroke-width:2}
svg.lad .bt{fill:var(--ink);font-size:11px;font-weight:700;text-anchor:middle}
svg.lad .pn{fill:var(--ink2);font-size:9.5px;font-weight:600}
svg.lad .pv{fill:var(--ink);font-size:9.5px;font-family:var(--mono)}
svg.lad .pv.on{fill:var(--on);font-weight:700}
svg.lad .pv.live{fill:var(--acc);font-weight:700}
svg.lad .stub{stroke:var(--ink3);stroke-width:1.2}
svg.lad .hit{fill:transparent}
.editing svg.lad .el{cursor:pointer}
.editing svg.lad .el:hover .hit,.editing svg.lad .el:focus .hit{fill:var(--hover)}
.editing svg.lad .el:focus{outline:none}
.editing svg.lad .el:focus .hit{stroke:var(--acc);stroke-width:2}
.editing svg.lad .el.sel .hit{fill:var(--hover);stroke:var(--acc);stroke-width:1.5;stroke-dasharray:3 2}
svg.lad .ph rect.phr{fill:transparent;stroke:var(--acc);stroke-dasharray:4 3;stroke-width:1.5}
svg.lad .ph text{fill:var(--acc);font-size:18px;font-weight:700;text-anchor:middle}

/* ---------- hoja del editor ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.sheet{position:fixed;z-index:41;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100vw);max-height:84vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;padding:.9rem 1rem 1.2rem;box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:900px){.sheet{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:16px}}
.sh-hd{display:flex;align-items:center;gap:.5rem;margin-bottom:.5rem}
.sh-hd b{font-size:1.02rem;flex:1}
.sh-prev{background:var(--canvas);border:1px solid var(--line);border-radius:10px;display:flex;justify-content:center;padding:.3rem;margin-bottom:.6rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}

.help{font-size:.82rem;color:var(--ink2);margin:.6rem 0}
.acts2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.35rem;margin-top:.6rem}
.acts2 button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.4rem .5rem;cursor:pointer;font-size:.85rem;text-align:left}
.acts2 button:hover{background:var(--hover)}
.acts2 button.del{color:var(--bad)}
.pick h6{margin:.7rem 0 .3rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3)}
.pick .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.35rem}
.pick button{border:1px solid var(--line);background:var(--canvas);border-radius:9px;padding:.25rem .2rem .35rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--ink2);gap:.1rem}
.pick button:hover{border-color:var(--acc)}
.pick svg{width:80px;height:46px}

/* ---------- referencia ---------- */
.refg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.8rem;margin-top:1rem}
.refg .card{padding:.8rem .9rem}
.refg .card h3{margin:.3rem 0 .2rem;font-size:.98rem}
.refg .card p{margin:0;font-size:.86rem;color:var(--ink2)}
.refg .pv{background:var(--canvas);border:1px solid var(--line);border-radius:9px;overflow-x:auto;display:flex;justify-content:center}

.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:10px;font-weight:600;font-size:.9rem;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
.stats{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:1rem;margin-top:1rem}
@media (max-width:760px){.stats{grid-template-columns:1fr}}
.rk{font-size:1.25rem;font-weight:800;margin:.1rem 0}
.kpis{display:flex;gap:1.2rem;margin:.6rem 0 .2rem;flex-wrap:wrap}
.kpis div{font-size:.78rem;color:var(--ink2)}
.kpis b{display:block;font-size:1.3rem;color:var(--ink)}
.xpbar{height:8px;background:var(--box);border-radius:9px;overflow:hidden;margin:.4rem 0 .2rem}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--on));border-radius:9px}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.45rem;margin-top:.5rem}
.bdg div{border:1px solid var(--line);border-radius:10px;padding:.4rem .5rem;font-size:.74rem;line-height:1.25;color:var(--ink2)}
.bdg div b{display:block;color:var(--ink);font-size:.8rem}
.bdg div span{font-size:1.3rem}
.bdg div.off{opacity:.42;filter:grayscale(1)}
.ruta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1rem;align-items:center;margin-top:1rem;border:2px solid var(--acc);background:linear-gradient(135deg,var(--acc2),var(--panel))}
.ruta .big{font-size:2.4rem}
.ruta h2{margin:0 0 .2rem}
.ruta p{margin:.1rem 0 .6rem;color:var(--ink2);font-size:.92rem}
h2.sec{font-size:1.2rem;margin:1.6rem 0 .2rem}
p.lead{color:var(--ink2);margin:.2rem 0 0}
</style>

<script>
/* Contenido del curso: lecciones, programas de ejemplo, retos autocorregidos y
   cuestionarios. Cada programa es una lista de segmentos; cada segmento es una
   red serie/paralelo de instrucciones LAD. */

/* ---------- constructores de red ---------- */
function S() { return { t: "S", items: Array.prototype.slice.call(arguments) }; }
function P() { return { t: "P", br: Array.prototype.slice.call(arguments).map(function (b) { return Array.isArray(b) ? S.apply(null, b) : (b.t === "S" ? b : S(b)); }) }; }
function E(k, o) { var e = { t: "E", k: k }; for (var p in o) e[p] = o[p]; return e; }
var NO = function (op) { return E("NO", { op: op }); };
var NC = function (op) { return E("NC", { op: op }); };
var PC = function (op, mem) { return E("P", { op: op, mem: mem }); };
var NE = function (op, mem) { return E("N", { op: op, mem: mem }); };
var COIL = function (op) { return E("COIL", { op: op }); };
var SET = function (op) { return E("SET", { op: op }); };
var RST = function (op) { return E("RESET", { op: op }); };
var TON = function (n, pt) { return E("TON", { name: n, pt: pt }); };
var TOF = function (n, pt) { return E("TOF", { name: n, pt: pt }); };
var TP = function (n, pt) { return E("TP", { name: n, pt: pt }); };
var CTU = function (n, r, pv) { return E("CTU", { name: n, r: r, pv: String(pv) }); };
var CTD = function (n, ld, pv) { return E("CTD", { name: n, ld: ld, pv: String(pv) }); };
var CMP = function (c, a, b) { return E("CMP", { cmp: c, a: a, b: String(b) }); };
var MOVE = function (i, o) { return E("MOVE", { in: String(i), out: o }); };
var MATH = function (k, a, b, o) { return E(k, { in1: String(a), in2: String(b), out: o }); };
function SEG(title, net) { return { title: title, net: net }; }

/* tipos de entrada: push (pulsador NA), pushNC (pulsador cableado NC),
   switch (selector), analog (palabra que mueve el alumno), plant / plantw (bit o
   palabra que mueve el modelo de planta). Opciones: def (valor inicial),
   min/max/unit/div (escala de una palabra), falla (botón para simular falla). */
function TAG(addr, name, type, note, o) {
  var t = { addr: addr, name: name, type: type || "", note: note || "" };
  for (var k in (o || {})) t[k] = o[k];
  return t;
}

var NIVELES = [
  { id: "basico", nombre: "Básico", desc: "El PLC, TIA Portal y la lógica de contactos." },
  { id: "intermedio", nombre: "Intermedio", desc: "Flancos, temporizadores, contadores y datos." },
  { id: "avanzado", nombre: "Avanzado", desc: "Bloques, secuencias, analógicas y oficio." }
];

var LECCIONES = [
/* ==================================================================== */
{ id: "plc", nivel: "basico", titulo: "El PLC y el ciclo de scan", min: 10,
  teoria: `
<p>Un <b>PLC</b> (controlador lógico programable) es una computadora industrial que lee
sensores, ejecuta un programa y gobierna actuadores. Siemens fabrica las familias
<b>S7‑1200</b> (máquinas pequeñas y medianas) y <b>S7‑1500</b> (procesos grandes);
las dos se programan con <b>TIA Portal</b> (Totally Integrated Automation).</p>
<h3>El ciclo de scan</h3>
<p>El PLC no ejecuta el programa “una vez”: lo repite sin parar, en milisegundos,
siempre en el mismo orden:</p>
<ol>
  <li><b>Lee las entradas</b> físicas y copia su estado a la <i>imagen de proceso de entradas</i> (PII, área <code>%I</code>).</li>
  <li><b>Ejecuta el programa</b> (el bloque <code>OB1 "Main"</code>), segmento por segmento, de arriba hacia abajo y de izquierda a derecha.</li>
  <li><b>Escribe las salidas</b>: copia la <i>imagen de proceso de salidas</i> (PIQ, área <code>%Q</code>) a los bornes físicos.</li>
  <li>Comunicaciones y autodiagnóstico, y vuelta a empezar.</li>
</ol>
<div class="tip"><b>Consecuencia práctica:</b> si un pulsador cambia en mitad del programa, el
PLC no lo “ve” hasta el siguiente ciclo. Y si escribes la misma bobina en dos
segmentos, <b>gana el último</b>: solo ese valor llega a la salida física.</div>
<h3>¿Por qué Ladder?</h3>
<p>El lenguaje <b>Ladder</b> o <b>LAD</b> (diagrama de contactos, norma IEC 61131‑3) dibuja el
programa como un esquema eléctrico de relés: una barra de alimentación a la izquierda, contactos
que dejan o no pasar la “corriente” y bobinas que se energizan. Lo lee cualquier
electricista, y por eso es el lenguaje más usado en planta. TIA Portal también ofrece
FUP (bloques), SCL (texto estructurado) y GRAPH (secuencias).</p>
<p>En el simulador de la derecha, el PLC está en <b>RUN</b>: pulsa la entrada y mira cómo
la corriente (línea verde continua) llega a la bobina. Las líneas azules punteadas no conducen,
igual que en la vista <i>online</i> de TIA Portal.</p>`,
  ejemplo: { tags: [TAG("%I0.0", "Pulsador", "push"), TAG("%Q0.0", "Lampara")],
    prog: [SEG("Encender la lámpara mientras se pulsa", S(NO("%I0.0"), COIL("%Q0.0")))] },
  quiz: [
    { q: "¿En qué orden trabaja el ciclo de scan?", o: ["Ejecuta programa → lee entradas → escribe salidas", "Lee entradas → ejecuta programa → escribe salidas", "Escribe salidas → lee entradas → ejecuta programa"], a: 1, e: "Primero congela las entradas en la PII, luego ejecuta OB1 y al final copia la PIQ a las salidas." },
    { q: "Si la bobina %Q0.0 aparece en el segmento 2 y en el 5, ¿qué valor sale por el borne?", o: ["El del segmento 2", "El del segmento 5", "Un OR de los dos"], a: 1, e: "El último en escribir gana. Por eso una bobina debe escribirse en un solo lugar del programa." },
    { q: "¿Qué bloque ejecuta el ciclo principal en un S7‑1200/1500?", o: ["OB100", "FB1", "OB1 \"Main\""], a: 2, e: "OB1 es el bloque de organización del ciclo. OB100 se ejecuta una sola vez en el arranque." }
  ] },
/* ==================================================================== */
{ id: "tia", nivel: "basico", titulo: "TIA Portal, direcciones y tipos de datos", min: 15,
  teoria: `
<h3>Del proyecto al PLC en 6 pasos</h3>
<ol>
  <li><b>Crear proyecto</b> → <i>Agregar dispositivo</i> → elegir la CPU exacta (p. ej. CPU 1214C DC/DC/DC) y su versión de firmware.</li>
  <li>En la <b>configuración de dispositivos</b> revisar las direcciones de E/S, la IP (p. ej. 192.168.0.1) y activar la marca de ciclo si se necesita.</li>
  <li>En <b>Variables PLC</b> declarar la <b>tabla de variables</b>: nombre simbólico, tipo y dirección.</li>
  <li>Abrir <code>Bloques de programa → Main [OB1]</code> y programar en LAD.</li>
  <li><b>Compilar</b> (hardware y software) y corregir los errores de la ventana <i>Información</i>.</li>
  <li><b>Cargar en dispositivo</b> o, sin PLC, <b>Iniciar simulación</b> con S7‑PLCSIM. Luego <i>Activar observación</i> (icono de gafas) para ver el programa online.</li>
</ol>
<h3>Áreas de memoria y direcciones</h3>
<table class="t">
<tr><th>Área</th><th>Ejemplo</th><th>Qué es</th></tr>
<tr><td>Entradas</td><td><code>%I0.0</code></td><td>Bit 0 del byte 0 de entradas (un pulsador, un sensor)</td></tr>
<tr><td>Salidas</td><td><code>%Q0.0</code></td><td>Bit 0 del byte 0 de salidas (contactor, lámpara, válvula)</td></tr>
<tr><td>Marcas</td><td><code>%M10.0</code>, <code>%MW20</code></td><td>Memoria interna: bits auxiliares y palabras</td></tr>
<tr><td>Entrada analógica</td><td><code>%IW64</code></td><td>Palabra de 16 bits de un canal analógico</td></tr>
<tr><td>Bloques de datos</td><td><code>"Datos".Velocidad</code></td><td>Variables en un DB (lo veremos en avanzado)</td></tr>
</table>
<p>Un byte tiene 8 bits (<code>.0</code> a <code>.7</code>): después de <code>%I0.7</code> viene
<code>%I1.0</code>. Una CPU 1214C trae 14 entradas (<code>%I0.0…%I1.5</code>) y 10 salidas
(<code>%Q0.0…%Q1.1</code>).</p>
<h3>Tipos de datos más usados</h3>
<table class="t">
<tr><th>Tipo</th><th>Tamaño</th><th>Rango / uso</th></tr>
<tr><td>Bool</td><td>1 bit</td><td>TRUE / FALSE</td></tr>
<tr><td>Byte, Word, DWord</td><td>8, 16, 32 bits</td><td>Patrones de bits</td></tr>
<tr><td>Int</td><td>16 bits</td><td>−32 768 … 32 767</td></tr>
<tr><td>DInt</td><td>32 bits</td><td>±2 147 483 647</td></tr>
<tr><td>Real</td><td>32 bits</td><td>Coma flotante (3.1416)</td></tr>
<tr><td>Time</td><td>32 bits</td><td>Duraciones: <code>T#5s</code>, <code>T#1m30s</code>, <code>T#250ms</code></td></tr>
</table>
<div class="tip"><b>Buena práctica:</b> programa siempre con <b>nombres simbólicos</b>
(<code>"Marcha_Bomba"</code>) y no con direcciones sueltas. TIA los muestra entre comillas.
Si cambia el cableado, solo editas la tabla de variables.</div>`,
  ejemplo: { tags: [TAG("%I0.0", "Sensor_Puerta", "switch"), TAG("%Q0.0", "Luz_Cabina"), TAG("%I1.0", "Sensor_Tapa", "switch"), TAG("%Q1.0", "Aviso")],
    prog: [SEG("Byte 0", S(NO("%I0.0"), COIL("%Q0.0"))), SEG("Byte 1: después de %I0.7 viene %I1.0", S(NO("%I1.0"), COIL("%Q1.0")))] },
  quiz: [
    { q: "¿Qué dirección sigue a %I0.7?", o: ["%I0.8", "%I1.0", "%I0.10"], a: 1, e: "Los bits van de .0 a .7; luego empieza el byte 1." },
    { q: "¿Qué tipo usarías para guardar una velocidad de 1500 rpm?", o: ["Bool", "Int", "Time"], a: 1, e: "Int (16 bits con signo) alcanza hasta 32 767." },
    { q: "Sin PLC físico, ¿cómo pruebas el programa en TIA Portal?", o: ["No se puede", "Con S7‑PLCSIM (Iniciar simulación)", "Exportando a Excel"], a: 1, e: "PLCSIM emula la CPU en el PC; se carga igual que en una real." },
    { q: "¿Cómo escribe TIA Portal un tiempo de 2 minutos y medio?", o: ["T#2m30s", "2.5min", "TIME(150)"], a: 0, e: "Los literales de tiempo empiezan por T# (o TIME#)." }
  ] },
/* ==================================================================== */
{ id: "contactos", nivel: "basico", titulo: "Contactos NA, NC y bobinas", min: 15,
  teoria: `
<p>Las tres instrucciones con las que se escribe casi todo:</p>
<table class="t">
<tr><th>Símbolo</th><th>Nombre</th><th>Conduce cuando…</th></tr>
<tr><td><code>--| |--</code></td><td>Contacto normalmente abierto (NA)</td><td>el operando vale <b>1</b></td></tr>
<tr><td><code>--|/|--</code></td><td>Contacto normalmente cerrado (NC)</td><td>el operando vale <b>0</b></td></tr>
<tr><td><code>--( )--</code></td><td>Bobina (asignación)</td><td>escribe en el operando el estado de la corriente que le llega</td></tr>
<tr><td><code>--(/)--</code></td><td>Bobina negada</td><td>escribe lo contrario</td></tr>
</table>
<div class="tip"><b>La confusión nº 1:</b> el contacto del programa <b>no</b> es el contacto físico.
El contacto NC del programa pregunta “¿la señal vale 0?”. Si el pulsador físico es NC, cuando
nadie lo toca la entrada vale 1.</div>
<p>En TIA Portal las instrucciones están en la pestaña <i>Instrucciones → Operaciones lógicas
con bits</i>, y las más usadas también en la barra de <b>favoritos</b> sobre el editor.
Se arrastran al segmento y se escribe el operando encima, en el campo <code>&lt;??.?&gt;</code>.</p>
<p>En el ejemplo, la lámpara verde enciende con el pulsador y la roja está encendida
<i>mientras no</i> se pulse.</p>`,
  ejemplo: { tags: [TAG("%I0.0", "Pulsador", "push"), TAG("%Q0.0", "Luz_Verde"), TAG("%Q0.1", "Luz_Roja")],
    prog: [SEG("Contacto NA", S(NO("%I0.0"), COIL("%Q0.0"))), SEG("Contacto NC", S(NC("%I0.0"), COIL("%Q0.1")))] },
  reto: {
    enunciado: "Una cinta tiene un sensor de presencia <code>%I0.2 \"Sensor\"</code>. Programa la luz <code>%Q0.0 \"Hay_Pieza\"</code> que enciende cuando hay pieza y la luz <code>%Q0.1 \"Libre\"</code> que enciende cuando no la hay.",
    tags: [TAG("%I0.2", "Sensor", "switch"), TAG("%Q0.0", "Hay_Pieza"), TAG("%Q0.1", "Libre")],
    inicio: [SEG("Hay pieza", S()), SEG("Libre", S())],
    solucion: [SEG("Hay pieza", S(NO("%I0.2"), COIL("%Q0.0"))), SEG("Libre", S(NC("%I0.2"), COIL("%Q0.1")))],
    pasos: [
      { in: {}, t: 100, ex: { "%Q0.0": 0, "%Q0.1": 1 }, d: "Sin pieza: solo «Libre»." },
      { in: { "%I0.2": 1 }, t: 100, ex: { "%Q0.0": 1, "%Q0.1": 0 }, d: "Con pieza: solo «Hay_Pieza»." },
      { in: { "%I0.2": 0 }, t: 100, ex: { "%Q0.0": 0, "%Q0.1": 1 }, d: "La pieza se va: vuelve «Libre»." }
    ] },
  quiz: [
    { q: "Un contacto NC del programa con operando %I0.0 conduce cuando…", o: ["%I0.0 = 1", "%I0.0 = 0", "Siempre"], a: 1, e: "NC = conduce mientras el operando valga 0." },
    { q: "Un pulsador de paro cableado NC, sin pulsar, da en %I0.1 la señal…", o: ["0", "1"], a: 1, e: "El contacto físico está cerrado: llega tensión a la entrada → 1." },
    { q: "¿Qué hace una bobina --( )-- cuando deja de llegarle corriente?", o: ["Mantiene el 1", "Escribe 0", "Da error"], a: 1, e: "La asignación copia el estado en cada ciclo; si no llega corriente, escribe 0." }
  ] },
/* ==================================================================== */
{ id: "logica", nivel: "basico", titulo: "Serie y paralelo: AND, OR", min: 15,
  teoria: `
<p>Los contactos se combinan como en un tablero eléctrico:</p>
<ul>
  <li><b>En serie = Y (AND):</b> la corriente pasa solo si <i>todos</i> los contactos conducen.</li>
  <li><b>En paralelo = O (OR):</b> pasa si conduce <i>al menos una</i> rama.</li>
</ul>
<table class="t">
<tr><th>A</th><th>B</th><th>A AND B</th><th>A OR B</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>0</td><td>1</td><td>0</td><td>1</td></tr>
<tr><td>1</td><td>0</td><td>0</td><td>1</td></tr>
<tr><td>1</td><td>1</td><td>1</td><td>1</td></tr>
</table>
<p>En TIA Portal una rama paralela se abre con <i>Abrir rama</i> (la flecha ↓ de favoritos) y se
cierra con <i>Cerrar rama</i> (↑) en el punto donde se une a la línea principal.</p>
<p>Con esto aparece la <b>lógica combinada</b>: <code>(A AND B) OR C</code> se dibuja con A y B en
serie en una rama, y C en una rama paralela a las dos.</p>
<div class="tip">En el editor de esta app: activa <b>Editar</b>, toca un contacto y elige
<i>Rama paralela</i>. Para que la rama abarque también el contacto siguiente usa
<i>Extender rama →</i>.</div>`,
  ejemplo: { tags: [TAG("%I0.0", "A", "switch"), TAG("%I0.1", "B", "switch"), TAG("%Q0.0", "A_y_B"), TAG("%Q0.1", "A_o_B")],
    prog: [SEG("Serie = AND", S(NO("%I0.0"), NO("%I0.1"), COIL("%Q0.0"))), SEG("Paralelo = OR", S(P([NO("%I0.0")], [NO("%I0.1")]), COIL("%Q0.1")))] },
  reto: {
    enunciado: "Prensa: el cilindro <code>%Q0.0 \"Bajar\"</code> baja solo si el operario mantiene <b>los dos</b> pulsadores <code>%I0.0 \"Mano_Izq\"</code> y <code>%I0.1 \"Mano_Der\"</code>, <b>o</b> si el técnico activa la llave de mantenimiento <code>%I0.2 \"Llave_Mant\"</code>.",
    tags: [TAG("%I0.0", "Mano_Izq", "push"), TAG("%I0.1", "Mano_Der", "push"), TAG("%I0.2", "Llave_Mant", "switch"), TAG("%Q0.0", "Bajar")],
    inicio: [SEG("Bajar prensa", S(NO("%I0.0"), COIL("%Q0.0")))],
    solucion: [SEG("Bajar prensa", S(P([NO("%I0.0"), NO("%I0.1")], [NO("%I0.2")]), COIL("%Q0.0")))],
    pasos: [
      { in: {}, t: 60, ex: { "%Q0.0": 0 }, d: "Nadie pulsa: no baja." },

{ id: "enclavamiento", nivel: "basico", titulo: "Marcha‑paro con autorretención", min: 20,
  teoria: `
<p>El circuito más famoso de la automatización. Un motor arranca con un pulsador de
<b>marcha</b> y debe <b>seguir</b> funcionando al soltarlo, hasta que se pulse <b>paro</b>.</p>
<p>El truco es el <b>contacto de autorretención</b> (o enclavamiento): un contacto NA de la propia
salida en paralelo con la marcha. Cuando la bobina se energiza, su contacto “se puentea” a sí mismo.</p>
<h3>El paro va cableado NC (seguridad positiva)</h3>
<p>Los pulsadores de paro y las setas de emergencia se cablean <b>normalmente cerrados</b>: si se corta
un cable, la entrada cae a 0 y la máquina se detiene sola. Por eso, sin pulsar, <code>%I0.1 "Paro" = 1</code>,
y en el programa se usa un <b>contacto NA</b> de Paro: conduce mientras nadie lo pulse.</p>
<div class="tip"><b>Ojo:</b> en el simulador, el pulsador de paro está marcado como <i>NC cableado</i>:
fíjate que la señal vale 1 en reposo y 0 al pulsarlo.</div>
<p>Como el paro está en serie <b>después</b> del paralelo, también manda cuando se pulsan los dos a la vez:
es un circuito <b>con prioridad al paro</b>, que es lo que pide la seguridad.</p>
<p><i>Nota:</i> la parada de emergencia real no se resuelve solo con el programa: va por un relé o PLC de
seguridad (F‑CPU) que corta la potencia.</p>`,
  ejemplo: { tags: [TAG("%I0.0", "Marcha", "push"), TAG("%I0.1", "Paro", "pushNC", "NC cableado"), TAG("%Q0.0", "Motor")],

      { in: { "%I0.3": 0, "%I0.5": 1 }, t: 60, ex: { "%Q0.4": 0 }, d: "Dispara el térmico: se detiene." },

    { q: "Con el paro cableado NC, ¿qué contacto se usa en el programa?", o: ["NA (--| |--)", "NC (--|/|--)"], a: 0, e: "En reposo la entrada vale 1; el contacto NA conduce hasta que se pulsa." },
    { q: "Si se corta el cable del paro NC…", o: ["La máquina no se puede detener", "La máquina se detiene (falla segura)", "No pasa nada"], a: 1, e: "La entrada cae a 0 como si se pulsara: seguridad positiva." }

{ id: "setreset", nivel: "basico", titulo: "Set, Reset y biestables SR/RS", min: 15,
  teoria: `
<p>Otra forma de memorizar un estado son las bobinas <b>Set</b> y <b>Reset</b>:</p>
<ul>
  <li><code>--(S)--</code> pone el operando a 1 cuando le llega corriente, y lo deja así.</li>
  <li><code>--(R)--</code> pone el operando a 0 cuando le llega corriente.</li>
  <li>Si no les llega corriente, <b>no hacen nada</b> (el valor se conserva).</li>
</ul>
<p>Si en el mismo ciclo se ejecutan las dos, gana la que está <b>más abajo</b> en el programa
(la última que escribe). TIA también tiene las cajas <b>SR</b> (prioridad al Reset) y
<b>RS</b> (prioridad al Set) que resumen eso en una instrucción.</p>
<div class="tip"><b>¿Autorretención o Set/Reset?</b> Las dos sirven. La autorretención se ve entera en un
segmento; con Set/Reset el arranque y la parada pueden estar lejos, así que conviene agruparlos.
Muchas empresas prohíben hacer Set de una misma salida en varios lugares: complica el diagnóstico.</div>
<p>Uso típico: <b>alarmas</b> que quedan memorizadas hasta que el operador las reconoce.</p>`,
  ejemplo: { tags: [TAG("%I0.0", "Marcha", "push"), TAG("%I0.1", "Paro", "pushNC", "NC cableado"), TAG("%Q0.0", "Motor")],
    prog: [SEG("Arranque", S(NO("%I0.0"), SET("%Q0.0"))), SEG("Parada (abajo: tiene prioridad)", S(NC("%I0.1"), RST("%Q0.0")))] },

    enunciado: "Alarma de nivel alto: cuando el sensor <code>%I0.2 \"Nivel_Alto\"</code> se activa, la baliza <code>%Q0.1 \"Alarma\"</code> se enciende y <b>queda memorizada</b> aunque el nivel baje. El pulsador <code>%I0.3 \"Reconocer\"</code> la apaga, pero <b>solo</b> si el nivel ya no está alto.",
    tags: [TAG("%I0.2", "Nivel_Alto", "switch"), TAG("%I0.3", "Reconocer", "push"), TAG("%Q0.1", "Alarma")],
    inicio: [SEG("Activar alarma", S()), SEG("Reconocer alarma", S())],
    solucion: [SEG("Activar alarma", S(NO("%I0.2"), SET("%Q0.1"))), SEG("Reconocer alarma", S(NO("%I0.3"), NC("%I0.2"), RST("%Q0.1")))],
    pasos: [
      { in: {}, t: 60, ex: { "%Q0.1": 0 }, d: "Todo normal: sin alarma." },
      { in: { "%I0.2": 1 }, t: 60, ex: { "%Q0.1": 1 }, d: "Nivel alto: alarma." },
      { in: { "%I0.2": 0 }, t: 200, ex: { "%Q0.1": 1 }, d: "El nivel baja: la alarma queda memorizada." },
      { in: { "%I0.2": 1, "%I0.3": 1 }, t: 60, ex: { "%Q0.1": 1 }, d: "Reconocer con el nivel aún alto: no se apaga." },
      { in: { "%I0.3": 0, "%I0.2": 0 }, t: 60, ex: { "%Q0.1": 1 }, d: "Baja el nivel: sigue memorizada." },
      { in: { "%I0.3": 1 }, t: 60, ex: { "%Q0.1": 0 }, d: "Reconocer con nivel normal: se apaga." }
    ] },
  quiz: [
    { q: "Una bobina (S) deja de recibir corriente. El operando…", o: ["Pasa a 0", "Conserva su valor", "Cambia de estado"], a: 1, e: "Set solo actúa cuando le llega corriente." },
    { q: "Set en el segmento 3 y Reset en el 4, ambos activos en el mismo ciclo. Resultado:", o: ["1", "0"], a: 1, e: "Gana el último en ejecutarse." },
    { q: "La caja SR de TIA Portal tiene prioridad al…", o: ["Set", "Reset"], a: 1, e: "SR = Reset dominante; RS = Set dominante (la última letra manda)." }

{ id: "flancos", nivel: "intermedio", titulo: "Flancos: detectar el instante del cambio", min: 20,
  teoria: `
<p>A veces no interesa <i>si</i> un pulsador está pulsado, sino el <b>instante</b> en que se pulsa:
contar piezas, avanzar un paso, invertir un estado. Eso es un <b>flanco</b>:</p>
<ul>
  <li><b>Flanco positivo</b> <code>--|P|--</code>: conduce <b>un solo ciclo</b> cuando el operando pasa de 0 a 1.</li>
  <li><b>Flanco negativo</b> <code>--|N|--</code>: conduce un ciclo cuando pasa de 1 a 0.</li>
</ul>
<p>Para recordar el estado anterior, la instrucción necesita un <b>bit de marca de flanco</b> propio
(se escribe debajo del contacto, p. ej. <code>%M10.0</code>). <b>Cada flanco necesita su propio bit</b>
y no se debe usar ese bit para nada más.</p>
<p>TIA Portal también ofrece <code>P_TRIG</code>/<code>N_TRIG</code> (flanco de la corriente del segmento)
y los bloques <code>R_TRIG</code>/<code>F_TRIG</code> con instancia, muy usados dentro de FB.</p>
<div class="tip">El pulso dura un ciclo de scan (unos milisegundos): en la vista online casi no se ve.
Por eso en el ejemplo se usa para hacer <b>Set</b>; así se nota el efecto.</div>
<h3>Telerruptor (toggle)</h3>
<p>Un mismo pulsador que enciende con una pulsación y apaga con la siguiente. Es un clásico de entrevista:
necesitas un flanco y luego invertir la salida usando su propio estado.</p>`,
  ejemplo: { tags: [TAG("%I0.0", "Pulsador", "push"), TAG("%I0.1", "Borrar", "push"), TAG("%Q0.0", "Lampara_Pulsado"), TAG("%Q0.1", "Memo_Flanco_P"), TAG("%Q0.2", "Memo_Flanco_N")],

      SEG("Invertir la luz", S(P([NO("%M0.1"), NC("%Q0.0")], [NC("%M0.1"), NO("%Q0.0")]), COIL("%Q0.0")))],
    pasos: [
      { in: {}, t: 60, ex: { "%Q0.0": 0 }, d: "Inicio: apagada." },
      { in: { "%I0.0": 1 }, t: 300, ex: { "%Q0.0": 1 }, d: "1ª pulsación (mantenida 0,3 s): enciende y no parpadea." },
      { in: { "%I0.0": 0 }, t: 100, ex: { "%Q0.0": 1 }, d: "Soltar: sigue encendida." },

{ id: "temporizadores", nivel: "intermedio", titulo: "Temporizadores IEC: TON, TOF, TP", min: 25,
  teoria: `
<p>En S7‑1200/1500 se usan los temporizadores <b>IEC</b>. Cada uno es una caja con su
<b>bloque de datos de instancia</b> (TIA lo crea al soltar la caja: <code>"IEC_Timer_0_DB"</code>), donde
guarda su estado.</p>
<table class="t">
<tr><th>Pin</th><th>Tipo</th><th>Significado</th></tr>
<tr><td>IN</td><td>Bool</td><td>Entrada de arranque (la corriente del segmento)</td></tr>
<tr><td>PT</td><td>Time</td><td>Tiempo preseleccionado, p. ej. <code>T#5s</code></td></tr>
<tr><td>Q</td><td>Bool</td><td>Salida del temporizador</td></tr>
<tr><td>ET</td><td>Time</td><td>Tiempo transcurrido</td></tr>
</table>
<h3>Los tres tipos</h3>
<ul>
  <li><b>TON — retardo a la conexión:</b> Q se activa cuando IN lleva PT seguido en 1. Si IN cae antes, se reinicia.</li>
  <li><b>TOF — retardo a la desconexión:</b> Q se activa al instante con IN y se desactiva PT después de que IN cae. Ideal para ventiladores que siguen un rato.</li>
  <li><b>TP — impulso:</b> con el flanco de IN, Q da un pulso de duración exacta PT, aunque IN dure más o menos.</li>
</ul>
<div class="tip">Se puede leer el estado desde cualquier parte: <code>"T_Arranque".Q</code> y
<code>"T_Arranque".ET</code>. En esta app el nombre de la instancia es el texto sobre la caja

{ id: "contadores", nivel: "intermedio", titulo: "Contadores CTU, CTD, CTUD", min: 20,

<p>Los contadores IEC también usan un DB de instancia y cuentan <b>flancos</b> de su entrada
(no hace falta poner un contacto P delante).</p>
<table class="t">
<tr><th>Caja</th><th>Pines</th><th>Comportamiento</th></tr>
<tr><td><b>CTU</b> (ascendente)</td><td>CU, R, PV → Q, CV</td><td>CV +1 en cada flanco de CU. R pone CV a 0. Q = 1 cuando CV ≥ PV.</td></tr>
<tr><td><b>CTD</b> (descendente)</td><td>CD, LD, PV → Q, CV</td><td>CV −1 en cada flanco de CD. LD carga CV = PV. Q = 1 cuando CV ≤ 0.</td></tr>
<tr><td><b>CTUD</b></td><td>CU, CD, R, LD, PV → QU, QD, CV</td><td>Combina ambos.</td></tr>
</table>
<p>Al soltar la caja TIA pregunta el tipo de dato del contador (Int por defecto, también SInt, DInt, UInt…).</p>

<p>Si la cuenta va muy rápido (encoder, miles de pulsos por segundo), el ciclo de scan no alcanza: se usan los
<b>contadores rápidos HSC</b> de la CPU.</p>`,

<p>El Ladder no es solo bits. Con cajas se trabaja con números (Int, DInt, Real, Time):</p>
<ul>
  <li><b>Comparadores</b> <code>CMP ==, &lt;&gt;, &gt;, &lt;, &gt;=, &lt;=</code>: se comportan como un contacto que conduce si la comparación es cierta. Hay que elegir el tipo de dato (??? → Int).</li>
  <li><b>MOVE</b>: copia IN en OUT1 mientras le llega corriente por EN. Puedes añadir más salidas con la estrella (OUT2…).</li>
  <li><b>ADD, SUB, MUL, DIV</b>: OUT = IN1 op IN2. También <code>INC</code>/<code>DEC</code>, <code>MOD</code>, <code>ABS</code>, <code>LIMIT</code>, <code>MIN</code>/<code>MAX</code>.</li>
  <li><b>CONVERT</b>: cambia de tipo (Int → Real, Real → DInt con redondeo…).</li>
</ul>
<h3>EN y ENO</h3>
<p>Las cajas tienen una entrada <b>EN</b> (habilitación) y una salida <b>ENO</b>. Si EN = 0, la caja no se
ejecuta y OUT conserva su valor. ENO = 1 cuando se ejecutó sin errores (por ejemplo, un desbordamiento lo pone a 0).</p>

{ id: "bloques", nivel: "avanzado", titulo: "Programa estructurado: OB, FC, FB y DB", min: 25,
  teoria: `
<p>Un programa profesional no es un OB1 con 300 segmentos. Se divide en bloques:</p>
<table class="t">
<tr><th>Bloque</th><th>Para qué</th></tr>
<tr><td><b>OB</b> (bloque de organización)</td><td>Los llama el sistema operativo: <code>OB1</code> ciclo, <code>OB100</code> arranque, <code>OB30</code> alarma cíclica (cada X ms, ideal para PID), <code>OB82</code> diagnóstico, <code>OB80</code> error de tiempo.</td></tr>
<tr><td><b>FC</b> (función)</td><td>Código <b>sin memoria</b>: lo que entra, se calcula y sale. Ej.: escalar una señal.</td></tr>
<tr><td><b>FB</b> (bloque de función)</td><td>Código <b>con memoria</b> (variables Static) guardada en un <b>DB de instancia</b>. Ej.: un FB "Motor" que se reutiliza para 20 motores, cada uno con su DB.</td></tr>
<tr><td><b>DB global</b></td><td>Datos compartidos por todo el programa: recetas, consignas, datos para el HMI.</td></tr>
</table>
<h3>La interfaz de un bloque</h3>
<ul>
  <li><b>Input</b>: datos que entran. <b>Output</b>: resultados. <b>InOut</b>: se lee y se escribe.</li>
  <li><b>Static</b> (solo FB): memoria que se conserva entre ciclos (aquí viven los temporizadores como <b>multiinstancia</b>).</li>
  <li><b>Temp</b>: variables de trabajo que <b>no conservan</b> su valor: escríbelas antes de leerlas.</li>
  <li><b>Constant</b>: valores fijos con nombre.</li>
</ul>
<div class="tip"><b>Regla de oro del FB reutilizable:</b> dentro del FB usa solo su interfaz, nunca
<code>%I</code>, <code>%Q</code> o <code>%M</code> directos. Así el mismo bloque sirve para cualquier motor.</div>
<p>Con <b>acceso optimizado</b> (por defecto en S7‑1200/1500) las variables de un DB no tienen dirección
absoluta: se accede solo por nombre (<code>"Motor_1_DB".Marcha</code>), lo que es más rápido y seguro.</p>
<p>Un <b>UDT</b> (tipo de datos PLC) agrupa variables en una estructura propia: por ejemplo
<code>typMotor</code> con Marcha, Paro, Fallo, Horas… y se declara un array de 20 motores.</p>`,

{ id: "analogicas", nivel: "avanzado", titulo: "Señales analógicas: NORM_X y SCALE_X", min: 25,
  teoria: `
<p>Un transmisor de nivel, presión o temperatura entrega 4‑20 mA o 0‑10 V. El módulo analógico lo
convierte en un <b>Int</b> en una palabra de entrada, por ejemplo <code>%IW64</code>:</p>
<table class="t">
<tr><th>Señal</th><th>Valor en %IW</th></tr>
<tr><td>0 V / 4 mA (0 %)</td><td>0</td></tr>
<tr><td>5 V / 12 mA (50 %)</td><td>13 824</td></tr>
<tr><td>10 V / 20 mA (100 %)</td><td><b>27 648</b></td></tr>
<tr><td>Rebase / rotura de hilo</td><td>&gt; 27 648 (hasta 32 767)</td></tr>
</table>
<h3>Escalar en dos cajas</h3>
<ol>
  <li><code>NORM_X</code> (MIN = 0, VALUE = %IW64, MAX = 27648) → un <b>Real</b> de 0.0 a 1.0.</li>
  <li><code>SCALE_X</code> (MIN = 0.0, VALUE = ese Real, MAX = 5.0) → el nivel en metros.</li>
</ol>
<p>Para una salida analógica (<code>%QW80</code>, un variador) se hace al revés: NORM_X de la consigna y SCALE_X a 0…27648 en Int.</p>
<h3>Histéresis</h3>
<p>Si una bomba arranca a 20 % y para a 20 %, el ruido del sensor la hará arrancar y parar sin fin
(<i>chattering</i>). Se usan dos umbrales: arranca por debajo del 20 % y para por encima del 80 %. Entre medio,
<b>conserva el estado</b>: un trabajo perfecto para Set/Reset con comparadores.</p>
<div class="tip">En el simulador mueve la barra de <code>%IW64</code>: el ejemplo compara directamente en bruto
(13 824 = 50 %). Un programa real escalaría primero a unidades de ingeniería.</div>`,

<p>En una mina el grupo electrógeno no es un equipo “de emergencia” que se mira una vez al año: respalda

<h3>Señales típicas entre grupo y PLC</h3>
<table class="t">
<tr><th>Señal</th><th>Tipo</th><th>Comentario</th></tr>
<tr><td>Orden de arranque / parada</td><td>DQ</td><td>Al controlador del grupo, o directo al solenoide de combustible y al arrancador</td></tr>
<tr><td>Presión de aceite</td><td>DI / AI</td><td>Presostato o transductor 4‑20 mA</td></tr>
<tr><td>Temperatura de refrigerante</td><td>DI / AI</td><td>Termostato de alta o PT100</td></tr>
<tr><td>Sobrevelocidad</td><td>DI</td><td>Típicamente 110‑115 % de la nominal</td></tr>
<tr><td>Tensión y frecuencia</td><td>AI / red</td><td>Del analizador o del controlador por Modbus / PROFINET</td></tr>
<tr><td>Estado del interruptor 52G</td><td>DI</td><td>Contacto auxiliar: <b>siempre</b> leer la realimentación, no suponerla</td></tr>
</table>
<h3>Protecciones y la inhibición en el arranque</h3>
<p>Un motor diésel parado <b>no tiene presión de aceite</b>. Si la protección de baja presión estuviera activa desde
el primer instante, el grupo se dispararía en cada arranque. Por eso se <b>inhibe</b> durante unos segundos
(habitualmente 8‑15 s) tras la orden de marcha. Temperatura alta y sobrevelocidad, en cambio, actúan siempre.</p>
<p>Normas como <b>NFPA 110</b> e <b>ISO 8528‑4</b> piden además la parada por <b>falla de arranque</b>

<b>parada de emergencia</b> cableada que corta el combustible sin pasar por el programa. El reto de esta lección se centra
en las tres protecciones de marcha; la falla de arranque es un buen ejercicio extra con un CTU y dos TON.</p>
<p>Las paradas por protección quedan <b>memorizadas</b> (Set/Reset) y solo se rearman con un reset y con la causa
desaparecida: así el operador sabe qué pasó y el grupo no rearranca solo con la falla presente.</p>
<div class="tip"><b>En altura:</b> a más de 3 000 m, como en las operaciones del sur del Perú (Quellaveco, en Moquegua),

<b>derrateada</b>, no la de catálogo.</div>

{ id: "tta", nivel: "energia", titulo: "TTA: transferencia automática red‑grupo", min: 35,
  teoria: `
<p>El <b>tablero de transferencia automática (TTA, en inglés ATS)</b> decide quién alimenta la barra de cargas
críticas: la <b>red</b> o el <b>grupo</b>. Es uno de los programas más pedidos en minería y en cualquier planta.</p>
<h3>Secuencia de una transferencia abierta (“abre antes de cerrar”)</h3>
<ol>
  <li><b>Supervisión de red:</b> un relé de tensión/frecuencia (funciones ANSI 27/59/81) da “Red OK”.</li>
  <li><b>Confirmación de falla:</b> si la red falta, se espera unos segundos (típico 1‑5 s) para no arrancar el grupo por un <b>microcorte</b>.</li>
  <li><b>Arranque del grupo</b> y espera de “Grupo OK” (tensión y frecuencia estables).</li>
  <li><b>Abrir 52R</b> (interruptor de red) y, con su realimentación abierta, <b>cerrar 52G</b>. La carga pasa al grupo.</li>
  <li><b>Retorno de red:</b> la red debe estar estable un tiempo (en planta 5‑30 min; aquí segundos) antes de retransferir: abrir 52G, confirmar, cerrar 52R.</li>
  <li><b>Enfriamiento:</b> el grupo sigue en vacío unos minutos antes de parar, para no dañar el turbo.</li>
</ol>
<div class="tip"><b>Enclavamiento triple:</b> 52R y 52G jamás cerrados a la vez sin sincronizar. Se enclavan
<b>mecánicamente</b>, <b>eléctricamente</b> (contactos auxiliares en las bobinas de cierre) y <b>en el PLC</b>,
usando la <b>realimentación</b> del otro interruptor, no solo su orden.</div>
<p><b>Supervisión de discrepancia:</b> si un interruptor no confirma la maniobra en su tiempo (por ejemplo 0,5 s),
el programa debe alarmar y bloquear la secuencia, no esperar para siempre. Y con <b>cargas de motores</b> la transición
abierta debe dejar decaer la tensión residual antes de reconectar (<i>transición con retardo</i> o monitor en fase), para
no cerrar contra un motor que aún gira desfasado. Los equipos de transferencia se fabrican según
<b>IEC 60947‑6‑1</b> (y UL 1008 en Norteamérica).</p>
<p>Variantes: <b>transición cerrada</b> (sincroniza y hace un paralelo breve, menos de 100 ms, sin corte), y
retransferencia manual. En sistemas de emergencia, normas como NFPA 110 exigen que el grupo tome carga en un
tiempo máximo (10 s para la clase más exigente), lo que limita los retardos que puedes programar.</p>
<p>En el ejemplo ya está la detección de falla con confirmación: apaga la red unos instantes y luego más de 3 s. Si devuelves la red al instante, el HMI muestra la <b>tensión residual</b> de la barra decayendo.</p>`,

{ id: "sincronismo", nivel: "energia", titulo: "Sincronismo de grupos en paralelo", min: 40,
  teoria: `
<p>Para conectar un grupo <b>G2</b> a una barra que ya alimenta otro grupo (o la red), en el instante del cierre
las dos tensiones deben ser prácticamente iguales. Hay que igualar <b>cuatro</b> cosas:</p>
<table class="t">
<tr><th>Condición</th><th>Ventana típica</th><th>Quién la ajusta</th></tr>
<tr><td>Secuencia de fases</td><td>Idéntica (se verifica en la puesta en marcha)</td><td>Cableado</td></tr>
<tr><td>Tensión (ΔV)</td><td>3 % a 10 % según potencia</td><td>Regulador de tensión (AVR)</td></tr>
<tr><td>Frecuencia (deslizamiento Δf)</td><td>0,1 a 0,3 Hz según potencia</td><td>Regulador de velocidad (gobernador)</td></tr>
<tr><td>Ángulo de fase (Δφ)</td><td>±10° a ±20° según potencia</td><td>Se espera a que el deslizamiento lo lleve a 0</td></tr>
</table>
<p>Las ventanas dependen del tamaño. <b>IEEE 1547‑2018</b> (tabla de límites de sincronización) admite
Δf 0,3 Hz, ΔV 10 % y Δφ 20° hasta 500 kVA; 0,2 Hz, 5 % y 15° de 500 a 1 500 kVA; y <b>0,1 Hz, 3 % y 10°</b>
por encima de 1 500 kVA. Para máquinas síncronas grandes, IEEE C50.12/C50.13 piden aún menos deslizamiento
(≈ 0,067 Hz). Los grupos de una planta minera suelen superar 1 500 kVA: el reto usa la ventana más estricta.</p>
<h3>Cómo se ve en el sincronoscopio</h3>
<p>Con Δf ≠ 0 el ángulo entre G2 y la barra <b>gira</b>: una vuelta cada 1/Δf segundos. Si G2 va más rápido, la aguja
gira hacia “rápido”. Se busca que G2 vaya <b>ligeramente más rápido</b> (deslizamiento positivo): así, al cerrar,
toma un poco de carga en vez de quedar motorizado (lo que dispararía la protección de potencia inversa, ANSI 32).</p>
<h3>El cierre con anticipo</h3>
<p>Un interruptor tarda en cerrar (aquí 80 ms). Mientras tanto el ángulo sigue avanzando:
<code>anticipo = 360° × Δf × t_cierre</code>. Con 0,1 Hz y 80 ms son 2,9°. Los sincronizadores automáticos
(ANSI 25A) dan la orden con ese adelanto; el relé de verificación de sincronismo (ANSI 25) solo <b>permite</b> el cierre
dentro de la ventana.</p>
<div class="tip"><b>En la práctica</b> la sincronización fina y el reparto de carga (kW por el gobernador, kVAr por el AVR,
en isócrono o en <i>droop</i>) los hacen los controladores de grupo. El PLC de planta coordina: pide sincronizar,
supervisa ventanas y tiempos, y bloquea si algo no cuadra. Programarlo tú mismo es la mejor forma de entender qué hacen.</div>
<p>El ejemplo es una <b>sincronización manual</b>: sube o baja la velocidad con los pulsadores, mira el sincronoscopio y
cierra cuando la aguja esté en la zona verde. Si cierras fuera de fase, el modelo de planta te lo dirá.</p>`,
  ejemplo: { planta: "sincro", tags: [TAG("%I0.3", "Subir_Manual", "push"), TAG("%I0.4", "Bajar_Manual", "push"), TAG("%I0.5", "Cerrar_Manual", "push"), TAG("%I0.6", "Abrir_52G2", "push"), TAG("%I0.1", "Tension_OK", "switch", "", { def: 1 }), TAG("%I0.2", "52G2_Cerrado", "plant"), TW("%IW64", "Frec_Barra", { div: 100, unit: "Hz" }), TW("%IW66", "Frec_G2", { div: 100, unit: "Hz" }), TW("%IW68", "Dif_Fase", { unit: "°" }), TAG("%Q0.0", "Cerrar_52G2"), TAG("%Q0.1", "Subir_Vel"), TAG("%Q0.2", "Bajar_Vel"), TAG("%MW10", "Dif_Frec")],

{ id: "demanda", nivel: "energia", titulo: "Grupos en paralelo: arranque por demanda y deslastre", min: 30,
  teoria: `
<p>Con varios grupos en paralelo no conviene tenerlos todos en marcha: un diésel con poca carga quema mal el
combustible y acumula hollín (<i>wet stacking</i>). La planta arranca el segundo grupo <b>solo cuando la demanda lo pide</b>
y lo para cuando sobra, con <b>histéresis</b> y <b>temporizaciones</b> para no arrancar y parar a cada pico:</p>
<ul>
  <li><b>Arranque de G2:</b> carga &gt; 80 % de lo que hay en línea, sostenida unos segundos.</li>
  <li><b>Parada de G2:</b> carga &lt; ~35 % del total en línea, sostenida más tiempo.</li>
  <li>Entre los dos umbrales, <b>se mantiene</b> lo que hay (Set/Reset).</li>
</ul>
<h3>Deslastre de cargas</h3>
<p>Si la demanda supera lo que los grupos en línea pueden entregar (por ejemplo, arranca un molino o una bomba grande mientras
el segundo grupo aún sincroniza), la frecuencia cae y todo puede salir de servicio. Se <b>deslastran</b> cargas no esenciales
(iluminación de patios, campamento, talleres) de inmediato y se reponen cuando hay capacidad.</p>
<div class="tip">El reparto de carga entre grupos en paralelo lo hacen los controladores (isócrono con líneas de reparto, o
<i>droop</i>). Aquí el PLC decide <b>cuántos</b> grupos hacen falta. La potencia medida suele llegar por Modbus TCP o PROFINET
desde el analizador o el controlador del grupo.</div>`,

{ id: "faja", nivel: "energia", titulo: "Planta minera: fajas en cascada con pull‑cord", min: 35,
  teoria: `
<p>En una planta concentradora el mineral viaja por <b>fajas transportadoras</b>: del chancado primario a la pila de gruesos
y de ahí a la molienda. Las fajas se enclavan entre sí para no <b>atollar los chutes</b> (descargar sobre una faja parada).</p>
<h3>Reglas de oro</h3>
<ul>
  <li><b>Arranque contra el flujo:</b> primero la faja de aguas abajo (la que descarga a la pila), luego la anterior, y al final el alimentador.</li>
  <li><b>Parada a favor del flujo:</b> primero el alimentador; las fajas siguen un tiempo para <b>vaciarse</b>.</li>
  <li><b>Sirena de prearranque:</b> aviso audible y visible antes de mover cualquier faja cuyo recorrido completo no se vea desde el mando (lo exige, por ejemplo, MSHA 30 CFR 56.14201, y los reglamentos mineros nacionales piden lo equivalente). En planta dura lo suficiente para que el personal se retire, del orden de 10 a 30 s; el reto usa 5 s para que la práctica sea ágil.</li>
  <li><b>Pull‑cord (interruptor de tirón):</b> cable a lo largo de la faja; quien tira de él la detiene. Va cableado <b>NC</b>, y al dispararse para esa faja y todo lo que la alimenta. El interruptor <b>queda enclavado</b> y se rearma a mano en el propio interruptor (EN 620, ISO 13850): en el simulador, un toque lo dispara y otro lo rearma. Rearmarlo no vuelve a arrancar nada: hace falta una orden de marcha nueva.</li>
  <li>Otros enclavamientos reales: desalineamiento, velocidad cero (rotura o patinaje), chute atollado y rasgado de banda.</li>
</ul>
<div class="tip">El corrector comprueba en <b>cada ciclo</b> que nunca haya una faja en marcha descargando sobre otra parada, ni el
alimentador sin su faja. En planta eso es un chute atollado y horas de limpieza.</div>
<p>Los pull‑cord y las paradas de emergencia de fajas forman parte de la seguridad de las personas: en minería se
cablean a circuitos de seguridad (relé o PLC de seguridad). El programa estándar los lee para el
enclavamiento y el diagnóstico.</p>`,

PLANTAS.arranque = {
  /* el motor arranca tras 1,5 s de arrancador con combustible, salvo que se simule la falla */
  model: function (e) { var s = e.ps, fuel = !!e.v["%Q0.0"], crank = !!e.v["%Q0.1"];
    if (!fuel) { s.run = 0; s.n = 0; }
    if (crank && !s.prev) s.n = (s.n || 0) + 1; s.prev = crank;
    s.ct = crank ? (s.ct || 0) + e.dt : 0;
    if (fuel && crank && s.ct >= 1500 && !e.pressed["%I0.1"]) s.run = 1;
    e.forced["%I0.1"] = s.run ? 1 : 0;
    s.eng = crank && s.run ? (s.eng || 0) + e.dt : 0;
    if (s.eng > 300) e.fault = "Arrancador engranado con el motor en marcha: se destruye el piñón";
    if (s.ct > 6000) e.fault = "Arrancador más de 6 s seguidos: se recalienta (usa ciclos de arranque y reposo)";
  },
  hmi: function (e) { var s = e.ps, ct = s.ct || 0;
    return HM.svg(150, HM.gen(50, 60, !!s.run, "") + HM.tx(50, 100, s.run ? "Motor en marcha" : e.v["%Q0.1"] ? "Girando con arrancador" : "Parado", { w: 700, c: s.run ? "var(--on)" : "var(--ink2)" }) +
      HM.lamp(130, 30, e.v["%Q0.0"], "Solenoide de combustible", "var(--on)") + HM.lamp(130, 52, e.v["%Q0.1"], "Arrancador (motor de arranque)", "var(--acc)") +
      HM.lamp(130, 74, e.v["%Q0.2"], "ALARMA · falla de arranque", "var(--bad)") +
      HM.tx(130, 104, "Intento n.º " + (s.n || 0) + " · arrancador " + (ct / 1000).toFixed(1) + " s", { a: "start", s: 11, w: 700, m: 1 }) +
      '<rect x="130" y="112" width="240" height="10" rx="3" style="fill:var(--box);stroke:var(--line)"/><rect x="130" y="112" width="' + Math.min(240, ct / 6000 * 240) + '" height="10" rx="3" style="fill:' + (ct > 5000 ? "var(--bad)" : "var(--acc)") + '"/>' +
      HM.tx(370, 136, "límite térmico 6 s", { a: "end", s: 9, c: "var(--ink3)" }) + HM.falla(e, 146));
  }
};
PLANTAS.disc = {
  /* interruptor de 80 ms; con la falla simulada no cierra, o se dispara si estaba cerrado */
  model: function (e) { var s = e.ps; if (e.pressed["%I0.1"]) { e.forced["%I0.1"] = 0; s.t = 0; return; } maniobra(e, s, "t", "%Q0.0", "%I0.1", 80); },
  hmi: function (e) { var o = !!e.v["%Q0.0"], f = !!e.forced["%I0.1"], d = o !== f;
    return HM.svg(120, HM.ln(60, 10, 60, 45, true) + HM.brk(60, 58, f, "52") + HM.ln(60, 68, 60, 105, f) +
      HM.tx(150, 30, "Orden del PLC", { a: "start", s: 10, c: "var(--ink2)" }) + HM.tx(380, 30, o ? "CERRAR" : "ABRIR", { a: "end", w: 800, m: 1 }) +
      HM.tx(150, 52, "Estado real (contacto auxiliar)", { a: "start", s: 10, c: "var(--ink2)" }) + HM.tx(380, 52, f ? "CERRADO" : "ABIERTO", { a: "end", w: 800, m: 1, c: f ? "var(--bad)" : "var(--on)" }) +
      HM.lamp(150, 76, d, d ? "Discrepancia orden ≠ estado" : "Orden y estado coinciden", "#FFC83D") + HM.lamp(150, 98, e.v["%Q0.1"], "ALARMA de discrepancia (bloqueo)", "var(--bad)") + HM.falla(e, 116));
  }
};
PLANTAS.reparto = {
  /* G2 en paralelo con G1: el gobernador de G2 se sube o baja; G1 toma el resto de la carga */
  model: function (e) { var s = e.ps, tot = e.ana["%IW70"] | 0; if (s.p2 == null) s.p2 = 100;
    if (e.v["%Q0.1"]) s.p2 += 100 * e.dt / 1000; if (e.v["%Q0.2"]) s.p2 -= 100 * e.dt / 1000;
    s.p2 = Math.max(-200, Math.min(tot, s.p2));
    s.rp = s.p2 < 0 ? (s.rp || 0) + e.dt : 0;
    if (s.rp > 500) e.fault = "Potencia inversa en G2 (" + Math.round(s.p2) + " kW): G2 quedó motorizado, dispara la protección 32";
    e.ana["%IW64"] = Math.round(tot - s.p2); e.ana["%IW66"] = Math.round(s.p2);
  },
  hmi: function (e) { var p1 = e.ana["%IW64"] | 0, p2 = e.ana["%IW66"] | 0, X = function (v) { return Math.max(0, Math.min(220, v / 1000 * 200)); };
    var bar = function (y, n, p) { return HM.gen(34, y + 6, true, "") + HM.tx(64, y, n, { a: "start", w: 700 }) + '<rect x="64" y="' + (y + 6) + '" width="200" height="14" rx="3" style="fill:var(--box);stroke:var(--line)"/><rect x="64" y="' + (y + 6) + '" width="' + X(p) + '" height="14" rx="3" style="fill:' + (p < 0 || p > 1000 ? "var(--bad)" : "var(--acc)") + '"/>' + HM.tx(390, y + 17, p + " kW · " + Math.round(p / 10) + " %", { a: "end", w: 800, m: 1, s: 10.5, c: p < 0 || p > 1000 ? "var(--bad)" : "var(--ink)" }); };
    return HM.svg(150, bar(22, "G1 · 1000 kW", p1) + bar(66, "G2 · 1000 kW", p2) +
      HM.tx(64, 112, "Diferencia G1 − G2: " + (p1 - p2) + " kW", { a: "start", w: 700 }) +
      HM.lamp(250, 108, e.v["%Q0.1"], "Subir G2 ▲", "var(--acc)") + HM.lamp(330, 108, e.v["%Q0.2"], "Bajar ▼", "var(--acc)") + HM.falla(e, 144));
  }
};
