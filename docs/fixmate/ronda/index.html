<style>
/* ronda:piel:inicio */
/* Generado por herramientas/piel.py desde docs/fixmate/app/index.html.
 * No editar aqui: se reescribe. */
    :root {
    --paper:#F3F4F2; --card:#FFFFFF; --card-2:#EAEDEB;
    --ink:#16191B; --ink-2:#4E5860; --ink-3:#5F6A72;
    --rule:#D6DCDA; --rule-2:#E6EAE8;
    --accent:#1E4B6B; --accent-soft:#E3ECF3;
    --ok:#1F6B4C; --ok-soft:#E1F0E9;
    --obs:#8A5A00; --obs-soft:#F8EFDB; --obs-rule:#E0C894;
    --mal:#96341F; --mal-soft:#F7E6E0; --mal-rule:#E0B2A2;
    --barra:#16191B; --barra-ink:#E7ECEB;
    --lift:0 1px 2px rgba(22,25,27,.05), 0 10px 26px -16px rgba(22,25,27,.28);
    /* Barlow va alojada; detrás, siempre, la del sistema: si el archivo aún
       no llegó o no está —el demo descargado como archivo suelto no lo
       lleva—, el texto se lee igual desde el primer instante. */
    --cond:"Barlow Condensed",ui-sans-serif,system-ui,-apple-system,
           "Roboto Condensed","Arial Narrow",sans-serif;
    --sans:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* La monoespaciada no se aloja: la del aparato es buena y cuesta 0 bytes. */
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14181A; --card:#1C2225; --card-2:#242B2F;
      --ink:#E7ECEB; --ink-2:#A3AFB4; --ink-3:#96A7B0;
      --rule:#2F383D; --rule-2:#262E32;
      --accent:#6FA8CE; --accent-soft:#16303F;
      --ok:#6FC49B; --ok-soft:#143024;
      --obs:#D9A24E; --obs-soft:#2C2417; --obs-rule:#4C3F23;
      --mal:#E08A6E; --mal-soft:#2E1D17; --mal-rule:#5A3327;
      --barra:#0E1113; --barra-ink:#E7ECEB;
      --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14181A; --card:#1C2225; --card-2:#242B2F;
    --ink:#E7ECEB; --ink-2:#A3AFB4; --ink-3:#96A7B0;
    --rule:#2F383D; --rule-2:#262E32;
    --accent:#6FA8CE; --accent-soft:#16303F;
    --ok:#6FC49B; --ok-soft:#143024;
    --obs:#D9A24E; --obs-soft:#2C2417; --obs-rule:#4C3F23;
    --mal:#E08A6E; --mal-soft:#2E1D17; --mal-rule:#5A3327;
    --barra:#0E1113; --barra-ink:#E7ECEB;
    --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.8);
  }
  

/* La capa comun de las pantallas de FixMate: barra, botones, tarjetas,
 * etiquetas y avisos. Encima van las reglas propias de cada pantalla.
 *
 * Esto NO define colores: los toma de la piel, que sale de la app de
 * diagnostico. Un color escrito aqui a mano seria una tercera paleta, que es
 * justo lo que esta capa existe para que no pase.
 *
 * Por que una capa comun y no que cada pantalla se pinte sola: el tecnico que
 * diagnostica, el operador que hace la ronda y el ingeniero que decide la
 * estrategia son tres personas que hablan entre ellas de la misma maquina. Si
 * cada pantalla parece de otro programa, la primera pregunta de cada reunion
 * es cual de los tres tiene el dato bueno.
 */

*, *::before, *::after { box-sizing:border-box; }
/* Que los controles del sistema —barras de desplazamiento, campos, el
   teclado del telefono— sigan el mismo tema que la pagina. */
html { -webkit-text-size-adjust:100%; color-scheme:light dark; }
body { margin:0; background:var(--paper); color:var(--ink);
       font-family:var(--sans); font-size:16px; line-height:1.5;
       padding:0 16px env(safe-area-inset-bottom); }

/* ---------------------------------------------------------- la barra
 * La misma de la app de diagnostico: el nombre del producto, y al lado, en
 * chico, en que pantalla esta parado. Es lo unico que se ve igual en las tres
 * antes de leer una sola palabra.
 */
.barra { background:var(--barra); color:var(--barra-ink); margin:0 -16px;
         padding:.7rem 16px calc(.7rem + env(safe-area-inset-top));
         display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
.barra b { font-family:var(--cond); font-size:1.15rem; letter-spacing:.04em;
           text-transform:uppercase; }
.barra span { font-family:var(--mono); font-size:.66rem; opacity:.7;
              letter-spacing:.06em; text-transform:uppercase; }
.barra .vinculos { margin-left:auto; display:flex; gap:.9rem; }
.barra .vinculos a { color:var(--barra-ink); opacity:.65; text-decoration:none;
                     font-family:var(--mono); font-size:.66rem;
                     letter-spacing:.06em; text-transform:uppercase; }
.barra .vinculos a:hover, .barra .vinculos a:focus-visible { opacity:1;
                     text-decoration:underline; }
/* Sólo aparece cuando el aparato ofrece instalar; lo pone `arranque.js`. */
.barra .instalar { margin-left:.9rem; background:transparent;
                   border-color:var(--barra-ink); color:var(--barra-ink);
                   font-family:var(--mono); font-size:.66rem;
                   letter-spacing:.06em; text-transform:uppercase;
                   padding:.25rem .6rem; border-radius:4px; }
.barra .instalar:hover { background:var(--barra-ink); color:var(--barra); }

/* ------------------------------------------------------- tipografia */
h1 { font-family:var(--cond); font-size:1.6rem; letter-spacing:.01em;
     margin:0 0 .25rem; text-wrap:balance; }
h2 { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em;
     text-transform:uppercase; color:var(--ink-3); font-weight:700;
     margin:1.6rem 0 .6rem; }
h3 { font-size:1.05rem; margin:0 0 .3rem; text-wrap:balance; }
p { margin:0 0 .6rem; }
a { color:var(--accent); }
code { font-family:var(--mono); font-size:.86em; background:var(--card-2);
       padding:.05rem .3rem; border-radius:3px; }
.tenue { color:var(--ink-2); font-size:.86rem; }
.vacio { color:var(--ink-3); font-style:italic; }
/* La etiqueta de un dato, en monoespaciada chica: la misma de la app. */
.lb { font-family:var(--mono); font-size:.7rem; letter-spacing:.05em;
      text-transform:uppercase; color:var(--ink-3); }

/* ---------------------------------------------------------- botones */
button { font:inherit; font-size:.9rem; cursor:pointer; color:var(--ink);
         border:1px solid var(--rule); background:var(--card);
         border-radius:6px; padding:.55rem .9rem; text-align:left;
         touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button:hover { border-color:var(--ink-3); }
button.primary { background:var(--accent); color:var(--paper);
                 border-color:var(--accent); font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

/* ----------------------------------------------- tarjetas y avisos */
.tarjeta { background:var(--card); border:1px solid var(--rule);
           border-radius:6px; padding:.9rem 1rem; margin-bottom:.8rem; }
/* El aviso de la app: barra al costado y fondo suave, no un bloque de color.
   Se lee con guantes y a contraluz. */
.aviso { border-left:3px solid var(--obs); background:var(--obs-soft);
         color:var(--ink); padding:.6rem .8rem; border-radius:0 4px 4px 0;
         font-size:.88rem; margin:.6rem 0 0; }
.aviso.peligro { border-left-color:var(--mal); background:var(--mal-soft); }
.aviso.nota { border-left-color:var(--rule); background:var(--card-2);
              color:var(--ink-2); }

/* ------------------------------------------------------------ chips
 * Rotulo corto con borde, no relleno: a tres por linea, el relleno convierte
 * la ficha en una bolsa de colores y deja de distinguirse lo grave.
 */
.chip { display:inline-block; font-family:var(--mono); font-size:.6rem;
        letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
        border:1px solid var(--rule); border-radius:3px; padding:.08rem .35rem;
        margin:0 .25rem .25rem 0; white-space:nowrap; }
.chip.grave { color:var(--mal); border-color:var(--mal); }
.chip.ok { color:var(--ok); border-color:var(--ok); }
.chip.obs { color:var(--obs); border-color:var(--obs); }
.chip.acento { color:var(--accent); border-color:var(--accent); }

ul.lista { margin:.35rem 0 0; padding-left:1.1rem; }
ul.lista li { margin-bottom:.2rem; font-size:.88rem; }
.oculto { display:none; }
/* ronda:piel:fin */

/* --------------------------------------------- lo propio de esta pantalla
 * Un telefono, con guantes, al arranque del turno. Todo lo de aqui sale de
 * eso: botones que se tocan sin mirar, un punto a la vez, y nada que
 * obligue a desplazar la pantalla para contestar.
 */
.lam { max-width:560px; margin:0 auto; padding:14px 0 20px;
       min-height:calc(100dvh - 3rem); display:flex; flex-direction:column; }
.lam button { width:100%; margin-bottom:.6rem; }
/* La segunda linea de un boton explica el primero: va debajo, no al lado. */
.lam button .tenue { display:block; font-weight:400; margin-top:.15rem; }
.crece { flex:1; }
/* La lamina es una columna flexible: sin esto, un chip suelto se estira de
   borde a borde y deja de leerse como etiqueta. */
.lam > .chip { align-self:flex-start; }

/* Durante un punto la barra se va. No es un descuido de identidad: la regla
   de esta pantalla es un punto a la vez a pantalla completa, y en un
   telefono de 844 px los tres botones de respuesta tienen que entrar sin
   desplazar. La barra vuelve en todas las demas pantallas. */
body.en-punto .barra { display:none; }
body.en-punto .lam { min-height:100dvh; }

/* Los tres botones de respuesta. «No pude ver» mide exactamente lo mismo que
   «OK» y esta en la misma columna: si fuera mas chico o estuviera mas abajo,
   el operador marcaria OK, y un OK falso contamina la ronda entera. */
.grande { min-height:56px; font-size:1.15rem; font-weight:800;
          text-align:center; padding:.7rem .9rem; }
.b-ok { background:var(--ok); border-color:var(--ok); color:var(--paper); }
.b-mal { background:var(--obs); border-color:var(--obs); color:var(--paper); }
.b-sin { background:var(--ink-3); border-color:var(--ink-3); color:var(--paper); }
.grande .tenue { color:inherit; opacity:.85; font-size:.8rem; }

/* El punto y su criterio de aceptacion, que es lo unico que se lee de lejos. */
.punto { font-family:var(--cond); font-size:2rem; line-height:1.1;
         margin:.4rem 0 .6rem; }
.criterio { font-size:1.15rem; background:var(--card); border:1px solid var(--rule);
            border-left:4px solid var(--accent); border-radius:0 6px 6px 0;
            padding:.8rem .9rem; margin-bottom:.6rem; }
.pie { display:flex; justify-content:space-between; align-items:center;
       font-family:var(--mono); font-size:.72rem; color:var(--ink-3); }
.progreso { height:5px; background:var(--rule); border-radius:3px;
            overflow:hidden; margin:.5rem 0 1rem; }
.progreso > i { display:block; height:100%; background:var(--accent);
                transition:width .2s; }

/* El dialogo de la nota. */
.velo { position:fixed; inset:0; background:color-mix(in srgb, var(--paper) 92%, transparent);
        display:flex; align-items:flex-end; padding:14px; z-index:9; }
.velo > div { max-width:560px; margin:0 auto; width:100%; background:var(--card);
              border:1px solid var(--rule); border-radius:10px; padding:1rem;
              box-shadow:var(--lift); }
.fila { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
.fila button { margin:0; }
textarea, input[type=text] { width:100%; font:inherit; color:var(--ink);
            background:var(--paper); border:1px solid var(--rule);
            border-radius:6px; padding:.6rem; min-height:52px; }

/* El resultado de la ronda. */
.res-ok { border-left:4px solid var(--ok); background:var(--ok-soft); }
.res-mal { border-left:4px solid var(--obs); background:var(--obs-soft); }
.titular { font-family:var(--cond); font-size:1.4rem; }
</style>

<div class="barra">
  <b>FixMate</b><span>Ronda CIL</span>
  <nav class="vinculos">
    <a href="../">Inicio</a>
    <a href="../app/">Diagnóstico</a>
    <a href="../rcm/">Análisis RCM</a>
  </nav>
</div>
<script>
/* ronda:arranque:inicio */
/* Lo que hace cada pantalla al abrirse, antes de pintar nada. Todo depende de
 * CÓMO llegó la pantalla al aparato, que son tres formas distintas:
 *
 *   - servida por el sitio, en un navegador;
 *   - como archivo suelto, bajado por WhatsApp (`file:`);
 *   - dentro del APK, servida por el cargador de assets de Android, que
 *     también habla https pero no tiene ni red ni carpetas hermanas.
 *
 * La tercera engaña: el protocolo dice `https` y parece el sitio. Se reconoce
 * por el puente nativo, que sólo existe ahí dentro.
 */
var EN_APK = typeof window.PuenteFixMate !== "undefined" && !!window.PuenteFixMate;

/* 1. Los enlaces entre herramientas sólo sirven si se abrió desde el sitio.
 *    Descargada como archivo suelto —que es como viaja por WhatsApp—
 *    apuntarían a carpetas que no existen en ese teléfono, y un enlace roto
 *    en la barra hace dudar del resto de la pantalla. Se quitan. */
/*    Dentro del APK pasa lo mismo por otro motivo: lo único que viaja es
 *    esta pantalla, así que las carpetas hermanas tampoco están. */
if (location.protocol === "file:" || EN_APK) {
  var vinculos = document.querySelector(".barra .vinculos");
  if (vinculos) vinculos.remove();
}

/* 2. Servida por http(s), se guarda en el teléfono para que abra sin señal.
 *    Es la condición de trabajo real: interior mina, sin cobertura, y el
 *    turno no espera a que haya línea. Si el navegador no lo permite —modo
 *    privado, versión vieja—, la pantalla sigue funcionando igual: el
 *    trabajador de servicio es una mejora, no un requisito. */
/*    Dentro del APK no se registra: los archivos ya son locales, no hay nada
 *    que guardar, y como sus peticiones no pasan por el cargador de assets
 *    intentaría salir a una red que la app no tiene permiso de usar. */
if (!EN_APK && "serviceWorker" in navigator &&
    location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(function () {
    /* Sin registro no hay copia local, y ya está: no se le dice nada al
       operador, porque no hay nada que pueda hacer al respecto. */
  });
}

/* 3. El botón de instalar, cuando el aparato lo ofrece.
 *
 *    Android avisa por su cuenta con un cartel discreto que casi nadie ve, y
 *    la otra vía es el menú de tres puntos del navegador: el operador no va
 *    a dar con eso, y sin instalar no hay copia local ni pantalla completa.
 *    Así que cuando Chrome dice que se puede, aparece el botón en la barra.
 *
 *    No se dibuja si el aparato no lo ofrece —ya instalada, en un navegador
 *    que no lo soporta, o en un escritorio—: un botón que no hace nada es
 *    peor que ninguno. */
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  var barra = document.querySelector(".barra");
  if (!barra || document.getElementById("instalar")) return;
  var boton = document.createElement("button");
  boton.id = "instalar";
  boton.className = "instalar";
  boton.textContent = "Instalar";
  boton.onclick = function () {
    boton.disabled = true;
    if (e.prompt) e.prompt();
  };
  barra.appendChild(boton);
});

window.addEventListener("appinstalled", function () {
  var boton = document.getElementById("instalar");
  if (boton) boton.remove();
});
/* ronda:arranque:fin */
</script>
<div class="lam" id="app"></div>
<script>
/* ronda:reglas:inicio — ESPEJO de nefer/fixmate/tpm.py y anomalia.py.
 *
 * Las constantes de abajo las escribe `herramientas/espejo-ronda.py`; el
 * algoritmo esta escrito a mano en los dos lenguajes, igual que el motor de
 * busqueda. Que hagan lo mismo lo responde `tests/test_fixmate_cruce_ronda.py`,
 * que corre ESTE javascript y compara sus respuestas con las de Python.
 *
 * Dos copias que se separan no dan error en ninguna parte: el telefono dice
 * que la ronda esta completa y la oficina dice que no, los dos se ven
 * razonables, y nadie se entera. Por eso se genera y se cruza.
 *
 * LA UNICA DIFERENCIA DELIBERADA, Y ESTA PROBADA. El telefono NO codifica la
 * anomalia contra el catalogo ISO 14224; la oficina si, al recibir el
 * archivo. El catalogo son 41 entradas con sus pistas y su ponderacion, y
 * meterlo aqui seria una tercera copia que mantener — la app de diagnostico
 * ya lleva la suya. El telefono hereda el codigo SOLO cuando la pauta lo
 * declara, que es un dato que ya viene escrito.
 *
 * El cruce compara todo lo demas campo por campo, y una prueba aparte fija
 * esta diferencia: si el telefono empezara a codificar, o la oficina dejara
 * de hacerlo, se pone roja.
 */
/* ronda:datos:inicio */
var CLASES = {
  "ajustar": "Apriete o regulacion dentro del alcance del operador",
  "inspeccionar": "Mirar, oir o tocar en un punto fijo",
  "limpiar": "La mugre esconde la fuga y la grieta: limpiar es inspeccionar",
  "lubricar": "Nivel o engrase en el punto marcado",
  "verificar": "Comprobar que una funcion responde"
};
var RESULTADOS = {
  "nok": "No cumple: hay anomalia",
  "ok": "Cumple el criterio",
  "sin_acceso": "No se pudo ver"
};
var SEVERIDADES = {
  "detiene": "Se detiene la maquina ahora",
  "oportunidad": "Cuando se abra una ocasion",
  "programable": "Se atiende en la proxima ventana"
};
var FRACCION_SOSPECHOSA = 0.4;
/* ronda:datos:fin */

/** Pone a cada punto el id que le pondria Python.
 *
 * No es cosmetica ni cosa de la pantalla: `Checklist.agregar()` numera
 * «{id de la pauta}.{n}», 1-based, y si el telefono numerara distinto la
 * oficina no podria casar cada anomalia con su punto al recibir el archivo.
 * Por eso vive aqui dentro, con el resto de lo que se cruza, y no en la
 * interfaz.
 */
function normalizarPauta(pauta) {
  var base = pauta.id || "pauta";
  pauta.puntos.forEach(function (p, i) {
    if (!p.id) p.id = base + "." + (i + 1);
    if (p.alcance_operador === undefined) p.alcance_operador = true;
    if (p.segundos === undefined) p.segundos = 0;
  });
  return pauta;
}

/** Como quedo una ronda. Mismo contrato que `tpm.estado()`. */
function estadoRonda(ejecucion, pauta) {
  normalizarPauta(pauta);
  var porId = {};
  pauta.puntos.forEach(function (p) { porId[p.id] = p; });

  var cuenta = { ok: 0, nok: 0, sin_acceso: 0 };
  var segundos = 0;
  var respondidos = {};
  ejecucion.items.forEach(function (i) {
    if (cuenta[i.resultado] === undefined) cuenta[i.resultado] = 0;
    cuenta[i.resultado] += 1;
    segundos += Math.max(0, Math.round(i.segundos || 0));
    respondidos[i.punto_id] = true;
  });

  var presupuesto = 0;
  pauta.puntos.forEach(function (p) { presupuesto += Math.max(0, p.segundos || 0); });
  var todos = ejecucion.items.length === pauta.puntos.length;

  return {
    total: pauta.puntos.length,
    respondidos: ejecucion.items.length,
    ok: cuenta.ok, nok: cuenta.nok, sin_acceso: cuenta.sin_acceso,
    pendientes: pauta.puntos.filter(function (p) { return !respondidos[p.id]; })
                            .map(function (p) { return p.id; }),
    segundos: segundos,
    presupuesto_seg: presupuesto,
    // Un punto sin ver no es una ronda completa con una nota: es una ronda
    // incompleta. La alternativa real a «no pude ver» es un OK falso.
    completa: todos && cuenta.sin_acceso === 0,
    // Solo se juzga la velocidad de una ronda terminada, y solo si la pauta
    // declaro presupuesto.
    sospechosa_de_firma: todos && presupuesto > 0 &&
                         segundos < presupuesto * FRACCION_SOSPECHOSA
  };
}

/** La anomalia que sale de un punto NOK. `null` para cualquier otro caso.
 *  Mismo contrato que `anomalia.desde_item()`. */
function anomaliaDe(ejecucion, item, pauta) {
  if (item.resultado !== "nok") return null;
  var punto = null;
  pauta.puntos.forEach(function (p) { if (p.id === item.punto_id) punto = p; });
  if (punto === null) return null;

  var texto = (item.observacion || "").trim();
  return {
    id: ejecucion.id + "." + punto.id,
    activo_codigo: ejecucion.activo_codigo,
    descripcion: texto || punto.punto,
    // Fuera del alcance del operador significa que hace falta el tecnico: se
    // decidio en frio al escribir la pauta, no en campo.
    severidad: punto.alcance_operador ? "programable" : "detiene",
    ejecucion_id: ejecucion.id,
    punto_id: punto.id,
    componente: punto.punto,
    condicion_observada: punto.criterio,
    detectada_por: ejecucion.operador,
    fecha: ejecucion.fecha,
    // El telefono NO clasifica contra el catalogo ni enlaza con RCM: eso lo
    // hace la oficina al recibir el archivo, que es donde esta el analisis.
    // Lo unico que se hereda es lo que la pauta ya declara.
    codigo_catalogo: punto.codigo_catalogo || "",
    modo_falla_id: punto.modo_falla_id || "",
    evidencia: [],
    estado: "abierta",
    responsable: "", accion: "", fecha_cierre: "", codigo_ot: ""
  };
}

function anomaliasDe(ejecucion, pauta) {
  normalizarPauta(pauta);
  var salida = [];
  ejecucion.items.forEach(function (i) {
    var a = anomaliaDe(ejecucion, i, pauta);
    if (a) salida.push(a);
  });
  return salida;
}
/* ronda:reglas:fin */

if (typeof module !== "undefined" && module.exports) {
  module.exports = { estadoRonda: estadoRonda, anomaliaDe: anomaliaDe,
                     anomaliasDe: anomaliasDe, normalizarPauta: normalizarPauta,
                     CLASES: CLASES,
                     RESULTADOS: RESULTADOS, SEVERIDADES: SEVERIDADES,
                     FRACCION_SOSPECHOSA: FRACCION_SOSPECHOSA };
}
</script>
<script>
/* La pantalla. Tres decisiones que vienen del guante y del socavon:
 *
 * UN PUNTO A LA VEZ, A PANTALLA COMPLETA. Una lista de cinco filas con
 * casillas chicas se despacha con cinco toques sin levantar la vista, que es
 * lo contrario de una ronda. Un punto a la vez obliga a mirar la maquina.
 *
 * «NO PUDE VER» DEL MISMO TAMANO QUE «OK». Si es mas chico o esta mas
 * abajo, el operador marca OK, y un OK falso contamina la ronda entera.
 *
 * EL RELOJ NO AMENAZA. Mide y se guarda, pero no hay cuenta atras ni aviso
 * de «vas lento». Un reloj que castiga produce rondas rapidas, no rondas
 * buenas. Lo que se detecta es lo contrario, y se le dice al supervisor al
 * final, no al operador a mitad de la maquina.
 */
/* ronda:demo:inicio */
var PAUTA_DEMO = {
  "activo_codigo": "EX-220",
  "frecuencia": "por_turno",
  "id": "cil-ex220",
  "nombre": "Ronda de arranque de turno",
  "origen": "RCM 2026-03-15 + experiencia del taller",
  "puntos": [
    {
      "alcance_operador": true,
      "clase": "limpiar",
      "codigo_catalogo": "TER.SOBRECALENTAMIENTO.RADIADOR",
      "criterio": "Se ve la luz a traves del panal; sin costra de tierra que tape celdas",
      "modo_falla_id": "F1.1.1",
      "punto": "Panal del radiador, lado admision",
      "segundos": 8
    },
    {
      "alcance_operador": true,
      "clase": "inspeccionar",
      "criterio": "Entre las marcas MIN y MAX, liquido limpio y no lechoso",
      "punto": "Visor de nivel de refrigerante",
      "segundos": 5
    },
    {
      "alcance_operador": false,
      "clase": "verificar",
      "criterio": "El pedal hace tope firme a media carrera y la maquina retiene en rampa",
      "punto": "Pedal de freno, antes de salir del taller",
      "segundos": 6
    },
    {
      "alcance_operador": false,
      "clase": "inspeccionar",
      "criterio": "Sin rozadura ni abombamiento; las abrazaderas en su sitio",
      "modo_falla_id": "F2.1.1",
      "punto": "Mangueras del eje delantero",
      "segundos": 6
    },
    {
      "alcance_operador": true,
      "clase": "lubricar",
      "criterio": "Dos golpes de pistola hasta ver grasa fresca en el sello",
      "punto": "Grasera del pasador de pluma, lado izquierdo",
      "segundos": 6
    }
  ]
};
/* ronda:demo:fin */

var app = document.getElementById("app");
var pauta = null, ejecucion = null, indice = 0, entroEn = 0, arranque = 0, reloj = null;

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function mmss(s) {
  s = Math.max(0, Math.floor(s));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function hoy() { return new Date().toISOString().slice(0, 10); }

// ------------------------------------------------------------- pantallas

function verInicio(error) {
  document.body.classList.remove("en-punto");
  pauta = null; ejecucion = null;
  if (reloj) { clearInterval(reloj); reloj = null; }
  app.innerHTML =
    '<h1>Ronda CIL</h1>' +
    '<p class="tenue">Limpiar · Inspeccionar · Lubricar. Medio minuto al ' +
    'arranque del turno. Limpiar <em>es</em> inspeccionar: la fuga y el perno ' +
    'flojo se ven cuando se quita la mugre, no antes.</p>' +
    (error ? '<div class="aviso peligro">' + esc(error) + '</div>' : '') +
    '<h2>Cargar la pauta</h2>' +
    '<button id="archivo" class="grande primary">Abrir pauta del equipo</button>' +
    '<p class="tenue">Un archivo <code>.json</code> que le pasa mantenimiento. ' +
    'No hace falta red.</p>' +
    (PAUTA_DEMO ? '<button id="demo">Probar con una pauta de ejemplo' +
      '<span class="tenue">' +
      'Es un taller inventado: la excavadora EX-220 no existe. Sirve para ' +
      'ver como funciona, no para registrar nada.</span></button>' : '') +
    '<div class="crece"></div>' +
    '<p class="tenue">FixMate · la ronda no sale de este telefono hasta que ' +
    'usted la exporte.</p>';

  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json"; inp.className = "oculto";
  document.body.appendChild(inp);
  document.getElementById("archivo").onclick = function () { inp.click(); };
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var lector = new FileReader();
    lector.onload = function () {
      try { empezar(JSON.parse(lector.result)); }
      catch (e) { verInicio("Ese archivo no es una pauta legible: " + e.message); }
    };
    lector.readAsText(f);
  };
  if (PAUTA_DEMO) {
    document.getElementById("demo").onclick = function () {
      empezar(JSON.parse(JSON.stringify(PAUTA_DEMO)));
    };
  }
}

function empezar(p) {
  if (!p || !p.puntos || !p.puntos.length) {
    return verInicio("La pauta no trae puntos.");
  }
  normalizarPauta(p);   // los ids los pone la regla, no la pantalla
  for (var i = 0; i < p.puntos.length; i++) {
    var q = p.puntos[i];
    if (!q.criterio) {
      return verInicio("El punto «" + (q.punto || q.id) + "» no tiene criterio " +
                       "de aceptacion. Sin criterio, cada operador juzga otra " +
                       "cosa y la pauta no mide nada.");
    }
  }
  pauta = p;
  verOperador();
}

function verOperador() {
  app.innerHTML =
    '<h1>' + esc(pauta.activo_codigo || "") + '</h1>' +
    '<p class="tenue">' + esc(pauta.nombre || "") + ' · ' +
    pauta.puntos.length + ' puntos</p>' +
    '<div class="tarjeta"><label><span class="tenue">Quien ejecuta</span>' +
    '<input type="text" id="op" placeholder="Nombre o ficha" autocomplete="name">' +
    '</label><p class="tenue" style="margin-top:8px">Una ronda sin responsable ' +
    'no se puede discutir despues.</p></div>' +
    '<button id="ir" class="grande primary">Empezar la ronda</button>' +
    '<div class="crece"></div>' +
    '<button id="volver">Cambiar de pauta</button>';
  document.getElementById("volver").onclick = function () { verInicio(); };
  document.getElementById("ir").onclick = function () {
    var nombre = (document.getElementById("op").value || "").trim();
    if (!nombre) { document.getElementById("op").focus(); return; }
    ejecucion = {
      id: (pauta.id || "ronda") + "-" + hoy() + "-" +
          Math.random().toString(36).slice(2, 7),
      checklist_id: pauta.id || "", activo_codigo: pauta.activo_codigo || "",
      operador: nombre, fecha: hoy(), items: [], anomalias: []
    };
    indice = 0; arranque = Date.now(); entroEn = Date.now();
    reloj = setInterval(function () {
      var e = document.getElementById("reloj");
      if (e) e.textContent = mmss((Date.now() - arranque) / 1000);
    }, 1000);
    verPunto();
  };
}

function verPunto() {
  if (indice >= pauta.puntos.length) return verResumen();
  document.body.classList.add("en-punto");
  var p = pauta.puntos[indice];
  var clase = CLASES[p.clase] || p.clase;
  app.innerHTML =
    '<div class="pie"><span>' + esc(pauta.activo_codigo) + ' · <b id="paso">' +
    (indice + 1) + ' / ' + pauta.puntos.length + '</b></span>' +
    '<span id="reloj">' + mmss((Date.now() - arranque) / 1000) + '</span></div>' +
    '<div class="progreso"><i style="width:' +
    (indice / pauta.puntos.length * 100) + '%"></i></div>' +
    '<span class="chip">' + esc(String(p.clase).toUpperCase()) + '</span>' +
    '<div class="punto">' + esc(p.punto) + '</div>' +
    '<div class="criterio">' + esc(p.criterio) + '</div>' +
    '<p class="tenue">' + esc(clase) + (p.segundos ? ' · ' + p.segundos + ' s previstos' : '') +
    ' · ' + (p.alcance_operador === false
      ? 'si hay algo, va el tecnico' : 'si hay algo, lo resuelve usted') + '</p>' +
    '<div class="crece"></div>' +
    '<button class="grande b-ok" data-r="ok">OK<span class="tenue">Cumple el criterio</span></button>' +
    '<button class="grande b-mal" data-r="nok">ANOMALIA<span class="tenue">Algo no esta como debe</span></button>' +
    '<button class="grande b-sin" data-r="sin_acceso">NO PUDE VER<span class="tenue">Guarda, marcha, altura</span></button>';
  Array.prototype.forEach.call(app.querySelectorAll("button[data-r]"), function (b) {
    b.onclick = function () { responder(b.getAttribute("data-r")); };
  });
}

/** Los segundos se toman AL TOCAR el boton, antes de abrir el dialogo: lo
 *  que tarda en escribir la nota no es tiempo de inspeccion. */
function responder(resultado) {
  var seg = Math.max(0, Math.round((Date.now() - entroEn) / 1000));
  if (resultado === "ok") return anotar("ok", "", seg);
  verNota(resultado, seg);
}

function anotar(resultado, observacion, segundos) {
  var p = pauta.puntos[indice];
  ejecucion.items.push({ punto_id: p.id, resultado: resultado,
                         observacion: observacion, segundos: segundos });
  indice += 1; entroEn = Date.now();
  verPunto();
}

var MOTIVOS = ["Guarda cerrada", "Maquina en marcha", "Sin acceso fisico", "Falta andamio"];

function verNota(resultado, seg) {
  var p = pauta.puntos[indice];
  var esAnomalia = resultado === "nok";
  var velo = document.createElement("div");
  velo.className = "velo";
  velo.innerHTML = '<div>' +
    '<p class="tenue">' + (esAnomalia ? 'Anomalia en' : 'No se pudo ver') + '</p>' +
    '<h3>' + esc(p.punto) + '</h3>' +
    (esAnomalia
      ? '<label><span class="tenue">Que vio</span><textarea id="nota" rows="3" ' +
        'placeholder="En sus palabras. No se normaliza."></textarea></label>' +
        '<p class="tenue" style="margin-top:8px">' +
        (p.alcance_operador === false
          ? 'Este punto esta fuera de su alcance en la pauta: la anomalia sale ' +
            'marcada para que vaya el tecnico.'
          : 'Este punto es de su alcance: resuelvalo y avise. Queda registrado igual.') +
        '</p>'
      : '<p class="tenue">Registrarlo vale. Un punto que nunca se puede ver no ' +
        'es un descuido suyo: es un defecto de la maquina o de la pauta, y asi ' +
        'se detecta.</p><div class="fila" id="motivos"></div>' +
        '<input type="text" id="nota" placeholder="O escriba el motivo" ' +
        'style="margin-top:10px">') +
    '<div class="fila" style="margin-top:12px">' +
    '<button id="atras">Volver</button>' +
    '<button id="listo" class="' + (esAnomalia ? 'b-mal' : 'b-sin') + '">' +
    (esAnomalia ? 'Etiquetar' : 'Registrar') + '</button></div></div>';
  document.body.appendChild(velo);

  if (!esAnomalia) {
    var cont = velo.querySelector("#motivos");
    MOTIVOS.forEach(function (m) {
      var b = document.createElement("button");
      b.textContent = m; b.style.fontSize = "14px";
      b.onclick = function () { velo.querySelector("#nota").value = m; };
      cont.appendChild(b);
    });
  }
  velo.querySelector("#atras").onclick = function () { velo.remove(); };
  velo.querySelector("#listo").onclick = function () {
    var txt = (velo.querySelector("#nota").value || "").trim();
    velo.remove();
    anotar(resultado, txt, seg);
  };
}

/* ------------------------------------------------- sacar el archivo
 *
 * Dentro del APK hay un puente nativo, y hace falta: en un WebView una
 * descarga que la propia pagina inicia —un enlace con `download` y una URL
 * `blob:`— no llega a ninguna parte, y ni siquiera dispara el escuchador de
 * descargas de Android. El boton pareceria funcionar y la ronda del turno no
 * se guardaria en ningun sitio. Asi que ahi los bytes se entregan y los
 * escribe Java en Descargas; en un navegador, el camino de siempre.
 */
var puente = (typeof window.PuenteFixMate !== "undefined" && window.PuenteFixMate)
             || null;

/** El puente habla base64, que es lo unico que cruza limpio de JavaScript a
 *  Java. Se trocea: `apply` con medio millon de argumentos tumba la pila. */
function aBase64(texto) {
  var bytes = new TextEncoder().encode(texto);
  var binario = "";
  var trozo = 0x8000;
  for (var i = 0; i < bytes.length; i += trozo) {
    binario += String.fromCharCode.apply(null, bytes.subarray(i, i + trozo));
  }
  return btoa(binario);
}

function avisarGuardado(texto, mal) {
  var caja = document.getElementById("aviso-guardado");
  if (!caja) return;
  caja.className = mal ? "aviso peligro" : "aviso";
  caja.textContent = texto;
  caja.style.display = "";
}

function guardarRonda(nombre, contenido) {
  if (puente) {
    var fallo = puente.guardar(nombre, aBase64(contenido), "application/json");
    // Cadena vacia es que salio bien. Cualquier otra cosa es el motivo, y se
    // dice: un operador mirando un boton que no hizo nada vuelve a tocarlo.
    if (fallo) return avisarGuardado(fallo, true);
    return avisarGuardado("Guardado en Descargas: " + nombre, false);
  }
  var blob = new Blob([contenido], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  avisarGuardado("Archivo generado: " + nombre, false);
}

/** El boton de atras del telefono, cuando la ronda corre dentro del APK.
 *
 * Devuelve cierto si habia algo que cerrar. Falso deja que Android aplique su
 * regla de dos toques para salir: cerrar de un toque a mitad de una ronda
 * seria perder el turno entero, y el operador no tiene como recuperarlo.
 */
function atras() {
  var velo = document.querySelector(".velo");
  if (velo) { velo.remove(); return true; }
  return false;
}

function verResumen() {
  document.body.classList.remove("en-punto");
  if (reloj) { clearInterval(reloj); reloj = null; }
  var e = estadoRonda(ejecucion, pauta);
  var anomalias = anomaliasDe(ejecucion, pauta);
  ejecucion.anomalias = anomalias.map(function (a) { return a.id; });

  var html =
    '<h1>' + esc(pauta.activo_codigo) + '</h1>' +
    '<p class="tenue">' + esc(ejecucion.operador) + ' · ' + mmss(e.segundos) +
    ' en maquina' + (e.presupuesto_seg ? ' · presupuesto ' + mmss(e.presupuesto_seg) : '') +
    '</p>' +
    '<div class="tarjeta ' + (e.completa ? 'res-ok' : 'res-mal') + '">' +
    '<div class="titular">' +
    (e.completa ? 'Ronda completa' : 'Ronda incompleta') + '</div>' +
    '<p style="margin:6px 0 0">' + e.ok + ' OK · ' + e.nok + ' anomalia(s) · ' +
    e.sin_acceso + ' sin ver</p>' +
    (e.sin_acceso
      ? '<p class="tenue" style="margin-top:6px">Un punto que no se pudo ver no ' +
        'cuenta como visto. La ronda no vale como completa aunque esten los demas.</p>'
      : '') + '</div>';

  if (e.sospechosa_de_firma) {
    html += '<div class="aviso peligro"><b>▲ Demasiado rapida para haber sido ' +
      'ejecutada.</b> ' + e.segundos + ' s sobre un presupuesto de ' +
      e.presupuesto_seg + ' s. Criterio configurable de la planta, no una norma ' +
      '— pero conviene mirarlo antes de darla por buena.</div>';
  }

  if (anomalias.length) {
    html += '<h2>Anomalias</h2>';
    anomalias.forEach(function (a) {
      var tec = a.severidad === "detiene";
      html += '<div class="tarjeta ' + (tec ? 'peligro' : '') + '">' +
        '<span class="chip ' + (tec ? 'grave' : 'obs') + '">' +
        esc(SEVERIDADES[a.severidad] || a.severidad) + '</span>' +
        '<div style="font-weight:800;margin-top:6px">' + esc(a.componente) + '</div>' +
        '<p style="margin:4px 0 0">' + esc(a.descripcion) + '</p></div>';
    });
  } else {
    html += '<p class="tenue">Sin anomalias. Nada que etiquetar.</p>';
  }

  html += '<h2>Mandar a la oficina</h2>' +
    '<button id="bajar" class="grande primary">Guardar el archivo de la ronda</button>' +
    '<div id="aviso-guardado" class="aviso" style="display:none"></div>' +
    '<p class="tenue">Un <code>.json</code> que se manda por WhatsApp o correo. ' +
    'Ahi la oficina lo cruza con el analisis RCM: el telefono no lo hace porque ' +
    'el analisis no esta aqui.</p>' +
    '<div class="crece"></div>' +
    '<button id="otra">Otra maquina</button>';

  app.innerHTML = html;
  document.getElementById("otra").onclick = function () { verInicio(); };
  document.getElementById("bajar").onclick = function () {
    var datos = { ejecucion: ejecucion, anomalias: anomalias, estado: e };
    guardarRonda(ejecucion.id + ".json", JSON.stringify(datos, null, 2));
  };
}

verInicio();
</script>

</html>
