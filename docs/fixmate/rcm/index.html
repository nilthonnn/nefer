<style>
/* rcm:piel:inicio */
/* Generado por herramientas/piel.py desde docs/fixmate/app/index.html.
 * No editar aqui: se reescribe. */
    :root {
    --paper:#F3F4F2; --card:#FFFFFF; --card-2:#EAEDEB;
    --ink:#16191B; --ink-2:#4E5860; --ink-3:#5F6A72;
    --rule:#D6DCDA; --rule-2:#E6EAE8;
    --accent:#1E4B6B; --accent-soft:#E3ECF3;
    --ok:#1F6B4C; --ok-soft:#E1F0E9;
    --obs:#8A5A00; --obs-soft:#F8EFDB; --obs-rule:#E0C894;
    --mal:#96341F; --mal-soft:#F7E6E0; --mal-rule:#E0B2A2;
    --barra:#16191B; --barra-ink:#E7ECEB;
    --lift:0 1px 2px rgba(22,25,27,.05), 0 10px 26px -16px rgba(22,25,27,.28);
    /* Barlow va alojada; detrás, siempre, la del sistema: si el archivo aún
       no llegó o no está —el demo descargado como archivo suelto no lo
       lleva—, el texto se lee igual desde el primer instante. */
    --cond:"Barlow Condensed",ui-sans-serif,system-ui,-apple-system,
           "Roboto Condensed","Arial Narrow",sans-serif;
    --sans:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    /* La monoespaciada no se aloja: la del aparato es buena y cuesta 0 bytes. */
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:#14181A; --card:#1C2225; --card-2:#242B2F;
      --ink:#E7ECEB; --ink-2:#A3AFB4; --ink-3:#96A7B0;
      --rule:#2F383D; --rule-2:#262E32;
      --accent:#6FA8CE; --accent-soft:#16303F;
      --ok:#6FC49B; --ok-soft:#143024;
      --obs:#D9A24E; --obs-soft:#2C2417; --obs-rule:#4C3F23;
      --mal:#E08A6E; --mal-soft:#2E1D17; --mal-rule:#5A3327;
      --barra:#0E1113; --barra-ink:#E7ECEB;
      --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    --paper:#14181A; --card:#1C2225; --card-2:#242B2F;
    --ink:#E7ECEB; --ink-2:#A3AFB4; --ink-3:#96A7B0;
    --rule:#2F383D; --rule-2:#262E32;
    --accent:#6FA8CE; --accent-soft:#16303F;
    --ok:#6FC49B; --ok-soft:#143024;
    --obs:#D9A24E; --obs-soft:#2C2417; --obs-rule:#4C3F23;
    --mal:#E08A6E; --mal-soft:#2E1D17; --mal-rule:#5A3327;
    --barra:#0E1113; --barra-ink:#E7ECEB;
    --lift:0 1px 2px rgba(0,0,0,.45), 0 12px 30px -18px rgba(0,0,0,.8);
  }
  

/* La capa comun de las pantallas de FixMate: barra, botones, tarjetas,
 * etiquetas y avisos. Encima van las reglas propias de cada pantalla.
 *
 * Esto NO define colores: los toma de la piel, que sale de la app de
 * diagnostico. Un color escrito aqui a mano seria una tercera paleta, que es
 * justo lo que esta capa existe para que no pase.
 *
 * Por que una capa comun y no que cada pantalla se pinte sola: el tecnico que
 * diagnostica, el operador que hace la ronda y el ingeniero que decide la
 * estrategia son tres personas que hablan entre ellas de la misma maquina. Si
 * cada pantalla parece de otro programa, la primera pregunta de cada reunion
 * es cual de los tres tiene el dato bueno.
 */

*, *::before, *::after { box-sizing:border-box; }
/* Que los controles del sistema —barras de desplazamiento, campos, el
   teclado del telefono— sigan el mismo tema que la pagina. */
html { -webkit-text-size-adjust:100%; color-scheme:light dark; }
body { margin:0; background:var(--paper); color:var(--ink);
       font-family:var(--sans); font-size:16px; line-height:1.5;
       padding:0 16px env(safe-area-inset-bottom); }

/* ---------------------------------------------------------- la barra
 * La misma de la app de diagnostico: el nombre del producto, y al lado, en
 * chico, en que pantalla esta parado. Es lo unico que se ve igual en las tres
 * antes de leer una sola palabra.
 */
.barra { background:var(--barra); color:var(--barra-ink); margin:0 -16px;
         padding:.7rem 16px calc(.7rem + env(safe-area-inset-top));
         display:flex; align-items:baseline; gap:.6rem; flex-wrap:wrap; }
.barra b { font-family:var(--cond); font-size:1.15rem; letter-spacing:.04em;
           text-transform:uppercase; }
.barra span { font-family:var(--mono); font-size:.66rem; opacity:.7;
              letter-spacing:.06em; text-transform:uppercase; }
.barra .vinculos { margin-left:auto; display:flex; gap:.9rem; }
.barra .vinculos a { color:var(--barra-ink); opacity:.65; text-decoration:none;
                     font-family:var(--mono); font-size:.66rem;
                     letter-spacing:.06em; text-transform:uppercase; }
.barra .vinculos a:hover, .barra .vinculos a:focus-visible { opacity:1;
                     text-decoration:underline; }
/* Sólo aparece cuando el aparato ofrece instalar; lo pone `arranque.js`. */
.barra .instalar { margin-left:.9rem; background:transparent;
                   border-color:var(--barra-ink); color:var(--barra-ink);
                   font-family:var(--mono); font-size:.66rem;
                   letter-spacing:.06em; text-transform:uppercase;
                   padding:.25rem .6rem; border-radius:4px; }
.barra .instalar:hover { background:var(--barra-ink); color:var(--barra); }

/* ------------------------------------------------------- tipografia */
h1 { font-family:var(--cond); font-size:1.6rem; letter-spacing:.01em;
     margin:0 0 .25rem; text-wrap:balance; }
h2 { font-family:var(--mono); font-size:.7rem; letter-spacing:.1em;
     text-transform:uppercase; color:var(--ink-3); font-weight:700;
     margin:1.6rem 0 .6rem; }
h3 { font-size:1.05rem; margin:0 0 .3rem; text-wrap:balance; }
p { margin:0 0 .6rem; }
a { color:var(--accent); }
code { font-family:var(--mono); font-size:.86em; background:var(--card-2);
       padding:.05rem .3rem; border-radius:3px; }
.tenue { color:var(--ink-2); font-size:.86rem; }
.vacio { color:var(--ink-3); font-style:italic; }
/* La etiqueta de un dato, en monoespaciada chica: la misma de la app. */
.lb { font-family:var(--mono); font-size:.7rem; letter-spacing:.05em;
      text-transform:uppercase; color:var(--ink-3); }

/* ---------------------------------------------------------- botones */
button { font:inherit; font-size:.9rem; cursor:pointer; color:var(--ink);
         border:1px solid var(--rule); background:var(--card);
         border-radius:6px; padding:.55rem .9rem; text-align:left;
         touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
button:hover { border-color:var(--ink-3); }
button.primary { background:var(--accent); color:var(--paper);
                 border-color:var(--accent); font-weight:700; }
button:disabled { opacity:.5; cursor:default; }
:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

/* ----------------------------------------------- tarjetas y avisos */
.tarjeta { background:var(--card); border:1px solid var(--rule);
           border-radius:6px; padding:.9rem 1rem; margin-bottom:.8rem; }
/* El aviso de la app: barra al costado y fondo suave, no un bloque de color.
   Se lee con guantes y a contraluz. */
.aviso { border-left:3px solid var(--obs); background:var(--obs-soft);
         color:var(--ink); padding:.6rem .8rem; border-radius:0 4px 4px 0;
         font-size:.88rem; margin:.6rem 0 0; }
.aviso.peligro { border-left-color:var(--mal); background:var(--mal-soft); }
.aviso.nota { border-left-color:var(--rule); background:var(--card-2);
              color:var(--ink-2); }

/* ------------------------------------------------------------ chips
 * Rotulo corto con borde, no relleno: a tres por linea, el relleno convierte
 * la ficha en una bolsa de colores y deja de distinguirse lo grave.
 */
.chip { display:inline-block; font-family:var(--mono); font-size:.6rem;
        letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3);
        border:1px solid var(--rule); border-radius:3px; padding:.08rem .35rem;
        margin:0 .25rem .25rem 0; white-space:nowrap; }
.chip.grave { color:var(--mal); border-color:var(--mal); }
.chip.ok { color:var(--ok); border-color:var(--ok); }
.chip.obs { color:var(--obs); border-color:var(--obs); }
.chip.acento { color:var(--accent); border-color:var(--accent); }

ul.lista { margin:.35rem 0 0; padding-left:1.1rem; }
ul.lista li { margin-bottom:.2rem; font-size:.88rem; }
.oculto { display:none; }
/* rcm:piel:fin */

/* ------------------------------------------- lo propio de esta pantalla
 * Es trabajo de mesa: dos columnas, el arbol a la izquierda y el modo de
 * falla abierto a la derecha. Lo demas lo pone la piel.
 */
.hoja { max-width:1140px; margin:0 auto; padding:1.2rem 0 3rem; }
.rejilla { display:grid; grid-template-columns:330px 1fr; gap:1rem;
           align-items:start; }
@media (max-width:900px) { .rejilla { grid-template-columns:1fr; } }

/* El arbol del analisis: funcion, falla funcional, modo. */
.arbol { background:var(--card); border:1px solid var(--rule);
         border-radius:6px; padding:.6rem; }
.arbol .fn { font-weight:700; font-size:.9rem; margin:.8rem 0 .1rem; }
.arbol .est { color:var(--ink-3); font-size:.78rem; padding-left:.1rem; }
.arbol .ff { color:var(--ink-2); font-size:.82rem; margin:.4rem 0 .1rem;
             padding-left:.5rem; }
.arbol button { display:block; width:100%; margin:.3rem 0 0;
                background:var(--paper); font-size:.84rem; line-height:1.35;
                padding:.45rem .55rem; }
.arbol button.activo { border-color:var(--accent); background:var(--accent-soft); }

/* Una ficha de dato: etiqueta a la izquierda, valor a la derecha. */
.campo { display:grid; grid-template-columns:190px 1fr; gap:.15rem .9rem;
         font-size:.92rem; padding:.45rem 0; border-top:1px solid var(--rule-2); }
.campo > span:first-child { font-family:var(--mono); font-size:.68rem;
         letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); }
@media (max-width:620px) { .campo { grid-template-columns:1fr; } }

/* Las tres respuestas del arbol. Del mismo tamano, en la misma fila y en el
   mismo orden siempre: si «sin evaluar» fuera mas chico o estuviera mas
   abajo, dejaria de usarse y «no lo miramos» se registraria como
   «decidimos que no». Sin elegir, los tres son neutros: el color aparece
   cuando hay respuesta, no antes. */
.pregunta { border-top:1px solid var(--rule-2); padding:.75rem 0; }
.opciones { display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
            gap:.5rem; max-width:26rem; margin-top:.5rem; }
.opciones button { text-align:center; padding:.5rem .4rem; }
.op-si[aria-pressed="true"] { background:var(--ok); border-color:var(--ok);
            color:var(--paper); font-weight:700; }
.op-no[aria-pressed="true"] { background:var(--mal); border-color:var(--mal);
            color:var(--paper); font-weight:700; }
.op-nd[aria-pressed="true"] { background:var(--ink-3); border-color:var(--ink-3);
            color:var(--paper); font-weight:700; }

/* El dictamen, con el camino que lo produjo. El borde del costado dice de
   que clase es sin leer: proactiva, por defecto, o bloqueada por la guarda. */
.dictamen { background:var(--card); border:1px solid var(--rule);
            border-left:4px solid var(--accent); border-radius:0 6px 6px 0;
            padding:1rem 1.1rem; margin-bottom:.8rem; }
.dictamen.proactiva { border-left-color:var(--ok); }
.dictamen.defecto { border-left-color:var(--obs); }
.dictamen.bloqueada { border-left-color:var(--mal); }
.estrategia { font-family:var(--cond); font-size:1.5rem; letter-spacing:.01em;
              line-height:1.1; }
.camino { counter-reset:paso; margin:.8rem 0 0; padding:0; list-style:none; }
.camino li { counter-increment:paso; position:relative; padding:.45rem 0 .45rem 1.9rem;
             border-top:1px solid var(--rule-2); font-size:.86rem; }
.camino li::before { content:counter(paso); position:absolute; left:0; top:.5rem;
             width:1.25rem; height:1.25rem; border-radius:50%;
             background:var(--card-2); color:var(--ink-3);
             font-family:var(--mono); font-size:.66rem; display:grid;
             place-items:center; }
.camino .resp { color:var(--accent); font-weight:700; }

/* El panel de las siete preguntas. */
.q { display:flex; gap:.6rem; align-items:flex-start; padding:.5rem 0;
     border-top:1px solid var(--rule-2); font-size:.92rem; }
.q .marca { flex:0 0 1.1rem; font-weight:900; text-align:center; }
.q.si .marca { color:var(--ok); }
.q.no .marca { color:var(--obs); }
.progreso { height:5px; background:var(--rule); border-radius:3px;
            overflow:hidden; margin:.5rem 0 .2rem; }
.progreso > i { display:block; height:100%; background:var(--accent); }

/* El tablero y el resumen por modo. */
.numeros { display:flex; flex-wrap:wrap; gap:.6rem; }
.numeros > div { background:var(--card-2); border:1px solid var(--rule-2);
                 border-radius:6px; padding:.5rem .8rem; min-width:7rem; }
.numeros b { display:block; font-family:var(--cond); font-size:1.5rem;
             letter-spacing:.01em; }
table { width:100%; border-collapse:collapse; font-size:.86rem; }
th, td { text-align:left; padding:.45rem .5rem; vertical-align:top;
         border-bottom:1px solid var(--rule-2); }
th { font-family:var(--mono); font-size:.66rem; letter-spacing:.06em;
     text-transform:uppercase; color:var(--ink-3); font-weight:400; }
tr.grave td { background:var(--mal-soft); }

/* Un hallazgo de la ronda, dentro de la ficha del modo. */
.hallazgo { border-left:3px solid var(--obs); background:var(--obs-soft);
            padding:.4rem .6rem; border-radius:0 4px 4px 0; margin-bottom:.4rem;
            font-size:.88rem; }
</style>

<script>
/* rcm:arranque:inicio */
/* Lo que hace cada pantalla al abrirse, antes de pintar nada. Son dos cosas,
 * y las dos dependen de COMO llegó la pantalla al aparato.
 */

/* 1. Los enlaces entre herramientas sólo sirven si se abrió desde el sitio.
 *    Descargada como archivo suelto —que es como viaja por WhatsApp—
 *    apuntarían a carpetas que no existen en ese teléfono, y un enlace roto
 *    en la barra hace dudar del resto de la pantalla. Se quitan. */
if (location.protocol === "file:") {
  var vinculos = document.querySelector(".barra .vinculos");
  if (vinculos) vinculos.remove();
}

/* 2. Servida por http(s), se guarda en el teléfono para que abra sin señal.
 *    Es la condición de trabajo real: interior mina, sin cobertura, y el
 *    turno no espera a que haya línea. Si el navegador no lo permite —modo
 *    privado, versión vieja—, la pantalla sigue funcionando igual: el
 *    trabajador de servicio es una mejora, no un requisito. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(function () {
    /* Sin registro no hay copia local, y ya está: no se le dice nada al
       operador, porque no hay nada que pueda hacer al respecto. */
  });
}

/* 3. El botón de instalar, cuando el aparato lo ofrece.
 *
 *    Android avisa por su cuenta con un cartel discreto que casi nadie ve, y
 *    la otra vía es el menú de tres puntos del navegador: el operador no va
 *    a dar con eso, y sin instalar no hay copia local ni pantalla completa.
 *    Así que cuando Chrome dice que se puede, aparece el botón en la barra.
 *
 *    No se dibuja si el aparato no lo ofrece —ya instalada, en un navegador
 *    que no lo soporta, o en un escritorio—: un botón que no hace nada es
 *    peor que ninguno. */
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault();
  var barra = document.querySelector(".barra");
  if (!barra || document.getElementById("instalar")) return;
  var boton = document.createElement("button");
  boton.id = "instalar";
  boton.className = "instalar";
  boton.textContent = "Instalar";
  boton.onclick = function () {
    boton.disabled = true;
    if (e.prompt) e.prompt();
  };
  barra.appendChild(boton);
});

window.addEventListener("appinstalled", function () {
  var boton = document.getElementById("instalar");
  if (boton) boton.remove();
});
/* rcm:arranque:fin */
</script>
<main class="hoja" id="app"></main>
<script>
/* rcm:reglas:inicio — ESPEJO de nefer/fixmate/decision.py y rcm.py.
 *
 * Las constantes de abajo las escribe `herramientas/espejo-rcm.py`; el arbol
 * de decision y el informe de completitud estan escritos a mano en los dos
 * lenguajes, igual que el motor de busqueda y las reglas de la ronda. Que
 * hagan lo mismo lo responde `tests/test_fixmate_cruce_rcm.py`, que corre
 * ESTE javascript sobre las 729 combinaciones de respuestas por cada clase
 * de consecuencia, evidente y oculta, y compara dictamen por dictamen —
 * estrategia, motivo, camino, avisos y banderas— con lo que dice Python.
 *
 * Importa mas aqui que en ninguna otra parte de FixMate. Un arbol que se
 * separa no da error en ningun lado: la pantalla del taller dice «operar
 * hasta la falla» y la oficina dice «rediseño obligatorio» sobre el mismo
 * modo de falla de seguridad, las dos se ven razonables, y la que queda
 * firmada es la que alguien imprimio primero.
 *
 * LO QUE ESTA PANTALLA NO HACE, A PROPOSITO:
 *
 *   - No evalua criticidad. El metodo es configurable y vive en
 *     `criticidad.py` con sus matrices; traerlo aqui seria una segunda copia
 *     de una tabla que cada planta cambia. Se muestran los valores tal como
 *     los declara el archivo, con el nombre del metodo, y la evaluacion la
 *     hace la oficina.
 *   - No arma la matriz FMECA. Sus treinta columnas las define `fmeca.py` y
 *     salen del comando `fixmate rcm matriz`. Lo que hay en pantalla es un
 *     resumen para mirar, no el archivo que se entrega.
 *   - No clasifica contra el catalogo ISO 14224 ni toca el historial.
 *
 * Las tres son decisiones de donde vive cada cosa, no funciones a medio
 * hacer, y cada una esta dicha tambien en la pantalla.
 */
/* rcm:datos:inicio */
var ESTRATEGIAS = {
  "cbm": "Mantenimiento segun condicion",
  "restauracion": "Restauracion programada",
  "descarte": "Descarte programado",
  "busqueda_fallas": "Busqueda de fallas",
  "operar_hasta_falla": "Operar hasta la falla",
  "rediseno": "Rediseño o cambio de ingenieria"
};
var POR_DEFECTO = [
  "busqueda_fallas",
  "operar_hasta_falla",
  "rediseno"
];
var PROACTIVAS = [
  "cbm",
  "descarte",
  "restauracion"
];
var CLASES_CONSECUENCIA = [
  "seguridad",
  "ambiental",
  "operacional",
  "produccion",
  "economica",
  "no-significativa"
];
var CONSECUENCIAS_GRAVES = [
  "ambiental",
  "seguridad"
];
var PREGUNTAS = [
  {
    "numero": 1,
    "clave": "funciones",
    "texto": "¿Cuales son las funciones y los estandares de desempeño del activo en su contexto operacional actual?",
    "responde": "cada funcion declarada, con su estandar"
  },
  {
    "numero": 2,
    "clave": "fallas_funcionales",
    "texto": "¿De que maneras puede fallar en el cumplimiento de sus funciones?",
    "responde": "al menos una falla funcional por funcion"
  },
  {
    "numero": 3,
    "clave": "modos",
    "texto": "¿Que causa cada falla funcional?",
    "responde": "al menos un modo de falla por falla funcional"
  },
  {
    "numero": 4,
    "clave": "efectos",
    "texto": "¿Que sucede cuando ocurre cada modo de falla?",
    "responde": "el efecto descrito en cada modo de falla"
  },
  {
    "numero": 5,
    "clave": "consecuencias",
    "texto": "¿En que forma importa cada falla?",
    "responde": "evidente u oculta, y al menos una consecuencia clasificada"
  },
  {
    "numero": 6,
    "clave": "tareas",
    "texto": "¿Que debe hacerse para predecir o prevenir cada falla?",
    "responde": "una decision de estrategia registrada por modo de falla"
  },
  {
    "numero": 7,
    "clave": "acciones_por_defecto",
    "texto": "¿Que debe hacerse si no se encuentra una tarea proactiva adecuada?",
    "responde": "la accion por defecto registrada donde no hubo tarea proactiva"
  }
];
var CRITICAS = [
  "consecuencias",
  "fallas_funcionales",
  "funciones",
  "modos"
];
var SIN_DATOS_ECONOMICOS = "Informacion economica insuficiente para determinar costo-efectividad. La tarea se conserva; no se declara ahorro.";
var AVISO_SIN_EVALUAR = "Quedaron preguntas sin evaluar. La decision salio del lado conservador: revisela antes de llevarla al plan.";
var AVISO_89 = "Sin intervalo de edad identificable, un limite por horas no previene la falla: Nowlan y Heap (1978) encontraron que el 89 % de los items no tiene zona de desgaste. Verifique el dato antes de descartar la restauracion.";
var ADVERTENCIA_RPN = "El RPN multiplica escalas ordinales, que es estadisticamente indefendible: dos combinaciones muy distintas de severidad dan el mismo numero. AIAG-VDA lo reemplazo en 2019 por una tabla de prioridad. Uselo solo si su procedimiento lo exige, y no compare RPN entre equipos distintos.";
/* rcm:datos:fin */

/* Los campos del arbol, en el orden en que los nombra `Respuestas`. El orden
 * importa: es el que decide si una decision quedo «incompleta». */
var CAMPOS_DECISION = ["detectable", "intervalo_edad", "restaurable", "viable",
                       "costo_efectiva", "probable"];

/* Las preguntas del arbol, tal como las registra cada paso en Python. */
var P_EVIDENTE = "¿La perdida de funcion es evidente para quien opera?";
var P_GRAVE = "¿Tiene consecuencia de seguridad o ambiental?";
var P_DETECTABLE = "¿La degradacion se detecta con aviso suficiente para actuar?";
var P_EDAD = "¿Hay una edad a la que la probabilidad de falla sube?";
var P_RESTAURABLE = "¿Restaurar devuelve la resistencia original?";
var P_PROBABLE = "¿Se puede probar periodicamente que la proteccion responde?";
var P_VIABLE_CBM = "¿La tarea a condicion es tecnicamente viable?";
var P_VIABLE_EDAD = "¿La tarea por intervalo es tecnicamente viable?";
var P_COSTO = "¿Alguna tarea cuesta menos que la consecuencia de la falla?";
var P_GUARDA = "Sin tarea proactiva y con consecuencia de seguridad: " +
               "¿operar hasta la falla?";

/* ----------------------------------------------------------- utilidades */

/** Tri-estado. `null` es «no se evaluo», y no es lo mismo que «no». */
function tri(v) { return v === true ? true : v === false ? false : null; }

function siNo(v) { return v === true ? "si" : v === false ? "no" : "sin evaluar"; }

function esGrave(modo) {
  var c = modo.consecuencias || [];
  for (var i = 0; i < c.length; i++) {
    var clase = typeof c[i] === "string" ? c[i] : c[i].clase;
    if (CONSECUENCIAS_GRAVES.indexOf(clase) >= 0) return true;
  }
  return false;
}

function respuestas(d) {
  d = d || {};
  var r = {};
  CAMPOS_DECISION.forEach(function (k) { r[k] = tri(d[k]); });
  return r;
}

function _paso(camino, pregunta, respuesta, consecuencia) {
  camino.push({ pregunta: pregunta, respuesta: respuesta,
                consecuencia: consecuencia });
}

function _dictamen(estrategia, motivo, camino, opc) {
  opc = opc || {};
  return {
    estrategia: estrategia,
    rotulo: ESTRATEGIAS[estrategia],
    motivo: motivo,
    camino: camino,
    por_defecto: !!opc.por_defecto,
    bloqueado_por_seguridad: !!opc.bloqueado_por_seguridad,
    incompleta: !!opc.incompleta,
    avisos: opc.avisos || []
  };
}

/* ------------------------------------------------- el arbol de decision */

/** La estrategia de un modo de falla. Mismo contrato que `decision.decidir()`.
 *
 * El orden de las preguntas no es cosmetico: evidente u oculta va primero
 * porque una falla oculta no se trata por su propio riesgo sino por el de la
 * falla multiple; y la guarda del final no se negocia — con consecuencia de
 * seguridad o ambiental, «operar hasta la falla» no es una salida legal.
 */
function decidir(modo, entrada) {
  var r = respuestas(entrada);
  var camino = [];
  var avisos = [];
  var grave = esGrave(modo);
  var sinEvaluar = CAMPOS_DECISION.filter(function (k) {
    return r[k] === null && k !== "costo_efectiva";
  });
  var cierre = function (estrategia, motivo, cam, opc) {
    opc = opc || {};
    opc.incompleta = sinEvaluar.length > 0;
    opc.avisos = avisos.concat(sinEvaluar.length ? [AVISO_SIN_EVALUAR] : []);
    return _dictamen(estrategia, motivo, cam, opc);
  };

  // ---- 1. ¿Es evidente? Primera bifurcacion, antes que nada.
  if (!modo.evidente) {
    _paso(camino, P_EVIDENTE, "no",
          "falla oculta: el riesgo es la falla multiple, no esta falla sola");
    if (r.probable === true) {
      _paso(camino, P_PROBABLE, "si", "busqueda de fallas");
      return cierre("busqueda_fallas",
        "La falla es oculta: por si sola no produce efecto, pero deja " +
        "sin proteccion a la siguiente. El riesgo que se trata aqui no " +
        "es esta falla sino la falla multiple, asi que la tarea no " +
        "previene nada: comprueba periodicamente que la funcion oculta " +
        "todavia responde.",
        camino, { por_defecto: true });
    }
    _paso(camino, P_PROBABLE, siNo(r.probable),
          "no hay forma de verificar la funcion oculta");
    return cierre("rediseno",
      "Falla oculta que no se puede verificar: no hay tarea que confirme " +
      "que la proteccion sigue ahi, y entonces nada acota el riesgo de la " +
      "falla multiple. Lo que corresponde es cambiar el diseño para " +
      "hacerla evidente o verificable.",
      camino, { por_defecto: true, bloqueado_por_seguridad: grave });
  }

  _paso(camino, P_EVIDENTE, "si", "sigue por la rama de fallas evidentes");

  // ---- 2. ¿Consecuencia grave? Cambia el criterio de aceptacion.
  _paso(camino, P_GRAVE, grave ? "si" : "no",
        grave ? "la tarea debe reducir el riesgo a un nivel tolerable"
              : "basta con que la tarea cueste menos que la falla");

  // ---- 3. CBM primero: aprovecha la vida util y no abre una maquina sana.
  if (r.detectable === true) {
    _paso(camino, P_DETECTABLE, "si", "mantenimiento segun condicion");
    if (r.viable === false) {
      _paso(camino, P_VIABLE_CBM, "no", "se descarta CBM y se sigue buscando");
    } else {
      if (!grave && r.costo_efectiva === null) avisos.push(SIN_DATOS_ECONOMICOS);
      return cierre("cbm",
        "La degradacion se puede detectar con aviso suficiente: se " +
        "vigila la condicion y se interviene cuando el parametro lo " +
        "pide, no cuando lo diga el calendario.",
        camino, {});
    }
  } else {
    _paso(camino, P_DETECTABLE, siNo(r.detectable),
          "no hay tarea a condicion aplicable");
  }

  // ---- 4. Edad: sin zona de desgaste, un limite por horas no previene nada.
  if (r.intervalo_edad === true) {
    _paso(camino, P_EDAD, "si", "una tarea por intervalo puede servir");
    if (r.restaurable === true && r.viable !== false) {
      return cierre("restauracion",
        "Hay una edad identificable a la que la falla se vuelve probable, " +
        "y restaurar devuelve la resistencia original: se restaura antes " +
        "de ese punto.",
        camino.concat([{ pregunta: P_RESTAURABLE, respuesta: "si",
                         consecuencia: "restauracion programada" }]), {});
    }
    if (r.viable !== false) {
      return cierre("descarte",
        "Hay una edad identificable y el item no se restaura: se descarta " +
        "y se reemplaza antes de ese punto.",
        camino.concat([{ pregunta: P_RESTAURABLE, respuesta: siNo(r.restaurable),
                         consecuencia: "descarte programado" }]), {});
    }
    _paso(camino, P_VIABLE_EDAD, "no", "no hay tarea proactiva aplicable");
  } else {
    _paso(camino, P_EDAD, siNo(r.intervalo_edad),
          "restauracion y descarte no previenen nada aqui");
    if (r.intervalo_edad === false) avisos.push(AVISO_89);
  }

  // ---- 5. No hay tarea proactiva. Aqui manda la guarda.
  if (grave) {
    _paso(camino, P_GUARDA, "no",
          "la guarda lo impide: el rediseño es obligatorio");
    return cierre("rediseno",
      "Ninguna tarea proactiva reduce el riesgo a un nivel tolerable y la " +
      "falla tiene consecuencia de seguridad o ambiental: operar hasta la " +
      "falla no es una salida legal. Corresponde cambiar el diseño, el " +
      "contexto operacional o el procedimiento.",
      camino, { por_defecto: true, bloqueado_por_seguridad: true });
  }

  if (r.costo_efectiva === false) {
    _paso(camino, P_COSTO, "no", "operar hasta la falla");
    return cierre("operar_hasta_falla",
      "Sin consecuencia grave, sin degradacion detectable y sin edad " +
      "identificable: ninguna tarea programada se paga. Se repara cuando " +
      "falle, a conciencia y no por omision.",
      camino, { por_defecto: true });
  }

  if (r.costo_efectiva === null) avisos.push(SIN_DATOS_ECONOMICOS);
  _paso(camino, P_COSTO, siNo(r.costo_efectiva),
        "operar hasta la falla, sin declarar ahorro");
  return cierre("operar_hasta_falla",
    "No hay tarea proactiva aplicable y la consecuencia no es de seguridad. " +
    "Se opera hasta la falla; si aparece un dato economico que lo cambie, se " +
    "revisa.",
    camino, { por_defecto: true });
}

/* ------------------------------------------- el analisis y su completitud */

/** Pone a funciones, fallas y modos el id que les pondria Python.
 *
 * No es cosmetica: `Analisis.agregar_*()` numera F1, F1.1, F1.1.1 —1-based,
 * por posicion— y el archivo que exporta esta pantalla se carga despues con
 * `cargador.analisis()`. Si los ids se numeraran distinto, las decisiones no
 * casarian con sus modos al volver a la oficina.
 *
 * Devuelve la misma forma plana que tiene `Analisis`: funciones, fallas y
 * modos en tres listas, con las llaves cosidas.
 */
function normalizarAnalisis(datos) {
  var a = {
    activo: datos.activo || {}, contexto: datos.contexto || "",
    facilitador: datos.facilitador || "",
    participantes: datos.participantes || [],
    fecha: datos.fecha || "",
    metodo_criticidad: datos.metodo_criticidad || "",
    funciones: [], fallas: [], modos: []
  };
  if (!a.contexto) a.contexto = a.activo.contexto || "";

  (datos.funciones || []).forEach(function (fd, i) {
    var funcion = {
      id: "F" + (i + 1), descripcion: fd.descripcion || "",
      estandar: fd.estandar || "", tipo: fd.tipo || "principal",
      condicion: fd.condicion || ""
    };
    a.funciones.push(funcion);
    (fd.fallas || []).forEach(function (ffd, j) {
      var falla = { id: funcion.id + "." + (j + 1), funcion_id: funcion.id,
                    descripcion: ffd.descripcion || "" };
      a.fallas.push(falla);
      (ffd.modos || []).forEach(function (md, k) {
        var modo = {
          id: falla.id + "." + (k + 1), falla_funcional_id: falla.id,
          descripcion: md.descripcion || "",
          ubicacion: md.ubicacion || {},
          codigo_catalogo: md.codigo_catalogo || "",
          causa: md.causa || "", mecanismo: md.mecanismo || "",
          evidente: md.evidente === undefined ? true : !!md.evidente,
          efecto: md.efecto || {},
          consecuencias: md.consecuencias || [],
          criticidad: md.criticidad || null,
          evidencia: md.evidencia || [],
          estado: md.estado || "propuesto",
          decision: md.decision || null
        };
        a.modos.push(modo);
      });
    });
  });
  return a;
}

function fallasDe(a, funcionId) {
  return a.fallas.filter(function (f) { return f.funcion_id === funcionId; });
}

function modosDe(a, fallaId) {
  return a.modos.filter(function (m) { return m.falla_funcional_id === fallaId; });
}

function efectoDescrito(modo) {
  return !!String((modo.efecto || {}).local || "").trim();
}

function _respuesta(pregunta, contestada, faltantes) {
  return { numero: pregunta.numero, clave: pregunta.clave, texto: pregunta.texto,
           contestada: !!contestada, faltantes: faltantes || [] };
}

/** Que preguntas de JA1011 quedaron contestadas. Mismo contrato que
 *  `rcm.completitud()`.
 *
 * `completo` es True solo con las siete. No hay porcentaje que redondee
 * hacia arriba: el criterio de la norma es binario a proposito, porque la
 * norma nacio porque se vendian metodologias incompletas con ese nombre.
 */
function completitud(a, decisiones) {
  decisiones = decisiones || {};
  var rs = [];

  // Q1 - funciones con estandar. El estandar ya es obligatorio al cargar.
  rs.push(_respuesta(PREGUNTAS[0], a.funciones.length > 0,
    a.funciones.length ? [] : ["no hay ninguna funcion declarada"]));

  // Q2 - cada funcion con al menos una falla funcional.
  var sinFalla = a.funciones.filter(function (f) { return !fallasDe(a, f.id).length; })
                            .map(function (f) { return f.id; });
  rs.push(_respuesta(PREGUNTAS[1], a.fallas.length > 0 && !sinFalla.length,
    sinFalla.length
      ? sinFalla.map(function (i) { return "la funcion " + i + " no tiene fallas funcionales"; })
      : (a.fallas.length ? [] : ["no hay fallas funcionales"])));

  // Q3 - cada falla funcional con al menos un modo.
  var sinModo = a.fallas.filter(function (f) { return !modosDe(a, f.id).length; })
                        .map(function (f) { return f.id; });
  rs.push(_respuesta(PREGUNTAS[2], a.modos.length > 0 && !sinModo.length,
    sinModo.length
      ? sinModo.map(function (i) { return "la falla " + i + " no tiene modos de falla"; })
      : (a.modos.length ? [] : ["no hay modos de falla"])));

  // Q4 - efecto descrito en cada modo.
  var sinEfecto = a.modos.filter(function (m) { return !efectoDescrito(m); })
                         .map(function (m) { return m.id; });
  rs.push(_respuesta(PREGUNTAS[3], a.modos.length > 0 && !sinEfecto.length,
    sinEfecto.length
      ? sinEfecto.map(function (i) { return "el modo " + i + " no tiene efecto descrito"; })
      : (a.modos.length ? [] : ["no hay modos de falla"])));

  // Q5 - consecuencia clasificada en cada modo.
  var sinConsec = a.modos.filter(function (m) { return !(m.consecuencias || []).length; })
                         .map(function (m) { return m.id; });
  rs.push(_respuesta(PREGUNTAS[4], a.modos.length > 0 && !sinConsec.length,
    sinConsec.length
      ? sinConsec.map(function (i) { return "el modo " + i + " no tiene consecuencia clasificada"; })
      : (a.modos.length ? [] : ["no hay modos de falla"])));

  // Q6 - una decision registrada por modo.
  var sinDecision = a.modos.filter(function (m) {
    return !Object.prototype.hasOwnProperty.call(decisiones, m.id);
  }).map(function (m) { return m.id; });
  rs.push(_respuesta(PREGUNTAS[5], a.modos.length > 0 && !sinDecision.length,
    sinDecision.length
      ? sinDecision.map(function (i) { return "el modo " + i + " no tiene decision de estrategia"; })
      : (a.modos.length ? [] : ["no hay modos de falla"])));

  // Q7 - donde la decision fue una accion por defecto, tiene que estar
  // registrada como tal. Un modo con tarea proactiva no debe nada aqui.
  var faltanDefecto = Object.keys(decisiones).filter(function (mid) {
    var d = decisiones[mid];
    return d && d.por_defecto && !d.motivo;
  }).map(function (mid) {
    return "el modo " + mid + ": la decision es una accion por defecto y no quedo justificada";
  });
  var hayDecisiones = Object.keys(decisiones).length > 0;
  var q7 = hayDecisiones && !sinDecision.length && !faltanDefecto.length;
  rs.push(_respuesta(PREGUNTAS[6], q7,
    faltanDefecto.length
      ? faltanDefecto
      : ((hayDecisiones && !sinDecision.length) ? [] : ["faltan decisiones por registrar"])));

  var rompe = rs.some(function (r) {
    return !r.contestada && CRITICAS.indexOf(r.clave) >= 0;
  });
  return {
    respuestas: rs,
    completo: rs.every(function (r) { return r.contestada; }),
    contestadas: rs.filter(function (r) { return r.contestada; }).length,
    rompe_cadena: rompe
  };
}

/* ------------------------------------- la evidencia que llega del campo */

/** Une una anomalia de la ronda con el modo de falla que declara su mismo
 *  codigo. Mismo contrato que `anomalia.enlazar()`, y el `motivo` de mas,
 *  que es para la pantalla.
 *
 * Exige coincidencia EXACTA de codigo y de activo, y no elige entre dos
 * candidatos: una anomalia enlazada al modo equivocado contamina la
 * frecuencia por modo y la decision de estrategia que sale de ahi.
 *
 * Lo que aqui NO se hace, igual que en el telefono: deducir el codigo de un
 * texto libre. Eso es el catalogo ISO 14224 —41 entradas con sus pistas— y
 * lo hace la oficina con `fixmate tpm anomalias`. Una anomalia sin codigo se
 * queda sin enganchar, y la pantalla dice por que.
 */
function enlazarAnomalia(a, analisis) {
  if (a.modo_falla_id) {
    return { modo_falla_id: a.modo_falla_id, motivo: "la pauta declara el modo" };
  }
  if (!a.codigo_catalogo) {
    return { modo_falla_id: "",
             motivo: "sin codigo de catalogo: el telefono no clasifica texto libre" };
  }
  if (!analisis || analisis.activo.codigo !== a.activo_codigo) {
    return { modo_falla_id: "", motivo: "la anomalia es de otro activo" };
  }
  var candidatos = analisis.modos.filter(function (m) {
    return m.codigo_catalogo === a.codigo_catalogo;
  });
  if (candidatos.length === 1) {
    return { modo_falla_id: candidatos[0].id, motivo: "por codigo de catalogo" };
  }
  if (candidatos.length === 0) {
    return { modo_falla_id: "",
             motivo: "ningun modo del analisis declara ese codigo" };
  }
  return { modo_falla_id: "",
           motivo: "dos modos declaran el mismo codigo: la ambiguedad se " +
                   "resuelve en el analisis, no aqui a la suerte" };
}

/** Lo que un jefe de mantenimiento mira primero. Mismo contrato que
 *  `decision.resumen()`. */
function resumenRCM(a, decisiones) {
  decisiones = decisiones || {};
  var reparto = {};
  Object.keys(ESTRATEGIAS).forEach(function (k) { reparto[k] = 0; });
  var ids = Object.keys(decisiones);
  ids.forEach(function (mid) { reparto[decisiones[mid].estrategia] += 1; });
  return {
    activo: a.activo.codigo || "",
    modos: a.modos.length,
    decididos: ids.length,
    graves: a.modos.filter(esGrave).length,
    ocultos: a.modos.filter(function (m) { return !m.evidente; }).length,
    reparto: reparto,
    "rediseños_obligatorios": ids.filter(function (mid) {
      return decisiones[mid].bloqueado_por_seguridad; }).length,
    "decisiones_incompletas": ids.filter(function (mid) {
      return decisiones[mid].incompleta; }).length
  };
}
/* rcm:reglas:fin */

if (typeof module !== "undefined" && module.exports) {
  module.exports = {
    decidir: decidir, completitud: completitud, resumenRCM: resumenRCM,
    enlazarAnomalia: enlazarAnomalia,
    normalizarAnalisis: normalizarAnalisis, esGrave: esGrave,
    fallasDe: fallasDe, modosDe: modosDe, efectoDescrito: efectoDescrito,
    ESTRATEGIAS: ESTRATEGIAS, POR_DEFECTO: POR_DEFECTO, PROACTIVAS: PROACTIVAS,
    PREGUNTAS: PREGUNTAS, CRITICAS: CRITICAS,
    CLASES_CONSECUENCIA: CLASES_CONSECUENCIA,
    CONSECUENCIAS_GRAVES: CONSECUENCIAS_GRAVES,
    SIN_DATOS_ECONOMICOS: SIN_DATOS_ECONOMICOS,
    AVISO_SIN_EVALUAR: AVISO_SIN_EVALUAR, AVISO_89: AVISO_89,
    ADVERTENCIA_RPN: ADVERTENCIA_RPN
  };
}

var app = document.getElementById("app");
var crudo = null;        // el JSON tal como lo abrio el usuario
var analisis = null;     // normalizado, con los ids de Python
var respuestasPorModo = {};  // modo_id -> {campo: true|false|null}
var decisiones = {};     // modo_id -> dictamen

var porModo = {};        // modo_id -> anomalias de campo enganchadas
var sueltas = [];        // las que no engancharon, con el motivo

function esc(s) {
  return String(s === undefined || s === null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function campo(etiqueta, valor, vacio) {
  var hay = String(valor === undefined || valor === null ? "" : valor).trim();
  return '<div class="campo"><span>' + esc(etiqueta) + '</span><span' +
    (hay ? '>' + esc(hay) : ' class="vacio">' + esc(vacio || "sin declarar")) +
    '</span></div>';
}

function modo(id) {
  return analisis.modos.filter(function (m) { return m.id === id; })[0] || null;
}

function fallaDe(m) {
  return analisis.fallas.filter(function (f) {
    return f.id === m.falla_funcional_id; })[0] || null;
}

function funcionDe(m) {
  var ff = fallaDe(m);
  return ff ? analisis.funciones.filter(function (f) {
    return f.id === ff.funcion_id; })[0] || null : null;
}

/** Las mismas exigencias que `cargador.analisis_de_dict()`, con los mismos
 *  motivos: una función sin estándar no se puede fallar de forma
 *  verificable, y de ella no sale ningún modo de falla útil. */
function revisar(a) {
  if (!a.funciones.length) return "El análisis no declara ninguna función.";
  for (var i = 0; i < a.funciones.length; i++) {
    var f = a.funciones[i];
    if (!String(f.descripcion).trim()) {
      return "La función " + f.id + " no tiene descripción.";
    }
    if (!String(f.estandar).trim()) {
      return "La función " + f.id + " («" + f.descripcion + "») no declara " +
        "estándar de desempeño. Una función sin estándar no se puede fallar " +
        "de forma verificable, y de ella no sale ningún modo de falla útil.";
    }
  }
  for (var j = 0; j < a.fallas.length; j++) {
    if (!String(a.fallas[j].descripcion).trim()) {
      return "La falla funcional " + a.fallas[j].id + " no tiene descripción.";
    }
  }
  for (var k = 0; k < a.modos.length; k++) {
    if (!String(a.modos[k].descripcion).trim()) {
      return "El modo de falla " + a.modos[k].id + " no tiene descripción.";
    }
    var cs = a.modos[k].consecuencias || [];
    for (var n = 0; n < cs.length; n++) {
      var clase = typeof cs[n] === "string" ? cs[n] : cs[n].clase;
      if (CLASES_CONSECUENCIA.indexOf(clase) < 0) {
        return "El modo " + a.modos[k].id + " declara la consecuencia «" +
          clase + "», que no existe. Si quería decir que la falla es oculta, " +
          "eso va en «evidente»: false, no en las consecuencias — es la " +
          "primera bifurcación del análisis, no una categoría más.";
      }
    }
  }
  return "";
}

function abrir(datos) {
  var a;
  try { a = normalizarAnalisis(datos || {}); }
  catch (e) { return verInicio("No se pudo leer el análisis: " + e.message); }
  var problema = revisar(a);
  if (problema) return verInicio(problema);

  crudo = datos; analisis = a;
  respuestasPorModo = {}; decisiones = {};
  ronda = null; porModo = {}; sueltas = [];
  // Las decisiones que ya vienen en el archivo se cargan tal como están. Un
  // modo sin «decision» no se decide: no se le inventa una respuesta
  // conservadora para que el análisis parezca completo.
  a.modos.forEach(function (m) {
    if (m.decision) {
      respuestasPorModo[m.id] = respuestas(m.decision);
      decisiones[m.id] = decidir(m, respuestasPorModo[m.id]);
    } else {
      respuestasPorModo[m.id] = respuestas(null);
    }
  });
  seleccion = a.modos.length ? a.modos[0].id : null;
  render();
}

};

// El orden del árbol, que no es el orden de los datos: oculta primero.
var ORDEN = ["probable", "detectable", "intervalo_edad", "restaurable",
             "viable", "costo_efectiva"];

var PREGUNTAS_DE = {
  probable: [P_PROBABLE], detectable: [P_DETECTABLE],
  intervalo_edad: [P_EDAD], restaurable: [P_RESTAURABLE],
  viable: [P_VIABLE_CBM, P_VIABLE_EDAD], costo_efectiva: [P_COSTO]
};

function usada(campo, d) {
  if (!d) return false;
  var textos = PREGUNTAS_DE[campo] || [];
  return d.camino.some(function (p) { return textos.indexOf(p.pregunta) >= 0; });
}

function ficha() {
  if (!seleccion) {
    return '<div class="tarjeta">El análisis no tiene modos de falla. Sin ' +
      'modos no hay nada que decidir: la Q3 está sin contestar y la cadena ' +
      'está rota.</div>';
  }
  var m = modo(seleccion);
  var ff = fallaDe(m), f = funcionDe(m);
  var u = m.efecto || {};
  var html = '<div class="tarjeta">' +
    '<h3>' + esc(m.id) + ' · ' + esc(m.descripcion) + '</h3>' +
    '<p class="tenue">' + esc(f ? f.descripcion : "") + ' → ' +
    esc(ff ? ff.descripcion : "") + '</p>' +
    (m.evidente
      ? '<span class="chip">pérdida evidente</span>'
      : '<span class="chip obs">falla oculta</span>') +
    (m.estado === "validado" ? '<span class="chip ok">validado</span>'
                             : '<span class="chip">' + esc(m.estado) + '</span>') +
    (m.consecuencias || []).map(function (c) {
      var clase = typeof c === "string" ? c : c.clase;
      return '<span class="chip ' +
        (CONSECUENCIAS_GRAVES.indexOf(clase) >= 0 ? 'grave' : '') + '">' +
        esc(clase) + '</span>';
    }).join("") +
    (!m.evidente
      ? '<div class="aviso nota" style="margin-top:10px">Una falla oculta por ' +
        'sí sola no produce efecto: la máquina sigue trabajando igual. Lo que ' +
        'produce es que, cuando ocurra la segunda falla, no haya nada que la ' +
        'detenga. El riesgo que se trata aquí es la <b>falla múltiple</b>, y ' +
        'por eso esta pregunta va antes que todas las demás.</div>'
      : '') +
    campo("Ubicación", [(m.ubicacion || {}).sistema, (m.ubicacion || {}).subsistema,
                        (m.ubicacion || {}).componente].filter(Boolean).join(" · ")) +
    campo("Código de catálogo", m.codigo_catalogo, "sin codificar (ISO 14224)") +
    campo("Causa", m.causa, heredado(m)) +
    campo("Mecanismo", m.mecanismo, heredado(m)) +
    campo("Efecto local", u.local,
          "sin describir — es la Q4, y sin ella no se puede juzgar la consecuencia") +
    campo("Lo que observa el operador", u.observa_operador) +
    campo("Parámetro", u.parametro) +
    campo("Alarma o código", u.alarma) +
    campo("Componente afectado", u.componente_afectado) +
    campo("Cómo confirmarlo", u.como_detectarlo) +
    criticidad(m) + evidencia(m) + anomaliasDelModo(m) +
    '</div>';
  return html + decisionPanel(m);
}

/** Causa y mecanismo en blanco no significan lo mismo con código que sin él.
 *
 * Cuando el modo declara un código de catálogo, la oficina los hereda de ahí
 * —lo hace `ModoFalla.desde_catalogo()`—, así que decir aquí «sin declarar»
 * haría ver como un hueco algo que el archivo sí tiene. El catálogo no está
 * en esta pantalla a propósito: son 41 entradas con sus pistas, y ya hay una
 * copia en la app de diagnóstico.
 */
function heredado(m) {
  return m.codigo_catalogo
    ? "lo hereda del catálogo ISO 14224 en la oficina"
    : "sin declarar";
}

function criticidad(m) {
  if (!m.criticidad) {
    return campo("Criticidad", "", "no evaluada — que no es lo mismo que cero");
  }
  var pares = Object.keys(m.criticidad).map(function (k) {
    return k + " " + m.criticidad[k]; }).join(" · ");
  var metodo = analisis.metodo_criticidad || "";
  var html = campo("Criticidad declarada", pares) +
    campo("Método", metodo, "sin método declarado: la criticidad queda sin evaluar") +
    '<p class="tenue" style="margin:6px 0 0">Los valores se muestran tal como ' +
    'los declara el archivo. La evaluación la hace el lado de la oficina, con ' +
    'el método configurado de la planta.</p>';
  if (/RPN/i.test(metodo)) {
    html += '<div class="aviso">' + esc(ADVERTENCIA_RPN) + '</div>';
  }
  return html;
}

function evidencia(m) {
  if (!(m.evidencia || []).length) {
    return campo("Evidencia", "",
      "sin evidencia: el modo no puede marcarse validado, y queda como propuesto");
  }
  return '<div class="campo"><span>Evidencia</span><span><ul class="lista">' +
    m.evidencia.map(function (r) {
      return '<li><b>' + esc(r.fuente) + '</b>' +
        (r.referencia ? ' · ' + esc(r.referencia) : '') +
        (r.nota ? ' — ' + esc(r.nota) : '') + '</li>';
    }).join("") + '</ul></span></div>';
}

function decisionPanel(m) {
  var d = decisiones[m.id];
  var r = respuestasPorModo[m.id] || respuestas(null);
  var html = '<h2>Árbol de decisión</h2>';

  if (d) {
    var clase = d.bloqueado_por_seguridad ? 'bloqueada'
              : PROACTIVAS.indexOf(d.estrategia) >= 0 ? 'proactiva'
              : d.por_defecto ? 'defecto' : '';
    html += '<div class="dictamen ' + clase + '">' +
      '<div class="estrategia">' + esc(d.rotulo) + '</div>' +
      '<div style="margin:6px 0 0">' +
      (PROACTIVAS.indexOf(d.estrategia) >= 0
        ? '<span class="chip ok">tarea proactiva</span>' : '') +
      (d.por_defecto ? '<span class="chip obs">acción por defecto (Q7)</span>' : '') +
      (d.bloqueado_por_seguridad
        ? '<span class="chip grave">rediseño obligatorio</span>' : '') +
      (d.incompleta ? '<span class="chip obs">decisión incompleta</span>' : '') +
      '</div>' +
      (d.incompleta
        ? '<p class="tenue" style="margin:8px 0 0">Queda incompleta mientras ' +
          'alguna pregunta esté sin evaluar, incluso una que este modo no use: ' +
          'el criterio es conservador a propósito. «No lo miramos» no se ' +
          'cuenta como mirado.</p>'
        : '') +
      '<p style="margin:10px 0 0">' + esc(d.motivo) + '</p>' +
      '<ol class="camino">' + d.camino.map(function (p) {
        return '<li><b>' + esc(p.pregunta) + '</b> → <span class="resp">' +
          esc(p.respuesta) + '</span><br><span class="tenue">' +
          esc(p.consecuencia) + '</span></li>';
      }).join("") + '</ol>' +
      d.avisos.map(function (a) {
        return '<div class="aviso">' + esc(a) + '</div>'; }).join("") +
      '</div>';
  } else {
    html += '<div class="aviso">Este modo de falla no tiene decisión ' +
      'registrada. La Q6 lo cuenta como pendiente, y eso es lo correcto: una ' +
      'decisión que nadie tomó no se rellena con la opción conservadora para ' +
      'que el análisis parezca completo.</div>';
  }

  html += '<div class="tarjeta">';
  ORDEN.forEach(function (k) {
    var et = ETIQUETAS[k];
    var pertinente = k !== "probable" ? m.evidente : !m.evidente;
    html += '<div class="pregunta"' +
      (pertinente ? '' : ' style="opacity:.55"') + '>' +
      '<div><b>' + esc(et[0]) + '</b>' +
      (usada(k, d) ? ' <span class="chip acento">la usó el árbol</span>' : '') +
      (pertinente ? '' : ' <span class="chip">no aplica a este modo</span>') +
      '<span class="tenue" style="display:block">' + esc(et[1]) + '</span></div>' +
      '<div class="opciones">' +
      ['si', 'no', 'nd'].map(function (op) {
        var val = op === 'si' ? true : op === 'no' ? false : null;
        var puesto = r[k] === val;
        return '<button class="op-' + op + '" data-campo="' + k +
          '" data-valor="' + op + '" aria-pressed="' + (puesto ? 'true' : 'false') +
          '">' + (op === 'si' ? 'Sí' : op === 'no' ? 'No' : 'Sin evaluar') +
          '</button>';
      }).join("") + '</div>' +
      (k === "intervalo_edad" && r[k] === false
        ? '<div class="aviso" style="margin-top:8px">' + esc(AVISO_89) + '</div>'
        : '') +
      '</div>';
  });
  html += '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">' +
    '<button id="quitar">Quitar la decisión de este modo</button></div>' +
    '<p class="tenue" style="margin:8px 0 0">Quitarla no es lo mismo que ' +
    'dejar todo «sin evaluar»: deja el modo sin decisión, y la Q6 vuelve a ' +
    'contarlo como pendiente.</p></div>';
  return html;
}

// ------------------------------------------------ la evidencia de campo

var _entradaRonda = null;

/** La entrada de archivo de la ronda, una sola para toda la sesión.
 *  La pantalla se repinta entera a cada respuesta del árbol; crearla en cada
 *  repintado dejaba una colgando del documento por cada clic. */
function entradaRonda() {
  if (_entradaRonda) return _entradaRonda;
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.className = "oculto"; inp.id = "entrada-ronda";
  document.body.appendChild(inp);
  inp.onchange = function () {
    var f = inp.files && inp.files[0];
    if (!f) return;
    var lector = new FileReader();
    lector.onload = function () {
      var r;
      try { r = abrirRonda(JSON.parse(lector.result)); }
      catch (e) { r = { error: "Ese archivo no es una ronda legible: " + e.message }; }
      inp.value = "";          // el mismo archivo se puede volver a abrir
      render();
      if (r.error) {
        var caja = document.getElementById("abrir-ronda");
        if (caja) caja.insertAdjacentHTML("afterend",
          '<div class="aviso peligro">' + esc(r.error) + '</div>');
      }
    };
    lector.readAsText(f);
  };
  _entradaRonda = inp;
  return inp;
}

/** La ronda que hizo el operador, puesta encima del análisis.
 *
 * Es el circuito que justifica todo lo demás: el operador ve algo en el
 * turno, la oficina abre el análisis y ve **en qué modo de falla** cayó eso
 * que vio. Sin esto, la ronda es una lista de hallazgos y el análisis es un
 * documento, y nadie los cruza nunca.
 *
 * El enganche es el mismo que hace la oficina —código exacto y mismo
 * activo—, y lo que no engancha se muestra con el motivo, no se esconde.
 */
function abrirRonda(datos) {
  var lista = (datos && datos.anomalias) || [];
  if (!lista.length) {
    return { error: "Ese archivo no trae anomalías. Una ronda sin hallazgos " +
                    "no tiene nada que cruzar con el análisis — lo cual, " +
                    "dicho sea de paso, es una buena noticia." };
  }
  ronda = datos;
  porModo = {}; sueltas = [];
  lista.forEach(function (a) {
    var enlace = enlazarAnomalia(a, analisis);
    if (enlace.modo_falla_id && modo(enlace.modo_falla_id)) {
      if (!porModo[enlace.modo_falla_id]) porModo[enlace.modo_falla_id] = [];
      porModo[enlace.modo_falla_id].push({ a: a, motivo: enlace.motivo });
    } else {
      sueltas.push({ a: a, motivo: enlace.modo_falla_id
        ? "declara el modo " + enlace.modo_falla_id + ", que no está en este análisis"
        : enlace.motivo });
    }
  });
  return { error: "" };
}

function anomaliasDelModo(m) {
  var lista = porModo[m.id];
  if (!lista) return "";
  return '<div class="campo"><span>Visto en campo</span><span>' +
    lista.map(function (x) {
      return '<div class="hallazgo"><b>' + esc(x.a.descripcion) + '</b>' +
        '<span class="tenue"> · ' + esc(x.a.detectada_por || "sin firmar") +
        ' · ' + esc(x.a.fecha || "sin fecha") + '</span>' +
        (x.a.condicion_observada
          ? '<div class="tenue">criterio: ' + esc(x.a.condicion_observada) + '</div>'
          : '') +
        '<div class="tenue">enganchado ' + esc(x.motivo) + '</div></div>';
    }).join("") + '</span></div>';
}

function evidencia_campo() {
  var html = '<h2>Evidencia de campo · ronda CIL</h2><div class="tarjeta">';
  if (!ronda) {
    html += '<button id="abrir-ronda">Abrir una ronda del operador (.json)</button>' +
      '<p class="tenue" style="margin:10px 0 0">El archivo que sale del ' +
      'teléfono al terminar la ronda. Se cruza con este análisis y se ve en ' +
      'qué modo de falla cayó lo que el operador encontró. No se sube a ' +
      'ninguna parte y no se guarda dentro del análisis: la ronda sigue ' +
      'siendo la ronda.</p></div>';
    return html;
  }
  var e = ronda.ejecucion || {};
  var mismoActivo = !e.activo_codigo ||
                    e.activo_codigo === analisis.activo.codigo;
  var enganchadas = 0;
  Object.keys(porModo).forEach(function (k) { enganchadas += porModo[k].length; });

  html += '<div class="lb">' + esc(e.activo_codigo || "activo sin declarar") +
    ' · ' + esc(e.operador || "sin firmar") + ' · ' + esc(e.fecha || "sin fecha") +
    '</div>' +
    '<div class="numeros" style="margin-top:10px">' +
    '<div><span class="lb">Hallazgos</span><b>' +
    (enganchadas + sueltas.length) + '</b></div>' +
    '<div><span class="lb">En un modo</span><b>' + enganchadas + '</b></div>' +
    '<div><span class="lb">Sin enganchar</span><b>' + sueltas.length + '</b></div>' +
    '</div>';

  if (!mismoActivo) {
    html += '<div class="aviso peligro">La ronda es de <b>' +
      esc(e.activo_codigo) + '</b> y este análisis es de <b>' +
      esc(analisis.activo.codigo) + '</b>. No se engancha nada: una anomalía ' +
      'puesta en el modo de otra máquina ensucia las dos.</div>';
  }
  if (ronda.estado && ronda.estado.completa === false) {
    html += '<div class="aviso">La ronda llegó <b>incompleta</b>: ' +
      (ronda.estado.sin_acceso || 0) + ' punto(s) no se pudieron ver. Lo que ' +
      'no se vio no dice nada del modo de falla, ni a favor ni en contra.</div>';
  }
  if (ronda.estado && ronda.estado.sospechosa_de_firma) {
    html += '<div class="aviso peligro">La ronda se marcó <b>demasiado ' +
      'rápida</b> para haber sido ejecutada. Antes de usarla como evidencia, ' +
      'conviene mirarla.</div>';
  }

  if (sueltas.length) {
    html += '<h3 style="margin-top:14px">No engancharon, y por qué</h3>' +
      '<table><tr><th>Hallazgo</th><th>Motivo</th></tr>' +
      sueltas.map(function (x) {
        return '<tr><td><b>' + esc(x.a.componente || "") + '</b><br>' +
          esc(x.a.descripcion) + '</td><td>' + esc(x.motivo) + '</td></tr>';
      }).join("") + '</table>' +
      '<p class="tenue" style="margin:10px 0 0">Deducir el código desde el ' +
      'texto libre es trabajo del catálogo ISO 14224, y lo hace ' +
      '<code>fixmate tpm anomalias</code>. Esta pantalla no lo trae: ' +
      'enganchar al modo «más parecido» es como se contamina la frecuencia ' +
      'por modo.</p>';
  } else {
    html += '<p class="tenue" style="margin:10px 0 0">Todos los hallazgos ' +
      'cayeron en un modo de falla del análisis.</p>';
  }

  html += '<div style="margin-top:12px"><button id="quitar-ronda">' +
    'Quitar esta ronda</button></div>';
  return html + '</div>';
}

// ------------------------------------------------------------- el tablero

function tablero(r) {
  var html = '<h2>Tablero del análisis</h2><div class="tarjeta">' +
    '<div class="numeros">' +
    '<div><span class="lb">Modos</span><b>' + r.modos + '</b></div>' +
    '<div><span class="lb">Decididos</span><b>' + r.decididos + '</b></div>' +
    '<div><span class="lb">Graves</span><b>' + r.graves + '</b></div>' +
    '<div><span class="lb">Ocultos</span><b>' + r.ocultos + '</b></div>' +
    '<div><span class="lb">Rediseños obligatorios</span><b>' +
    r["rediseños_obligatorios"] + '</b></div>' +
    '<div><span class="lb">Decisiones incompletas</span><b>' +
    r["decisiones_incompletas"] + '</b></div>' +
    '</div><table style="margin-top:14px"><tr><th>Estrategia</th>' +
    '<th>Modos</th><th></th></tr>';
  Object.keys(ESTRATEGIAS).forEach(function (k) {
    html += '<tr><td>' + esc(ESTRATEGIAS[k]) + '</td><td><b>' + r.reparto[k] +
      '</b></td><td>' +
      (PROACTIVAS.indexOf(k) >= 0 ? '<span class="chip ok">proactiva</span>' : '') +
      (POR_DEFECTO.indexOf(k) >= 0
        ? '<span class="chip obs">acción por defecto</span>' : '') +
      '</td></tr>';
  });
  html += '</table>';
  if (r["decisiones_incompletas"]) {
    html += '<div class="aviso">' + r["decisiones_incompletas"] + ' decisión(es) ' +
      'salieron con preguntas sin evaluar. Están del lado conservador, pero no ' +
      'están terminadas.</div>';
  }
  if (r["rediseños_obligatorios"]) {
    html += '<div class="aviso peligro">' + r["rediseños_obligatorios"] +
      ' modo(s) de falla quedaron en rediseño obligatorio: ninguna tarea ' +
      'proactiva reduce el riesgo y la consecuencia es de seguridad o ' +
      'ambiental. «Operar hasta la falla» no es una salida legal ahí.</div>';
  }
  return html + '</div>';
}

function resumenEnPantalla() {
  var html = '<h2>Resumen por modo</h2><div class="tarjeta"><table>' +
    '<tr><th>Modo</th><th>Falla funcional</th><th>Evidente</th>' +
    '<th>Consecuencia</th><th>Criticidad</th><th>Estrategia</th></tr>';
  analisis.modos.forEach(function (m) {
    var d = decisiones[m.id];
    var ff = fallaDe(m);
    var crit = m.criticidad
      ? Object.keys(m.criticidad).map(function (k) {
          return k[0].toUpperCase() + m.criticidad[k]; }).join(" ")
      : "";
    html += '<tr' + (esGrave(m) ? ' class="grave"' : '') + '>' +
      '<td><b>' + esc(m.id) + '</b><br>' + esc(m.descripcion) + '</td>' +
      '<td>' + esc(ff ? ff.descripcion : "") + '</td>' +
      '<td>' + (m.evidente ? 'sí' : '<b>oculta</b>') + '</td>' +
      '<td>' + (m.consecuencias || []).map(function (c) {
        return esc(typeof c === "string" ? c : c.clase); }).join(", ") + '</td>' +
      '<td>' + (crit ? esc(crit) : '<span class="vacio">no evaluada</span>') + '</td>' +
      '<td>' + (d ? esc(d.rotulo) +
        (d.bloqueado_por_seguridad ? ' <span class="chip grave">obligatorio</span>' : '')
        : '<span class="vacio">sin decidir</span>') + '</td></tr>';
  });
  return html + '</table>' +
    '<p class="tenue" style="margin:10px 0 0">Esto es un resumen para mirar. ' +
    'La matriz FMECA que se entrega tiene treinta columnas y sale de ' +
    '<code>fixmate rcm matriz</code> sobre el archivo exportado.</p></div>';
}

// -------------------------------------------------------------- la salida

/** El archivo exportado es el MISMO que se abrió, con las decisiones puestas
 *  dentro de cada modo. Así vuelve a entrar por `cargador.analisis()` y por
 *  `fixmate rcm analizar` sin convertir nada, y los ids se reconstruyen por
 *  posición igual que aquí. */
function exportar() {
  var copia = JSON.parse(JSON.stringify(crudo));
  var i = 0;
  (copia.funciones || []).forEach(function (fd) {
    (fd.fallas || []).forEach(function (ffd) {
      (ffd.modos || []).forEach(function (md) {
        var m = analisis.modos[i]; i += 1;
        if (!m) return;
        if (decisiones[m.id]) {
          var r = respuestasPorModo[m.id];
          var fuera = {};
          CAMPOS_DECISION.forEach(function (k) { fuera[k] = r[k]; });
          md.decision = fuera;
        } else if (md.decision) {
          delete md.decision;
        }
      });
    });
  });
  return copia;
}

function salida() {
  return '<h2>Guardar</h2><div class="tarjeta">' +
    '<button id="bajar" class="primary">Guardar el análisis con sus decisiones</button>' +
    '<p class="tenue" style="margin:10px 0 0">Un <code>.json</code> con las ' +
    'respuestas del árbol dentro de cada modo. Vuelve a entrar por ' +
    '<code>fixmate rcm analizar</code>, <code>fixmate rcm tareas</code> y ' +
    '<code>fixmate rcm matriz</code> sin convertir nada.</p>' +
    '<div style="margin-top:12px"><button id="otro">Abrir otro análisis</button></div>' +
    '</div>';
}

// ------------------------------------------------------------- conexiones

function conectar() {
  Array.prototype.forEach.call(app.querySelectorAll("button[data-modo]"), function (b) {
    b.onclick = function () { seleccion = b.getAttribute("data-modo"); render(); };
  });
  Array.prototype.forEach.call(app.querySelectorAll("button[data-campo]"), function (b) {
    b.onclick = function () {
      var k = b.getAttribute("data-campo"), v = b.getAttribute("data-valor");
      var m = modo(seleccion);
      respuestasPorModo[m.id][k] = v === "si" ? true : v === "no" ? false : null;
      decisiones[m.id] = decidir(m, respuestasPorModo[m.id]);
      render();
    };
  });
  var quitar = document.getElementById("quitar");
  if (quitar) {
    quitar.onclick = function () {
      delete decisiones[seleccion];
      respuestasPorModo[seleccion] = respuestas(null);
      render();
    };
  }
  var abrirR = document.getElementById("abrir-ronda");
  if (abrirR) abrirR.onclick = function () { entradaRonda().click(); };
  var quitarR = document.getElementById("quitar-ronda");
  if (quitarR) {
    quitarR.onclick = function () {
      ronda = null; porModo = {}; sueltas = []; render();
    };
  }
  var otro = document.getElementById("otro");
  if (otro) otro.onclick = function () { verInicio(); };
  var bajar = document.getElementById("bajar");
  if (bajar) {
    bajar.onclick = function () {
      var blob = new Blob([JSON.stringify(exportar(), null, 2)],
                          { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "analisis-" + (analisis.activo.codigo || "rcm") + ".json";
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
  }
}

verInicio();
</script>
