<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 780" width="840" height="780" font-family="Arial">
<title>Transferencia automatica (TTA) — Ejemplo 3 x CAT C15 con DSE 8610 MKII (ficticio)</title>

  <style>
    .fondo { fill: #ffffff; }
    .pot { stroke: #1f2937; stroke-width: 3; fill: none; }
    .ctl { stroke: #2563eb; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; }
    .com { stroke: #059669; stroke-width: 2; fill: none; stroke-dasharray: 2 3; }
    .med { stroke: #b45309; stroke-width: 1.6; fill: none; }
    .caja { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
    .mod { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
    .gen { fill: #fefce8; stroke: #854d0e; stroke-width: 2; }
    .red { fill: #f0fdf4; stroke: #166534; stroke-width: 2; }
    text { font-family: Arial, Helvetica, sans-serif; fill: #111827; }
    .t { font-size: 13px; font-weight: bold; }
    .s { font-size: 10.5px; }
    .r { font-size: 9.5px; fill: #475569; }
    .titulo { font-size: 18px; font-weight: bold; }
  </style>

<rect width="100%" height="100%" class="fondo"/>
<text x="20" y="32" class="titulo" text-anchor="start">Transferencia automatica (TTA) — Ejemplo 3 x CAT C15 con DSE 8610 MKII (ficticio)</text>
<rect x="150" y="60" width="100" height="44" rx="6" class="red"/>
<text x="200" y="80" class="t" text-anchor="middle">RED</text>
<text x="200" y="96" class="r" text-anchor="middle">380 V 60 Hz</text>
<line x1="200" y1="104" x2="200" y2="150" class="pot"/>
<circle cx="640" cy="90" r="30" class="gen"/>
<text x="640" y="95" class="t" text-anchor="middle">G</text>
<text x="640" y="138" class="t" text-anchor="middle">GE-01</text>
<text x="640" y="152" class="r" text-anchor="middle">CAT</text>
<line x1="640" y1="120" x2="640" y2="150" class="pot"/>
<line x1="200" y1="150" x2="200" y2="160" class="pot"/>
<circle cx="200" cy="160" r="2.5" fill="#1f2937"/>
<line x1="200" y1="160" x2="212" y2="180" class="pot"/>
<circle cx="200" cy="180" r="2.5" fill="#1f2937"/>
<line x1="200" y1="180" x2="200" y2="190" class="pot"/>
<text x="220" y="175" class="s" text-anchor="start">KM1 red</text>
<line x1="640" y1="150" x2="640" y2="160" class="pot"/>
<circle cx="640" cy="160" r="2.5" fill="#1f2937"/>
<line x1="640" y1="160" x2="652" y2="180" class="pot"/>
<circle cx="640" cy="180" r="2.5" fill="#1f2937"/>
<line x1="640" y1="180" x2="640" y2="190" class="pot"/>
<text x="622" y="175" class="s" text-anchor="end">KM2 grupo</text>
<text x="420" y="200" class="r" text-anchor="middle">enclavamiento mecanico + electrico (4 polos)</text>
<path d="M225,206 L615,206" class="ctl"/>
<path d="M200,190 L200,240 L640,240 L640,190" class="pot"/>
<line x1="420" y1="240" x2="420" y2="290" class="pot"/>
<circle cx="414" cy="262" r="6" class="med"/>
<circle cx="426" cy="262" r="6" class="med"/>
<text x="438" y="266" class="r" text-anchor="start"></text>
<text x="402" y="266" class="r" text-anchor="end">TC carga</text>
<rect x="360" y="290" width="120" height="36" rx="6" class="caja"/>
<text x="420" y="312" class="t" text-anchor="middle">CARGA</text>
<rect x="280" y="380" width="280" height="120" rx="6" class="mod"/>
<text x="420" y="402" class="t" text-anchor="middle">DSE7320 MKII (AMF / TTA)</text>
<text x="420" y="420" class="r" text-anchor="middle">control del grupo + transferencia</text>
<path d="M200,135 L120,135 L120,410 L280,410" class="med"/>
<text x="124" y="300" class="r" text-anchor="start">Sensado red L1-L2-L3-N</text>
<text x="124" y="312" class="r" text-anchor="start">borne: 057-253</text>
<path d="M640,135 L720,135 L720,410 L560,410" class="med"/>
<text x="716" y="300" class="r" text-anchor="end">Sensado grupo L1-L2-L3-N</text>
<text x="716" y="312" class="r" text-anchor="end">borne: 057-253</text>
<path d="M438,262 L530,262 L530,380" class="med"/>
<text x="534" y="350" class="r" text-anchor="start">borne: 057-253</text>
<path d="M310,500 L310,540 L160,540 L160,170 L198,170" class="ctl"/>
<text x="164" y="534" class="r" text-anchor="start">Salida «cerrar red» -&gt; rele interpuesto -&gt; bobina KM1</text>
<text x="164" y="556" class="r" text-anchor="start">borne: 057-253</text>
<path d="M530,500 L530,540 L680,540 L680,170 L642,170" class="ctl"/>
<text x="676" y="534" class="r" text-anchor="end">Salida «cerrar grupo» -&gt; bobina KM2</text>
<text x="676" y="556" class="r" text-anchor="end">borne: 057-253</text>
<path d="M420,500 L420,590 L760,590 L760,90 L672,90" class="com"/>
<text x="426" y="584" class="r" text-anchor="start">Arranque / combustible y J1939 al ECM CAT</text>
<rect x="40" y="620" width="760" height="110" rx="6" class="caja"/>
<text x="50" y="640" class="t" text-anchor="start">Circuito de mando — reglas que el cableado debe cumplir</text>
<text x="50" y="660" class="r" text-anchor="start">1. Bobina KM1 en serie con contacto NC auxiliar de KM2, y bobina KM2 en serie con NC de KM1 (enclavamiento electrico).</text>
<text x="50" y="674" class="r" text-anchor="start">2. Enclavamiento mecanico entre KM1 y KM2: el electrico solo no basta (soldadura de contactos).</text>
<text x="50" y="688" class="r" text-anchor="start">3. Tiempo muerto de transferencia configurado en el modulo: ninguna conexion red-grupo en paralelo, ni un instante.</text>
<text x="50" y="702" class="r" text-anchor="start">4. 4 polos: el neutro se conmuta (cargas con neutro aterrado en el grupo); revisar el esquema de tierra.</text>
<text x="50" y="716" class="r" text-anchor="start">5. Mando de bobinas por rele interpuesto si su corriente supera la de la salida del modulo.</text>
<line x1="20" y1="744" x2="60" y2="744" class="pot"/>
<text x="66" y="748" class="r" text-anchor="start">Potencia 3F+N</text>
<line x1="170" y1="744" x2="210" y2="744" class="med"/>
<text x="216" y="748" class="r" text-anchor="start">Medicion (TP/TC)</text>
<line x1="330" y1="744" x2="370" y2="744" class="ctl"/>
<text x="376" y="748" class="r" text-anchor="start">Mando / señal</text>
<line x1="470" y1="744" x2="510" y2="744" class="com"/>
<text x="516" y="748" class="r" text-anchor="start">Comunicacion</text>
<text x="20" y="768" class="r" text-anchor="start">Diagrama de arquitectura generado por nefer sincronismo. Los bornes y calibres se verifican contra el manual del modulo y el plano del tablero antes de cablear.</text>
</svg>
