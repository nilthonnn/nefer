<text x="140" y="600" class="r" text-anchor="start">Enlace MSC (reparto de kW/kVAr entre modulos): en cadena, malla aterrada en un extremo, terminacion en los dos extremos segun el manual.</text>
<rect x="20" y="622" width="1160" height="100" rx="6" class="caja"/>
<text x="30" y="642" class="t" text-anchor="start">Verificaciones de cableado antes del primer cierre</text>
<text x="30" y="662" class="r" text-anchor="start">1. V barra se toma DESPUES del interruptor (lado barra); V gen ANTES. Invertirlos permite cerrar fuera de fase.</text>
<text x="30" y="676" class="r" text-anchor="start">2. Misma fase de referencia en V gen y V barra de todas las unidades; verificar con sincronoscopio externo en el primer cierre.</text>
<text x="30" y="690" class="r" text-anchor="start">3. TC en el lado generador del interruptor, con la relacion y polaridad declaradas en el modulo (kW negativos = polaridad).</text>
<text x="30" y="704" class="r" text-anchor="start">4. Contacto auxiliar 52a de cada interruptor al modulo: sin el, el modulo no sabe que cerro.</text>
<text x="30" y="718" class="r" text-anchor="start">5. Interruptor que abre por falta de tension de mando (bobina de minima o logica equivalente).</text>
<line x1="20" y1="746" x2="60" y2="746" class="pot"/>
<text x="66" y="750" class="r" text-anchor="start">Potencia 3F+N</text>
<line x1="170" y1="746" x2="210" y2="746" class="med"/>
<text x="216" y="750" class="r" text-anchor="start">Medicion (TP/TC)</text>
<line x1="330" y1="746" x2="370" y2="746" class="ctl"/>
<text x="376" y="750" class="r" text-anchor="start">Mando / señal</text>
<line x1="470" y1="746" x2="510" y2="746" class="com"/>
<text x="516" y="750" class="r" text-anchor="start">Comunicacion</text>
<text x="20" y="770" class="r" text-anchor="start">Diagrama de arquitectura generado por nefer sincronismo. Los bornes y calibres se verifican contra el manual del modulo y el plano del tablero antes de cablear.</text>
