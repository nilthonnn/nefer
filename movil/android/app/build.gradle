plugins {
    id 'com.android.application'
}

// La app web es la fuente y el APK sólo la transporta. Se copia a los assets
// antes de compilar para que un APK no pueda salir con una versión vieja
// dentro: el día que eso pase, nadie lo va a notar hasta el camal.
def appWeb = rootProject.file("../../docs/camal")

// La versión la pone quien compila: en CI, el número de ejecución, para que
// dos APK distintos nunca digan ser el mismo.
def codigo = (project.findProperty('codigoVersion') ?: '30') as Integer
def nombre = project.findProperty('nombreVersion') ?: '3.0'

// La llave llega por propiedades, nunca versionada. Sin ella se compila igual
// —Gradle firma con la de depuración— pero entonces una versión nueva no se
// puede instalar encima de la anterior sin desinstalarla antes.
def almacen = project.findProperty('almacenLlaves')

android {
    namespace 'pe.camal.pesaje'
    compileSdk 34

    defaultConfig {
        applicationId 'pe.camal.pesaje'
        minSdk 24          // Android 7, de 2016: cubre prácticamente todo lo que hay en uso
        targetSdk 34
        versionCode codigo
        versionName nombre
    }

    if (almacen) {
        signingConfigs {
            propia {
                storeFile file(almacen)
                storePassword project.findProperty('claveAlmacen')
                keyAlias project.findProperty('aliasLlave')
                keyPassword project.findProperty('claveLlave')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (almacen) {
                signingConfig signingConfigs.propia
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // El nombre del archivo dice qué es y qué versión, para no acabar con
    // cinco «app-debug.apk» en la carpeta de descargas.
    applicationVariants.configureEach { variante ->
        variante.outputs.configureEach {
            outputFileName = "camal-pesaje-${variante.versionName}-${variante.buildType.name}.apk"
        }
    }
}

dependencies {
    // Para servir los assets por https en vez de file://, que es lo que hace
    // que localStorage sea estable. Nada más.
    implementation 'androidx.webkit:webkit:1.11.0'
}

tasks.register('copiarAppWeb', Copy) {
    description = 'Trae la app web desde docs/camal a los assets del APK.'
    from(appWeb) {
        exclude 'qr.svg'          // el QR es de la página, no de la app
    }
    into layout.projectDirectory.dir('src/main/assets/www')
    doFirst {
        if (!appWeb.exists()) {
            throw new GradleException("No está ${appWeb}: corre antes python3 demos/camal/construir.py")
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'copiarAppWeb'
}
