[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nefer"
version = "1.0.0"
description = "Automatiza el reporte fotográfico de despacho y recepción de maquinaria."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
# FastAPI y httpx entran en 'dev' a proposito: sin ellos las pruebas de la API
# de FixMate se saltan solas y la comprobacion sale verde sin haber probado la
# API, que es peor que un rojo.
dev = ["pytest>=7.4", "fastapi>=0.110", "httpx>=0.27"]

# FixMate, el asistente de diagnostico. El motor y el indice son de biblioteca
# estandar; esto es lo que hace falta solo para servirlo o para salir a un
# servicio.
fixmate-api = ["fastapi>=0.110", "uvicorn>=0.27"]
fixmate-openai = ["openai>=1.30"]
fixmate-pg = ["psycopg2-binary>=2.9"]
# Las pruebas de la aplicacion de campo conducen un navegador de verdad.
# Sin esto se saltan solas y el resto de la suite pasa igual.
navegador = ["pytest>=7.4", "playwright>=1.40"]

[project.scripts]
nefer = "nefer.cli:main"

[tool.setuptools]
packages = ["nefer", "nefer.fixmate"]


[tool.pytest.ini_options]
testpaths = ["tests"]
