name: apk

# Compila la app del camal en un APK instalable y lo deja para descargar.
#
# Se hace aquí y no en la máquina de nadie porque el SDK de Android son varios
# cientos de megas y una versión distinta del SDK da un APK distinto: el
# runner trae el mismo siempre, así que el archivo es reproducible.

on:
  push:
    paths:
      - 'movil/android/**'
      - 'docs/camal/**'
      - 'demos/camal/app-camal.cuerpo.html'
      - 'demos/camal/construir.py'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Lo publicado y lo generado tienen que ser lo mismo. Si alguien editó a
      # mano `docs/camal/index.html` —que se genera— el APK llevaría una app
      # distinta de la del sitio, y eso no se vería hasta el camal.
      - name: La app web está al día
        run: |
          python3 demos/camal/construir.py
          if ! git diff --quiet -- docs/camal demos/camal; then
            echo "::error::docs/camal no coincide con app-camal.cuerpo.html. Corre python3 demos/camal/construir.py y vuelve a subir."
            git --no-pager diff --stat -- docs/camal demos/camal
            exit 1
          fi

      - name: Piezas del SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Compilar
        working-directory: movil/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Qué salió
        id: apk
        run: |
          RUTA=$(find movil/android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"
          echo "nombre=$(basename "$RUTA")" >> "$GITHUB_OUTPUT"
          {
            echo "## APK listo"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Archivo | \`$(basename "$RUTA")\` |"
            echo "| Tamaño | $(du -h "$RUTA" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$RUTA" | cut -d' ' -f1)\` |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo ""
            echo "Se descarga del apartado **Artifacts**, aquí abajo."
          } >> "$GITHUB_STEP_SUMMARY"

      # El APK va firmado con la clave de depuración, que es lo que permite
      # instalarlo de costado. Para subirlo a Play haría falta una clave propia;
      # está explicado en movil/LEEME.md.
      - name: Dejarlo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: camal-pesaje-apk
          path: ${{ steps.apk.outputs.ruta }}
          retention-days: 90
          if-no-files-found: error
