name: apk de la ronda CIL

# El .apk de la ronda CIL de FixMate. Se compila aquí y no en la máquina de
# nadie: el SDK de Android son cientos de megas, y una compilación a mano es
# una compilación que sólo sabe hacer una persona.
#
# Va aparte de `apk.yml` —las actas de RD RENTAL— y de `apk-camal.yml` a
# propósito: son tres aplicaciones distintas, con su identificador, su llave y
# su versión, y compartir archivo de flujo sólo serviría para que un cambio en
# una rompiera las otras.

on:
  push:
    branches: ["**"]
    paths:
      - "movil/fixmate-ronda/**"
      - "docs/fixmate/ronda/**"
      - "herramientas/ronda/**"
      - "herramientas/piel/**"
      - "herramientas/espejo-ronda.py"
      - ".github/workflows/apk-fixmate.yml"
  workflow_dispatch:

concurrency:
  group: apk-fixmate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # El nombre con el que se descarga. No cambia nunca: la dirección de
  # descarga y el QR impreso dependen de él.
  ARCHIVO: fixmate-ronda.apk

jobs:
  apk:
    name: compilar, comprobar y publicar el .apk
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Lo publicado y lo generado tienen que ser lo mismo. Si alguien editó a
      # mano `docs/fixmate/ronda/index.html` —que se genera—, el .apk llevaría
      # una pantalla distinta de la del sitio, y eso no se ve hasta el socavón.
      - name: La pantalla está al día
        run: |
          set -euo pipefail
          python3 herramientas/espejo-ronda.py
          if ! git diff --quiet -- docs/fixmate/ronda; then
            echo "::error::docs/fixmate/ronda no está al día. Corre python3 herramientas/espejo-ronda.py y vuelve a subir."
            git --no-pager diff --stat -- docs/fixmate/ronda
            exit 1
          fi

      # El puente es lo único que el APK aporta sobre la pantalla web, y es
      # donde un byte mal codificado dejaría al operador con un botón que no
      # guarda nada. Se comprueba antes de compilar: un APK que no se puede
      # creer no vale la pena compilarlo.
      - name: El puente, antes de envolverlo
        run: |
          set -euo pipefail
          pip install -e ".[navegador]"
          python -m playwright install --with-deps chromium
          python -m pytest -q -rs tests/test_android_fixmate.py | tee salida.txt
          if grep -qE '[0-9]+ skipped' salida.txt; then
            echo "::error::alguna prueba del puente se saltó; aquí eso cuenta como fallo"
            exit 1
          fi

      # La imagen del runner ya trae el SDK. La acción `setup-android` no se usa
      # porque intenta instalar el paquete `tools`, que Google retiró, y se cae
      # antes de empezar. La carpeta de las herramientas cambia de nombre entre
      # versiones de la imagen: se busca en vez de adivinarla.
      - name: SDK de Android
        run: |
          set -euo pipefail
          raiz="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$raiz" >> "$GITHUB_ENV"
          gestor=$(ls "$raiz"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -n "$gestor" ] || { echo "::error::no hay sdkmanager en $raiz"; exit 1; }
          yes | "$gestor" --licenses > /dev/null 2>&1 || true
          "$gestor" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "SDK: $raiz"

      # Este proyecto no lleva envoltorio de Gradle: lo pone la acción, y así
      # no hay un binario de 60 KB versionado que nadie revisa.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Sin llave propia el .apk sale firmado con una que se fabrica aquí, y
      # entonces actualizar encima exige desinstalar primero. Con las cuatro
      # claves puestas en el repositorio, el .apk se actualiza solo encima del
      # anterior. Se crea con herramientas/crear-llave-android.sh
      - name: Preparar la llave de firma
        id: llave
        env:
          ALMACEN: ${{ secrets.ANDROID_ALMACEN_BASE64 }}
          CLAVE_ALMACEN: ${{ secrets.ANDROID_CLAVE_ALMACEN }}
          ALIAS: ${{ secrets.ANDROID_ALIAS }}
          CLAVE_LLAVE: ${{ secrets.ANDROID_CLAVE_LLAVE }}
        run: |
          set -euo pipefail
          ruta="$RUNNER_TEMP/firma.jks"
          if [ -n "${ALMACEN:-}" ] && [ -n "${CLAVE_ALMACEN:-}" ] \
             && [ -n "${ALIAS:-}" ] && [ -n "${CLAVE_LLAVE:-}" ]; then
            printf '%s' "$ALMACEN" | base64 -d > "$ruta"
            echo "propia=sí" >> "$GITHUB_OUTPUT"
            echo "CLAVE_ALMACEN=$CLAVE_ALMACEN" >> "$GITHUB_ENV"
            echo "ALIAS_LLAVE=$ALIAS" >> "$GITHUB_ENV"
            echo "CLAVE_LLAVE=$CLAVE_LLAVE" >> "$GITHUB_ENV"
            echo "Se firma con la llave del repositorio."
          else
            keytool -genkeypair -v -keystore "$ruta" \
              -alias ronda -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass provisional -keypass provisional \
              -dname "CN=FixMate Ronda CIL, OU=Mantenimiento, O=FixMate, L=Lima, C=PE"
            echo "propia=no" >> "$GITHUB_OUTPUT"
            echo "CLAVE_ALMACEN=provisional" >> "$GITHUB_ENV"
            echo "ALIAS_LLAVE=ronda" >> "$GITHUB_ENV"
            echo "CLAVE_LLAVE=provisional" >> "$GITHUB_ENV"
            echo "::warning::sin llave propia: el .apk sale con una firma"\
                 "provisional y actualizar encima exigirá desinstalar antes."
          fi
          echo "ALMACEN_LLAVES=$ruta" >> "$GITHUB_ENV"

      - name: Compilar
        working-directory: movil/fixmate-ronda/android
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PcodigoVersion=${{ github.run_number }} \
            -PnombreVersion=1.${{ github.run_number }} \
            -PalmacenLlaves="$ALMACEN_LLAVES" \
            -PclaveAlmacen="$CLAVE_ALMACEN" \
            -PaliasLlave="$ALIAS_LLAVE" \
            -PclaveLlave="$CLAVE_LLAVE"

      # Un .apk que compila puede estar vacío por dentro: si la tarea que trae
      # la pantalla no hizo nada, lo que se instala es un rectángulo negro.
      - name: Comprobar lo que lleva dentro
        run: |
          set -euo pipefail
          apk=$(ls movil/fixmate-ronda/android/app/build/outputs/apk/release/*.apk | head -1)
          herramientas=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          echo "::group::identidad"
          "$herramientas/aapt2" dump badging "$apk" | \
            grep -E "^(package|application-label|launchable-activity|uses-permission|sdkVersion|targetSdkVersion)"
          echo "::endgroup::"

          echo "::group::firma"
          "$herramientas/apksigner" verify --verbose --print-certs "$apk"
          echo "::endgroup::"

          echo "::group::la pantalla va dentro"
          python3 - "$apk" <<'PY'
          import hashlib, pathlib, sys, zipfile

          apk = zipfile.ZipFile(sys.argv[1])
          dentro = {n[len("assets/www/"):]: apk.read(n)
                    for n in apk.namelist() if n.startswith("assets/www/")}
          web = pathlib.Path("docs/fixmate/ronda")
          # Dos que se excluyen al copiar: el QR es del sitio publicado, y el
          # trabajador de servicio no pinta nada dentro del APK.
          aparte = {"qr.svg", "sw.js"}
          fuera = {str(a.relative_to(web)): a.read_bytes()
                   for a in web.rglob("*") if a.is_file() and a.name not in aparte}

          faltan = sorted(set(fuera) - set(dentro))
          sobran = sorted(set(dentro) - set(fuera))
          distintos = sorted(n for n in fuera if n in dentro and fuera[n] != dentro[n])
          for titulo, lista in (("faltan", faltan), ("sobran", sobran),
                                ("distintos", distintos)):
              if lista:
                  print(f"::error::{titulo} en el .apk: {lista[:8]}")
          if faltan or sobran or distintos:
              sys.exit("el .apk no lleva la misma pantalla que se publica")

          indice = dentro["index.html"].decode("utf-8")
          for senal in ("PuenteFixMate", "function atras()", "NO PUDE VER"):
              if senal not in indice:
                  sys.exit(f"la pantalla de dentro no está completa: falta {senal}")
          if "sw.js" in dentro:
              sys.exit("el trabajador de servicio se coló en el .apk")
          print(f"{len(dentro)} archivos, index.html {len(dentro['index.html'])} B, "
                f"sha256 {hashlib.sha256(dentro['index.html']).hexdigest()[:16]}")
          PY
          echo "::endgroup::"

          cp "$apk" "$RUNNER_TEMP/$ARCHIVO"
          echo "APK=$RUNNER_TEMP/$ARCHIVO" >> "$GITHUB_ENV"
          echo "SHA=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "PESO=$(du -h "$apk" | cut -f1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: fixmate-ronda-apk
          path: ${{ env.APK }}
          retention-days: 90
          if-no-files-found: error

      # Publicar sólo desde `main`: la dirección de descarga es una sola y no
      # puede quedarse apuntando a lo que se estaba probando en una rama.
      #
      # Una publicación por compilación, con el .apk dentro desde el primer
      # momento: aquí las publicaciones nacen INMUTABLES y no admiten que se
      # les cuelgue nada después.
      #
      # Sin `--latest` a propósito: esa dirección la usa el .apk de las actas
      # de RD RENTAL, y su QR está impreso en un taller.
      - name: Publicar para descargar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMA_PROPIA: ${{ steps.llave.outputs.propia }}
        run: |
          set -euo pipefail
          etiqueta="fixmate-ronda-v${{ github.run_number }}"
          notas="$RUNNER_TEMP/notas.md"
          {
            echo "Ronda CIL de FixMate —limpiar, inspeccionar, lubricar— para Android."
            echo
            echo "- Versión **1.${{ github.run_number }}**"
            echo "- Compilada de \`${{ github.sha }}\`"
            echo "- SHA-256 \`$SHA\`"
            echo
            echo "## Cómo se instala"
            echo
            echo "1. Descargue **$ARCHIVO** desde el teléfono."
            echo "2. Ábralo desde Archivos o Descargas."
            echo "3. Android pedirá permitir instalar desde esa fuente: acepte."
            echo
            echo "No pide permiso de INTERNET: la ronda no habla con nadie."
            echo "Lo que el operador registra se queda en el teléfono hasta que"
            echo "él mismo lo exporte, y el archivo de la ronda se guarda en"
            echo "Descargas."
            echo
            echo "La misma pantalla, sin instalar nada, está en"
            echo "<https://nilthonnn.github.io/nefer/fixmate/ronda/>."
            if [ "$FIRMA_PROPIA" != "sí" ]; then
              echo
              echo "> **Firma provisional.** Para instalar una versión nueva hay que"
              echo "> desinstalar antes la anterior."
            fi
          } > "$notas"

          gh release create "$etiqueta" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FixMate · Ronda CIL 1.${{ github.run_number }}" \
            --notes-file "$notas" \
            --latest=false

          # Si el archivo no quedó dentro, la dirección da 404 y nadie se entera
          # hasta que alguien intenta instalarla.
          sleep 3
          gh release view "$etiqueta" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -qx "$ARCHIVO" || {
              echo "::error::la publicación $etiqueta salió sin el .apk"
              exit 1
            }

          descarga="https://github.com/$GITHUB_REPOSITORY/releases/download/$etiqueta/$ARCHIVO"
          {
            echo "## APK listo"
            echo ""
            echo "**Descarga:** $descarga"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Versión | 1.${{ github.run_number }} |"
            echo "| Tamaño | $PESO |"
            echo "| SHA-256 | \`$SHA\` |"
            echo "| Firma propia | $FIRMA_PROPIA |"
          } >> "$GITHUB_STEP_SUMMARY"
