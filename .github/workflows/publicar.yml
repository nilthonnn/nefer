name: publicar

# Publica docs/ en GitHub Pages, que es lo que pone la aplicacion al alcance
# del telefono. Desde un archivo descargado el permiso de camara sale denegado
# y no hay forma de concederlo: hace falta un origen servido.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publicar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicacion en curso no se cancela: dejaria el sitio a medias. Las que
# lleguen mientras tanto esperan su turno.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    name: publicar la app en Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # `enablement` intenta encender Pages si estaba apagado. Lo consigue
      # cuando el sitio ya existe o el token puede crearlo; la primera vez de
      # un repositorio no puede: crear el sitio pide permiso de administracion
      # y GITHUB_TOKEN no lo tiene. Medido aqui: la API responde `Resource not
      # accessible by integration`. Por eso no se deja morir el paso con ese
      # error suelto, sino que se dice que falta y donde se pone.
      - name: Preparar Pages
        id: preparar
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Decir qué falta si Pages está apagado
        if: steps.preparar.outcome == 'failure'
        run: |
          {
            echo "### Falta encender Pages, una sola vez"
            echo ""
            echo "**Ajustes → Pages → Build and deployment → Source: GitHub Actions.**"
            echo ""
            echo "Crear el sitio pide permiso de administración y el token de"
            echo "Actions no lo tiene, así que este workflow no puede hacerlo"
            echo "por su cuenta. Puesto el interruptor, se vuelve a lanzar este"
            echo "workflow y la app queda publicada; los cambios siguientes ya"
            echo "se publican solos."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Pages está apagado: Ajustes → Pages → Source: GitHub Actions"
          exit 1

      - name: Empaquetar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: despliegue
        uses: actions/deploy-pages@v4

      - name: Decir dónde quedó
        run: |
          echo "### La app está publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sitio: ${{ steps.despliegue.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- App de campo: ${{ steps.despliegue.outputs.page_url }}app/" >> "$GITHUB_STEP_SUMMARY"
