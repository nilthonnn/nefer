name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la comprobacion anterior: importa
# si la punta esta verde, no si lo estuvo hace tres commits.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: núcleo (generador, esquema, textos y FixMate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # El camino de PostgreSQL se prueba contra una base de verdad. Sin ella
    # las pruebas se saltarían solas, y una suite que se salta sola pasa
    # igual: por eso abajo va FIXMATE_PG_EXIGIR, que convierte el salto en
    # fallo.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: fixmate
          POSTGRES_DB: fixmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FIXMATE_PG_DSN: "host=localhost port=5432 user=postgres password=fixmate dbname=fixmate"
      FIXMATE_PG_EXIGIR: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      # Los cruces de las dos pantallas espejadas corren su JavaScript con
      # node, y sin node se saltan solos. Una suite que se salta sola pasa
      # igual, asi que la falta se mira aqui y cuenta como fallo.
      - name: Node, para los cruces de las pantallas
        run: node --version

      - name: Probar
        run: |
          python -m pytest -q \
            tests/test_android.py \
            tests/test_build_extract.py \
            tests/test_codigos_qr.py \
            tests/test_demo_fixmate.py \
            tests/test_fixmate_activos.py \
            tests/test_fixmate_anomalia.py \
            tests/test_fixmate_api.py \
            tests/test_fixmate_aprendizaje.py \
            tests/test_fixmate_catalogo.py \
            tests/test_fixmate_cierre.py \
            tests/test_fixmate_cli_rcm.py \
            tests/test_fixmate_criticidad.py \
            tests/test_fixmate_cruce.py \
            tests/test_fixmate_cruce_rcm.py \
            tests/test_fixmate_cruce_ronda.py \
            tests/test_fixmate_decision.py \
            tests/test_fixmate_documentos.py \
            tests/test_fixmate_espejo.py \
            tests/test_fixmate_fmeca.py \
            tests/test_fixmate_historial_bloques.py \
            tests/test_fixmate_indexado.py \
            tests/test_fixmate_indice.py \
            tests/test_fixmate_ingesta.py \
            tests/test_fixmate_integracion_rcm_tpm.py \
            tests/test_fixmate_motor.py \
            tests/test_fixmate_pg.py \
            tests/test_fixmate_piel.py \
            tests/test_fixmate_plan.py \
            tests/test_fixmate_prediccion.py \
            tests/test_fixmate_rcm.py \
            tests/test_fixmate_seguridad.py \
            tests/test_fixmate_tablero.py \
            tests/test_fixmate_texto.py \
            tests/test_fixmate_tpm.py \
            tests/test_layout.py \
            tests/test_publicacion_clon.py \
            tests/test_publicacion_fixmate.py \
            tests/test_schema.py \
            tests/test_textos.py

  clon-rd-renta:
    name: la copia de RD RENTA (motor y app)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: clientes/rd-renta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: clientes/rd-renta/pyproject.toml

      - name: Instalar
        run: pip install -e ".[navegador]"

      - name: Navegador
        run: python -m playwright install --with-deps chromium

      # La app de la copia ya no es la del proyecto de origen: lleva el
      # encuadre, los proyectos guardados y el puente del contenedor de
      # Android, y es la que va dentro del .apk que se instala en el telefono.
      # Si aqui no se conduce, nada la prueba antes de que llegue al patio.
      - name: Probar
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            tests/test_app_navegador.py \
            tests/test_build_extract.py \
            tests/test_layout.py \
            tests/test_schema.py \
            tests/test_textos.py | tee salida.txt

      # Si el navegador no apareciera, la suite se saltaria sola y esto saldria
      # verde sin haber conducido nada.
      - name: Ninguna prueba se saltó
        run: |
          if grep -qE '[0-9]+ skipped' salida.txt; then
            echo "::error::alguna prueba se saltó; aquí eso cuenta como fallo"
            grep -E '^SKIPPED' salida.txt || true
            exit 1
          fi

  entregables:
    name: entregables (navegador, Excel y PDF de verdad)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[navegador]"

      - name: Navegador
        run: python -m playwright install --with-deps chromium

      - name: Lector de PDF y hoja de cálculo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v soffice >/dev/null \
            || sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Si falta una herramienta, las pruebas que la usan se saltan solas y la
      # comprobacion sale verde sin haber validado nada. Se comprueba antes de
      # correr, para que la falta se vea como lo que es: un error.
      #
      # El navegador se abre de verdad en vez de buscar su archivo: la forma de
      # la carpeta cambia entre versiones de Playwright y adivinarla es lo que
      # hace que una suite se salte sola. Abrirlo no admite discusion.
      - name: Comprobar que están todas las herramientas
        run: |
          python - <<'PY'
          import shutil, sys
          sys.path.insert(0, "tests")
          from navegador import CHROME, HAY_CHROMIUM, opciones
          from playwright.sync_api import sync_playwright

          faltan = [n for n, hay in (
              ("pdftotext", bool(shutil.which("pdftotext"))),
              ("LibreOffice", bool(shutil.which("soffice") or shutil.which("libreoffice"))),
          ) if not hay]
          if faltan:
              sys.exit("sin " + ", ".join(faltan) + ": las pruebas se saltarían solas")

          SONDA = """async () => {
            try {
              const s = await navigator.mediaDevices.getUserMedia({video: true});
              s.getTracks().forEach(t => t.stop());
              return 'concedida';
            } catch (e) { return 'rechazada:' + e.name; }
          }"""

          # Se abre el navegador y se le pide la cámara: es lo que hace la
          # suite, y el binario recortado que Playwright usa por omisión no la
          # trae. Comprobarlo aquí evita descubrirlo tres minutos después.
          # Hace falta servirla: `getUserMedia` sólo existe en un origen
          # seguro, y 127.0.0.1 lo es.
          import functools, http.server, socketserver, threading

          manejador = functools.partial(http.server.SimpleHTTPRequestHandler,
                                        directory="docs/app")
          manejador.log_message = lambda *a, **k: None

          class Servidor(socketserver.TCPServer):
              allow_reuse_address = True

          servidor = Servidor(("127.0.0.1", 0), manejador)
          threading.Thread(target=servidor.serve_forever, daemon=True).start()
          puerto = servidor.server_address[1]

          with sync_playwright() as pw:
              navegador = pw.chromium.launch(
                  **opciones(args=["--use-fake-device-for-media-stream"]))
              pagina = navegador.new_context(permissions=["camera"]).new_page()
              pagina.goto(f"http://127.0.0.1:{puerto}/")
              camara = pagina.evaluate(SONDA)
              navegador.close()
          servidor.shutdown()
          print("Chromium:", CHROME or "el completo de Playwright", "· cámara:", camara)
          if camara != "concedida":
              sys.exit("el navegador no da la cámara (" + camara + ")")

          # Y las pruebas tienen que verlo igual que lo vio esta comprobación.
          if not HAY_CHROMIUM:
              sys.exit("el navegador abre, pero las pruebas no lo dan por "
                       "disponible y se saltarían: revisar tests/navegador.py")
          PY

      - name: Probar
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            tests/test_app_navegador.py \
            tests/test_autoguardado.py \
            tests/test_entregables_app.py \
            tests/test_fixmate_app_navegador.py \
            tests/test_fixmate_rcm_navegador.py \
            tests/test_fixmate_ronda_navegador.py \
            tests/test_puente_android.py | tee salida.txt

      # Una prueba saltada aqui no es una prueba: deja pasar un fallo real sin
      # que nadie lo note. Con las herramientas ya comprobadas, un salto solo
      # puede venir de un descuido, y se trata como un fallo.
      - name: Ninguna prueba se saltó
        run: |
          if grep -qE '[0-9]+ skipped' salida.txt; then
            echo "::error::alguna prueba se saltó; aquí eso cuenta como fallo"
            grep -E '^SKIPPED' salida.txt || true
            exit 1
          fi

  # La app de estados financieros es un proyecto aparte: no comparte código
  # ni datos con las actas, así que se prueba sola y su fallo no tapa a los
  # demás, ni al revés.
  eeff:
    name: estados financieros MYPE (navegador)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[navegador]" openpyxl

      - name: Navegador
        run: python -m playwright install --with-deps chromium

      - name: Probar
        run: |
          set -o pipefail
          python -m pytest -q -rs tests/test_eeff_navegador.py | tee salida.txt

      - name: Ninguna prueba se saltó
        run: |
          if grep -qE '[0-9]+ skipped' salida.txt; then
            echo "::error::alguna prueba se saltó; aquí eso cuenta como fallo"
            grep -E '^SKIPPED' salida.txt || true
            exit 1
          fi

  camal:
    name: la app del camal (navegador, Excel, PDF y puente)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # pypdf no es del paquete: sólo lo usan estas pruebas, para abrir el acta
      # con una librería ajena a la app y comprobar que dice lo mismo.
      - name: Instalar
        run: pip install -e ".[navegador]" pypdf

      - name: Navegador
        run: python -m playwright install --with-deps chromium

      # Las tres formas de la app salen de un solo original. Si alguien editó
      # una a mano, aquí se ve: en el camal se vería tres semanas después.
      - name: Lo generado está al día
        run: |
          python3 demos/camal/construir.py
          if ! git diff --quiet -- docs/camal demos/camal; then
            echo "::error::hay salidas editadas a mano. Corre python3 demos/camal/construir.py y vuelve a subir."
            git --no-pager diff --stat -- docs/camal demos/camal
            exit 1
          fi

      - name: La jornada, de punta a punta
        run: python3 demos/camal/probar_lotes.py salidas/

      - name: Como app instalable, y sin señal
        run: python3 demos/camal/probar_android.py salidas/

      - name: El puente con Android
        run: python3 demos/camal/probar_puente.py salidas/
