name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Un push nuevo sobre la misma rama cancela la comprobacion anterior: importa
# si la punta esta verde, no si lo estuvo hace tres commits.
concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: núcleo (generador, esquema y textos)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Probar
        run: |
          python -m pytest -q \
            tests/test_build_extract.py \
            tests/test_layout.py \
            tests/test_schema.py \
            tests/test_textos.py

  entregables:
    name: entregables (navegador, Excel y PDF de verdad)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar
        run: pip install -e ".[navegador]"

      - name: Navegador
        run: python -m playwright install --with-deps chromium

      - name: Lector de PDF y hoja de cálculo
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          command -v soffice >/dev/null \
            || sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Si falta una herramienta, las pruebas que la usan se saltan solas y la
      # comprobacion sale verde sin haber validado nada. Se mira antes de
      # correr, para que la falta se vea como lo que es: un error.
      - name: Comprobar que están todas las herramientas
        run: |
          python - <<'PY'
          import shutil, sys
          sys.path.insert(0, "tests")
          from navegador import CHROME, HAY_CHROMIUM

          faltan = [n for n, hay in (
              ("Chromium", HAY_CHROMIUM),
              ("pdftotext", bool(shutil.which("pdftotext"))),
              ("LibreOffice", bool(shutil.which("soffice") or shutil.which("libreoffice"))),
          ) if not hay]
          if faltan:
              sys.exit("sin " + ", ".join(faltan) + ": las pruebas se saltarían solas")
          print("Chromium:", CHROME or "el que instaló Playwright")
          PY

      - name: Probar
        run: |
          set -o pipefail
          python -m pytest -q -rs \
            tests/test_app_navegador.py \
            tests/test_entregables_app.py | tee salida.txt

      # Una prueba saltada aqui no es una prueba: deja pasar un fallo real sin
      # que nadie lo note. Con las herramientas ya comprobadas, un salto solo
      # puede venir de un descuido, y se trata como un fallo.
      - name: Ninguna prueba se saltó
        run: |
          if grep -qE '[0-9]+ skipped' salida.txt; then
            echo "::error::alguna prueba se saltó; aquí eso cuenta como fallo"
            grep -E '^SKIPPED' salida.txt || true
            exit 1
          fi
